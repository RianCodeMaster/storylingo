  <p style="font-size: 15px; margin: 0 0 16px">Your Qissio code:</p>
  <p style="font-size: 34px; font-weight: bold; letter-spacing: 8px; margin: 0 0 16px">{{ .Token }}</p>

  <p style="font-size: 13px; color: #64748b; margin: 0">Typ deze code in de app. Een uur geldig.</p>

</div>
