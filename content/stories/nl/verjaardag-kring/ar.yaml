- key: s2
  source: 9dd53e72c346c827
  translation: 'في الساعة الثالثة وصلت الكعكة: طولها أربعة أمتار وعليها خمسون شمعة. وُضعت الكعكة على الطاولة في وسط الحلقة
    ونظر إليها الجميع. وبعد أن أطفأ يايرون الشموع، أراد أن يقطعها. لكن الكعكة كانت قد اختفت! وصرخ الناس بصوت عالٍ حتى سمعهم
    الجيران في الشارع كله.'
