- key: s4
  source: 552450f7010db5bf
  translation: 'من أجل الكعكة الثالثة وضعوا خطة: أُغلق الباب بالمفتاح ووُضع الكلب في الحديقة. كانوا سيبقون جميعًا ينظرون إلى
    الكعكة دون أن يرمشوا. لكن حين وصلت الكعكة، أصبح الجو حارًا في الغرفة لدرجة أن الجميع أغمض عينيه لثانية. وبعد أن فتحوا
    عيونهم مرة أخرى، رأوا طاولة فارغة وأثرًا طويلًا من الفتات.'
