- key: s3
  source: 708927c45b397bc7
  translation: 'اتصل يايرون بالخباز، فتم إحضار كعكة ثانية فورًا، أكبر من الأولى. كان على الضيوف الآن أن ينتبهوا جيدًا: عشرة
    أشخاص نظروا إلى الكعكة عشر دقائق. لكن بعد أن ذهب أحدهم إلى المرحاض لحظة، كانت الكعكة قد اختفت مرة أخرى. كانت الجدة أنس
    ستحلف أنها لم ترَ شيئًا.'
