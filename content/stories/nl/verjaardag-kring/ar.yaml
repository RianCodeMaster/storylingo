summary: يحتفل يايرون بعيد ميلاده الخمسين في حلقة كراسي هولندية تقليدية، لكن كل كعكة يقدمها تختفي في اللحظة التي لا ينتبه
  فيها أحد.
summary_source: bfca2910ed0d56eb
gestures:
  after: 'تشير إلى الوراء، تصفق مرة، تفرقع أصابعك وتنقر ساعتك كأنك تقول: انتهى — وبعدها فقط حدث الشيء التالي.'
  became: تنفخ خديك ببطء وتفتح ذراعيك كأنك تتحول من صغير إلى ضخم، وتنتهي بوضعية مفاجئة تشبه «تادا!».
  would: تميل إلى الوراء، تطوي ذراعيك، تنظر بحلم إلى السقف وترسم دائرة كبيرة في الهواء بإصبعك كأنك تخطط لشيء في المستقبل.
targets:
  nadat:
    gloss: بعد أن
    note: في الهولندية يأتي الفعل في نهاية الجملة بعد nadat، بخلاف العربية.
  werd:
    gloss: أصبح/تم
    note: فعل ماضٍ للمفرد، يُستخدم للمبني للمجهول أو لتحول الحالة.
  zouden:
    gloss: كانوا سـ/سوف
    note: صيغة جمع من zou، تفيد الشرط أو المستقبل في الماضي.
scenes:
- key: s1
  source: 99e47d4b5ea9a9a2
  translation: بلغ يايرون الخمسين، وكان في الأصل لا ينوي الاحتفال به، لكن عائلته أرادت عيد ميلاد هولنديًا حقيقيًا. جلس كل
    الضيوف في دائرة كبيرة قرب الحائط، يحملون فنجان قهوة وبسكويتة واحدة بالضبط. كانوا سيأكلون الكعكة في الساعة الثالثة، فقد
    وعدهم يايرون بذلك. وبعد أن هنّأه الجميع مرة واحدة، أصبحت الغرفة صامتة تمامًا.
