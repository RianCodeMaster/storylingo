- key: s5
  source: 1cd7360f0f671a55
  translation: 'كان أثر الفتات يمتد عبر الغرفة، إلى الحديقة، وصولًا إلى عنزة الجيران. أصبحت العنزة فورًا المشتبه به الرئيسي،
    لكنها نظرت ببراءة شديدة. وبعد أن أعطاها يايرون قطعة كبيرة من الكعكة، أصبحت الضيف الرابع عشر في الحلقة. قال الضيوف: «في
    السنة القادمة، يجب أن نأكل الكعكة ببساطة خلال دقيقة!». بلغ يايرون الخمسين، لكن هذا كان أفضل عيد ميلاد في حياته.'
