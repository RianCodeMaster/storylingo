# A story, in its target language. Edit freely, then: storylingo.py sync  (and media / localize / check as it says).
# Keys (s2, s2q3) name a scene or question for good: keep them when you change a text, so learners keep their
# history. A new scene or question may leave its key out; sync gives it one. status: draft or published.
slug: verjaardag-kring
status: published
tags: [algemeen, dagelijks]
brief:
  language: nl
  level: B1
  theme: Jeroen viert zijn verjaardag op z'n Hollands met iedereen in een kring, maar de taart verdwijnt steeds als niemand
    kijkt
  scenes: 5
  targets:
  - text: nadat
    gloss: after (verb at the end)
    concept: after
    kind: word
  - text: werd
    gloss: became / was (passive)
    concept: became
    kind: word
  - text: zouden
    gloss: would (plural)
    concept: would
    kind: word
  narrator: charlie
story:
  title: Jeroen en de taart die steeds verdween
  summary: Jeroen celebrates his fiftieth birthday in a typical Dutch circle of chairs, but every cake he serves vanishes
    the moment nobody is looking.
  gestures:
  - concept: after
    description: You point behind you, clap once, snap your fingers and tap your watch as if to say 'done — and only THEN
      did the next thing happen'.
    emoji: ⏭️
  - concept: became
    description: You slowly puff out your cheeks and spread your arms wide as if you are transforming from tiny to enormous,
      ending in a surprised 'ta-da!' pose.
    emoji: 🦋
  - concept: would
    description: You lean back, fold your arms, look dreamily at the ceiling and draw a big imaginary circle in the air with
      one finger, as if planning something in the future.
    emoji: 🔮
  scenes:
  - key: s1
    text: Jeroen werd vijftig en hij zou het eigenlijk niet vieren, maar zijn familie wilde een echt Hollandse verjaardag.
      Alle gasten zaten in een grote kring tegen de muur, met een kopje koffie en precies één koekje. Ze zouden om drie uur
      taart eten, dat had Jeroen beloofd. Nadat iedereen hem één keer had gefeliciteerd, werd het helemaal stil in de kamer.
    image_prompt: A Dutch living room with chairs pushed against every wall in a big circle. Jeroen, a fifty-year-old Dutch
      man with round glasses, a bald spot, a small mustache and a bright orange sweater, sits in the circle holding a tiny
      coffee cup. Twelve guests sit stiffly with one small cookie each on their saucers. A clock on the wall shows three o'clock.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Zaten de gasten in een grote kring tegen de muur?
      options: [Ja, Nee]
      answer: Ja
    - key: s1q2
      kind: either_or
      prompt: Hoeveel koekjes kreeg elke gast bij de koffie?
      options: [Tien koekjes, Eén koekje]
      answer: Eén koekje
    - key: s1q3
      kind: who_what
      prompt: Wie wilde een echt Hollandse verjaardag?
      options: [De familie van Jeroen, Jeroen zelf, De bakker]
      answer: De familie van Jeroen
    - key: s1q4
      kind: yes_no
      prompt: Zouden de gasten om drie uur taart eten?
      options: [Ja, Nee]
      answer: Ja
      target: zouden
    - key: s1q5
      kind: either_or
      prompt: Wat gebeurde er nadat iedereen Jeroen had gefeliciteerd?
      options: [De kamer werd stil, De gasten gingen naar huis]
      answer: De kamer werd stil
      target: nadat
