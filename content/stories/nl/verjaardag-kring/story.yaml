  - key: s3
    text: 'Jeroen belde de bakker en er werd meteen een tweede taart gebracht, nog groter dan de eerste. De gasten zouden
      nu goed opletten: tien mensen keken tien minuten lang naar de taart. Maar nadat iemand even naar de wc was gegaan, was
      de taart alweer verdwenen. Oma Ans zou zweren dat ze niets had gezien.'
    image_prompt: The same Dutch living room. Ten guests sit on the edge of their chairs, eyes wide open, all staring at a
      huge cake on the table. Jeroen, with his round glasses, bald spot, mustache and orange sweater, points at the cake like
      a police officer. In the background an old lady with a handbag looks innocently at the ceiling.
    questions:
    - key: s3q1
      kind: yes_no
      prompt: Werden er drie nieuwe taarten tegelijk gebracht?
      options: [Ja, Nee]
      answer: Nee
      target: werd
    - key: s3q2
      kind: either_or
      prompt: Hoe lang keken de gasten naar de tweede taart?
      options: [Tien seconden, Tien minuten]
      answer: Tien minuten
    - key: s3q3
      kind: who_what
      prompt: Wie ging weg, waarna de taart verdween?
      options: [Iemand naar de wc, De bakker naar huis, De hond naar de tuin]
      answer: Iemand naar de wc
      target: nadat
    - key: s3q4
