  - key: s5
    text: Het spoor van kruimels liep door de kamer, naar de tuin, naar de geit van de buren. De geit werd meteen de hoofdverdachte,
      maar ze keek heel onschuldig. Nadat Jeroen de geit een groot stuk taart had gegeven, werd ze de veertiende gast in de
      kring. 'Volgend jaar,' zeiden de gasten, 'zouden we de taart gewoon binnen één minuut moeten opeten!' Jeroen werd vijftig,
      maar dit was de beste verjaardag van zijn leven.
    image_prompt: The same Dutch living room, now with a goat wearing a paper party hat sitting calmly in the circle of chairs
      next to Jeroen, who has round glasses, a bald spot, a mustache and an orange sweater and is laughing with his hands
      in the air. Guests raise their coffee cups, crumbs everywhere on the floor.
    questions:
    - key: s5q1
      kind: who_what
      prompt: Naar wie liep het spoor van kruimels?
      options: [Naar de geit van de buren, Naar de bakker, Naar de hond]
      answer: Naar de geit van de buren
    - key: s5q2
      kind: yes_no
      prompt: Werd de geit de veertiende gast in de kring?
      options: [Ja, Nee]
      answer: Ja
      target: werd
    - key: s5q3
      kind: either_or
      prompt: Wat zeiden de gasten dat ze volgend jaar zouden doen?
      options: [De taart in de tuin zetten, De taart binnen één minuut opeten]
      answer: De taart binnen één minuut opeten
      target: zouden
    - key: s5q4
      kind: yes_no
      prompt: Gaf Jeroen de geit een stuk taart nadat hij de kruimels had gevolgd?
      options: [Ja, Nee]
      answer: Ja
      target: nadat
    - key: s5q5
      kind: yes_no
      prompt: Had Jeroen een slechte verjaardag?
      options: [Ja, Nee]
      answer: Nee
