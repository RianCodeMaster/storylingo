  - key: s4
    text: 'Voor de derde taart maakten ze een plan: de deur werd op slot gedaan en de hond werd in de tuin gezet. Ze zouden
      allemaal naar de taart blijven kijken zonder te knipperen. Maar toen de taart kwam, werd het zo warm in de kamer dat
      iedereen één seconde zijn ogen sloot. Nadat ze hun ogen weer openden, zagen ze een lege tafel en een lang spoor van
      kruimels.'
    image_prompt: The same Dutch living room with the door locked and a key in the lock. Jeroen, in his orange sweater with
      round glasses and bald spot, sits in the circle with his eyes squeezed shut like the other guests. A third cake stands
      on the table, already half gone, and a clear trail of crumbs runs across the floor toward the garden door.
    questions:
    - key: s4q1
      kind: yes_no
      prompt: Werd de deur op slot gedaan?
      options: [Ja, Nee]
      answer: Ja
      target: werd
    - key: s4q2
      kind: either_or
      prompt: Waar werd de hond gezet?
      options: [In de tuin, In de kamer]
      answer: In de tuin
    - key: s4q3
      kind: who_what
      prompt: Wat zagen ze nadat ze hun ogen weer openden?
      options: [Een lege tafel en kruimels, Een nieuwe taart, De geit in de kring]
      answer: Een lege tafel en kruimels
      target: nadat
    - key: s4q4
