  - key: s2
    text: 'Om drie uur kwam de taart: vier meter lang, met vijftig kaarsjes erop. De taart werd op de tafel in het midden
      van de kring gezet en iedereen keek ernaar. Nadat Jeroen de kaarsjes had uitgeblazen, wilde hij de taart aansnijden.
      Maar de taart was weg! Er werd zo hard geschreeuwd dat de buren het in de hele straat hoorden.'
    image_prompt: The same Dutch living room, now with an enormous four-meter-long cake on a small table in the middle of
      the circle of chairs. Jeroen, the fifty-year-old man with round glasses, bald spot, mustache and orange sweater, holds
      a knife and stares at the empty table with his mouth wide open. Guests stand up in shock, one woman has her hands on
      her cheeks.
    questions:
    - key: s2q1
      kind: yes_no
      prompt: Was de taart vier meter lang?
      options: [Ja, Nee]
      answer: Ja
    - key: s2q2
      kind: either_or
      prompt: Hoeveel kaarsjes stonden er op de taart?
      options: [Vijftig kaarsjes, Vijf kaarsjes]
      answer: Vijftig kaarsjes
    - key: s2q3
      kind: who_what
      prompt: Wat was er weg nadat Jeroen de kaarsjes had uitgeblazen?
      options: [De taart, De tafel, De koffie]
      answer: De taart
      target: nadat
    - key: s2q4
      kind: yes_no
      prompt: Keken de gasten naar hun koffie in plaats van naar de taart?
      options: [Ja, Nee]
      answer: Nee
    - key: s2q5
      kind: yes_no
      prompt: Werd de taart op de tafel in het midden van de kring gezet?
      options: [Ja, Nee]
      answer: Ja
      target: werd
