# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Emma's new neighbor is a cow that sings at six every morning, and her funny plan makes the cow write a letter.
summary_source: 204357f54b81507a
gestures:
  have: Hug a giant invisible box to your chest and nod proudly, as if you own it.
  live: Make a little roof over your head with both hands, then pat the floor where you stand.
  every_morning: Make a sun with your fingers, then yawn and mime drinking coffee in a big daily loop.
targets:
  heeft:
    gloss: has
    note: Dutch 'heeft' is the 3rd-person singular of 'hebben', like English 'has'.
  woont:
    gloss: lives
    note: Dutch adds -t for 'he'/'she'/'it' in 'woont'; English adds -s in 'lives'.
  elke ochtend:
    gloss: every morning
    note: Dutch uses 'elke' before a singular common noun; English uses 'every'.
