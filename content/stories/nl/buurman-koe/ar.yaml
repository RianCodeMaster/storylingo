summary: جار إيما الجديد بقرة تغني كل صباح في السادسة، وخطتها الطريفة تجعل البقرة تكتب رسالة.
summary_source: 204357f54b81507a
gestures:
  have: احضن صندوقًا خياليًا كبيرًا إلى صدرك وأومئ بفخر كأنك تملكه.
  live: اصنع سقفًا صغيرًا بيديك فوق رأسك ثم اربت على الأرض حيث تقف.
  every_morning: اصنع شمسًا بأصابعك ثم تثاءب وقلّد شرب القهوة في حركة يومية متكررة.
targets:
  heeft:
    gloss: لديها/يملك
    note: يتغيّر الفعل الهولندي مع الفاعل مثل العربية.
  woont:
    gloss: تسكن/تعيش
    note: يأتي الفعل بعد الفاعل كما في العربية غالبًا.
  elke ochtend:
    gloss: كل صباح
    note: elke يأتي قبل الاسم المفرد مثل «كل» في العربية.
