story:
  title: Joris en de tien soorten hagelslag
  summary: Joris searches a whole supermarket for hagelslag, has to ask everybody, and ends up with ten strange kinds — while
    at home there are already forty packets.
  gestures:
  - concept: search
    description: Make binoculars with both hands around your eyes and slowly turn your head left and right, humming like you
      are looking for something.
    emoji: 🔍
  - concept: must
    description: Point a strict finger at yourself, stomp one foot and puff out your cheeks like a bossy teacher.
    emoji: 😤
  - concept: get
    description: Hold out both open hands, then snap them shut and pull them to your chest with a big happy grin, like catching
      a flying present.
    emoji: 🎁
