- key: s4
  source: 80fc0d94e1276c0e
  translation: 'بحث ولد من المتجر في حوض الكرات. بحث في حذائه وفي قبعته. ثم حصل يوريس على عشرة أنواع من رقائق الشوكولاتة:
    بنفسجية وخضراء ورقائق بنجوم صغيرة. كان عليه أن يعدّها كلها العشرة.'
