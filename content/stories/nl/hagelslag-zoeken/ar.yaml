- key: s3
  source: f714c33d89306303
  translation: بحثت أمينة الصندوق في حقيبتها. بحثت تحت صندوق الدفع وفي جيب معطفها. حصل يوريس على كيس صغير من رقائق الشوكولاتة.
    كان فيه فقط ثلاث حبات، لذلك كان عليه أن يسأل مرة أخرى.
