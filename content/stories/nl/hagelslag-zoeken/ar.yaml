summary: يبحث يوريس في كل السوبرماركت عن رقائق الشوكولاتة، ويسأل الجميع، وينتهي به الأمر بعشر أنواع غريبة، بينما في البيت
  لديه بالفعل أربعون عبوة.
summary_source: 902361908e4fc015
gestures:
  search: ضع يديك كمنظار حول عينيك وأدر رأسك ببطء يمينًا ويسارًا مع همهمة كأنك تبحث عن شيء.
  must: أشر بإصبع صارم نحو نفسك، واضرب الأرض بقدم واحدة، وانفخ خديّك مثل معلّم متسلط.
  get: مدّ كفّيك المفتوحتين، ثم أغلقهما فجأة واسحبهما إلى صدرك بابتسامة كبيرة كأنك تلتقط هدية طائرة.
targets:
  zocht:
    gloss: بحث / كان يبحث
    note: الماضي من zoeken؛ يأتي غالبًا مع naar بمعنى «بحث عن»، مثل العربية «بحث عن».
  moest:
    gloss: كان عليه / اضطر
    note: الماضي من moeten؛ يعبّر عن ضرورة في الماضي مثل «كان عليه أن».
  kreeg:
    gloss: حصل على
    note: الماضي من krijgen؛ يعني «حصل على / تلقّى»، وليس «أخذ».
