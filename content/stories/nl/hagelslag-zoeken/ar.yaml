- key: s5
  source: 7d0471558cd7d610
  translation: 'بحثت السيدة الأخيرة في حقيبة يدها الضخمة. بحثت وقتًا طويلًا جدًا، وأخيرًا حصل يوريس على النوع العاشر: رقائق
    شوكولاتة بلمعات صغيرة. كان عليه أن يبكي من الفرح. قالت أمه في البيت: «يوريس، لدينا بالفعل أربعون عبوة رقائق شوكولاتة!»'
