- key: s1
  source: 3772a0f331d35b8d
  translation: بحث يوريس عن رقائق الشوكولاتة في السوبرماركت. بحث في رف الخبز ورف البسكويت. بحث أيضًا في المجمّد، لكنه لم يجد
    شيئًا. كان عليه أن يسأل سيدة.
