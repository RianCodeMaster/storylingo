  - key: s3
    text: Op dinsdag zoekt Sophie in de kast en vindt een oude blokfluit van haar broer. Terwijl de wachtmuziek speelt, speelt
      Sophie dezelfde noten mee. De buurman klopt boos op de muur, maar Sophie moet wachten, dus zij speelt verder. 'Ik heb
      gebeld,' zegt zij, 'al twintig keer.'
    image_prompt: Cartoon style. Sophie, the same woman with curly red hair, round glasses, green sweater and yellow socks,
