    text: 'Na een uur zit Sophie nog steeds aan de telefoon. De wachtmuziek is simpel: tien noten, en dan weer tien noten.
      Terwijl zij op de bank zit, neuriet zij de melodie mee. ''Ik moet wachten,'' zegt zij, ''maar ik heb gebeld, dus ik
      blijf.'''
