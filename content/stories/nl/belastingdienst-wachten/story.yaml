    kind: phrase
  - text: moet wachten
    gloss: must wait
    concept: must_wait
    kind: phrase
  narrator: jessica
story:
  title: Drie dagen in de wachtrij
  summary: Sophie calls the tax office about a letter she does not understand, waits three days on hold, learns to play the
    hold music on a recorder, and ends up being hired by their orchestra.
  gestures:
  - concept: while
    description: Hold one flat hand in front of you like a TV screen and stir a big invisible pot in circles with the other
      hand, humming, to show two things happening at the same time.
    emoji: 🔄
  - concept: have_called
    description: Dial an old rotary phone with huge circling finger movements, then slam the receiver to your ear and shout
      'HALLO?'
    emoji: 📞
  - concept: must_wait
    description: Sit down on an invisible chair, drum your fingers on your knee in slow motion, sigh dramatically and tap
      an imaginary watch.
    emoji: ⏰
  scenes:
  - key: s1
    text: 'Sophie de Vries woont in een klein huis in Utrecht. Op maandag ligt er een dikke brief van de Belastingdienst op
      de mat. Sophie leest de brief drie keer, maar zij begrijpt geen woord. Zij pakt haar telefoon en zegt tegen de kat:
      ''Ik heb gebeld. Nu moet ik wachten.'''
    image_prompt: Cartoon style. Sophie, a 34-year-old Dutch woman with curly red hair, round glasses, a green sweater and
      yellow socks, stands in a tiny hallway holding a very thick official letter, a fat orange cat beside her, a telephone
      in her other hand. Bright colours, exaggerated expressions.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Ligt er een brief van de Belastingdienst op de mat?
      options: [Ja, Nee]
      answer: Ja
    - key: s1q2
      kind: who_what
      prompt: Wie begrijpt de brief niet?
      options: [Sophie, de kat, de buurman]
      answer: Sophie
    - key: s1q3
      kind: either_or
      prompt: Leest Sophie de brief drie keer of één keer?
      options: [drie keer, één keer]
      answer: drie keer
    - key: s1q4
      kind: yes_no
      prompt: Begrijpt Sophie de brief meteen?
      options: [Ja, Nee]
      answer: Nee
    - key: s1q5
      kind: who_what
      prompt: Wat zegt Sophie tegen de kat?
      options: [Ik heb gebeld., Ik heb geslapen., Ik heb gedanst.]
      answer: Ik heb gebeld.
      target: heb gebeld
