- key: s4
  source: 489fbe8800971f44
  translation: 'يوم الأربعاء يعرف الشارع كله موسيقى الانتظار. وبينما تعزف صوفي على شرفتها، يرقص ثلاثمئة جار في الشارع. يقرع
    رئيس البلدية الجرس ويسأل إن كانت تريد العزف في عيد المدينة الكبير. تقول صوفي: «لا، عليّ أن أنتظر».'
