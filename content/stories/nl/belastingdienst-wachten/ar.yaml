- key: s3
  source: 6e5097057b30f26b
  translation: 'يوم الثلاثاء تبحث صوفي في الخزانة وتجد نايًا قديمًا لأخيها. وبينما تُعزَف موسيقى الانتظار، تعزف صوفي النغمات
    نفسها معها. يطرق الجار غاضبًا على الحائط، لكن على صوفي أن تنتظر، لذا تواصل العزف. تقول: «لقد اتصلت عشرين مرة بالفعل».'
