- key: s5
  source: bd2fdff141830aac
  translation: 'بعد ثلاثة أيام يُسمَع فجأة صوت حقيقي: «أنت تتحدث مع السيد باكر من مكتب الضرائب»، فتقفز صوفي. تصرخ: «لقد اتصلت!
    وعليّ أن أنتظر منذ ثلاثة أيام!» يضحك الرجل ويقول: «سيدتي، كان الخطاب خطأً صغيرًا. لكننا كنا نستمع إلى نايك طوال ذلك الوقت.
    هل تريدين أن تأتي إلى أوركسترا عندنا؟» وبينما تقول صوفي «نعم»، تبدأ موسيقى الانتظار بالعزف من جديد.'
