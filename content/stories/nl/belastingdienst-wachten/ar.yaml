- key: s2
  source: f4ea450e955631f5
  translation: 'بعد ساعة، ما زالت صوفي على الهاتف. موسيقى الانتظار بسيطة: عشر نغمات، ثم عشر نغمات مرة أخرى. وبينما تجلس على
    الأريكة، تدندن اللحن معها. تقول: «عليّ أن أنتظر، لكنني اتصلت، لذا سأبقى».'
