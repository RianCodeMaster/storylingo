summary: تتصل صوفي بمكتب الضرائب بسبب رسالة لا تفهمها، تنتظر ثلاثًا على الخط، تتعلم عزف موسيقى الانتظار على الناي، وينتهي
  بها الأمر بأن يوظفها أوركسترا المكتب.
summary_source: 3204e82011c6de4b
gestures:
  while: ارفع يدًا مسطحة أمامك كشاشة، وحرّك اليد الأخرى في دوائر كأنك تحرّك قدرًا كبيرًا وتدندن، لتُظهر أمرين يحدثان في الوقت
    نفسه.
  have_called: 'أدِر قرص هاتف قديم بإصبعك بحركات دائرية واسعة، ثم الصق السماعة بأذنك واصرخ: «هالو؟»'
  must_wait: اجلس على كرسي متخيل، واقرع بأصابعك على ركبتك ببطء، وتنهّد ب dramatic، وانظر إلى ساعة متخيلة.
targets:
  terwijl:
    gloss: بينما
    note: في الهولندية يذهب الفعل إلى آخر الجملة الثانوية بعد terwijl، أما العربية فترتيبها أكثر مرونة.
  heb gebeld:
    gloss: اتصلتُ
    note: الهولندية تصنع الماضي التام بـ hebben + اسم المفعول، والعربية غالبًا تكفي بالماضي.
  moet wachten:
    gloss: عليّ أن أنتظر
    note: بعد moet يأتي الفعل في آخر الجملة في الهولندية، بينما العربية تستخدم «يجب/عليّ» + أن + فعل.
scenes:
- key: s1
  source: 410881aa435a58d1
  translation: 'تعيش صوفي دي فريس في بيت صغير في أوترخت. يوم الاثنين يوجد خطاب سميك من مكتب الضرائب على سجادة المدخل. تقرأ
    صوفي الخطاب ثلاث مرات، لكنها لا تفهم كلمة واحدة. تأخذ هاتفها وتقول للقطة: «لقد اتصلت. الآن عليّ أن أنتظر».'
