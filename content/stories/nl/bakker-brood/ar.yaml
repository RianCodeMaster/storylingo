summary: تشتري لوتة رغيف خبز بحجم أريكة، وتأخذه معها في الحافلة، ثم تكتشف أن الخباز يعيش داخله.
summary_source: 994291ce0748a41b
gestures:
  buy: مدّ يدك المفتوحة كأنها منضدة متجر، واضرب عليها عملة بيدك الأخرى، ثم عانق الشيء الذي اشتريته.
  big: افتح ذراعيك إلى أقصى اتساع واملأ خدّيك كبالون ضخم.
  take_along: تخيّل رغيف خبز عملاقًا، ارفعه على كتفك، وسر ثلاث خطوات وأنت تهزّ رأسك.
targets:
  koopt:
    gloss: يشتري
    note: في الهولندية يتصرّف الفعل حسب الفاعل، بخلاف العربية.
  is groot:
    gloss: كبير
    note: 'في العربية لا نستخدم فعل يكون في الحاضر: الخبز كبير.'
  meenemen:
    gloss: يأخذ معه
    note: 'فعل ينفصل في الهولندية: neem ... mee، بخلاف العربية.'
