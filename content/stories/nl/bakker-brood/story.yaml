story:
  title: Lotte en het reuzenbrood
  summary: Lotte buys a loaf of bread as big as a sofa, takes it on the bus, and finds out the baker actually lives inside
    it.
  gestures:
  - concept: buy
    description: Hold out one flat hand like a shop counter and slap a coin into it with the other hand, then hug the imaginary
      thing you bought.
    emoji: 🛒
  - concept: big
    description: Stretch both arms out as wide as you can and puff your cheeks out like a giant balloon.
    emoji: 🎈
  - concept: take_along
    description: Grab an imaginary giant loaf, hoist it onto your shoulder, and march three steps while nodding your head.
    emoji: 🎒
