summary: يوسف لا يعرف ركوب الدراجة، وفجأة عليه أن يوصل كعكة وخزانة تحت المطر لأن الحافلة في إضراب، وكلب ضخم بقبعة صغيرة يزيد
  الأمر سوءًا.
summary_source: f48662cd19d32e05
gestures:
  cannot: ارسم علامة X بذراعيك أمام صدرك، وحرّك رأسك بالنفي، وتمايل كدراجة على وشك السقوط.
  because: اضرب جبهتك بيد واحدة ثم أشِر بإصبعك إلى الشيء أمامك إشارة «آه، هذا هو السبب!».
  suddenly: اقفز وارفع ذراعيك عاليًا وافتح عينيك واسعًا كأن مفاجأة انفجرت في الغرفة.
targets:
  kon niet:
    gloss: لم يستطع
    note: في الهولندية يأتي niet بعد kon، وفي العربية تأتي «لم» قبل الفعل.
  omdat:
    gloss: لأن
    note: بعد omdat يأتي الفعل غالبًا في آخر الجملة، بخلاف العربية.
  opeens:
    gloss: فجأة
    note: null
