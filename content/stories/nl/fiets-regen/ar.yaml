- key: s2
  source: e285149bbd44e062
  translation: 'في صباح أحد الأيام اتصلت عمته. سألت: «هل تأتي إلى حفلتي؟» قال يوسف: «نعم! لكن الحافلة لا تسير اليوم لأن هناك
    إضرابًا». فجأة كان عليه أن يركب الدراجة، لأنه كان عليه أن يحضر كعكة وخزانة إلى الحفلة.'
