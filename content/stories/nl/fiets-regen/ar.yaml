- key: s2
  source: 1a3a882d620ae574
  translation: في صباح أحد الأيام اتصلت عمته. 'هل تأتي إلى حفلتي؟' سألت. 'نعم! لكن الحافلة لا تسير اليوم لأن هناك إضرابًا،'
    قال دان. فجأة وجب عليه أن يركب الدراجة، لأنه كان عليه أن يوصل كعكة وخزانة إلى الحفلة.
