  source: 668c8b3dc74c39a9
  translation: كان دان يعيش في هولندا، لكنه لم يكن يعرف كيف يركب الدراجة. لم يكن يعرف كيف يركب الدراجة لأنه جاء من قرية صغيرة
    في الجبال. كل يوم كان ينظر إلى كل راكبي الدراجات وكان حزينًا.
