  source: 6d1da9a743169ab6
  translation: 'وصل دان إلى الحفلة مبللًا ومتعبًا. ضحكت عمته: ''الكلب أحضر الكعكة بالفعل!'' وفجأة جاءت العائلة كلها أيضًا
