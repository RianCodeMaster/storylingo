- key: s5
  source: b4c361a82f84cf7a
  translation: 'وصل يوسف إلى الحفلة مبللًا ومتعبًا. ضحكت عمته: «الكلب أحضر الكعكة بالفعل!» فجأة جاءت العائلة كلها أيضًا على
    الدراجات، وفي يدها خزانة. لم يستطع يوسف التوقف عن الضحك لأنه أخيرًا استطاع ركوب الدراجة.'
