- key: s1
  source: 693345bc341c9fd1
  translation: كان يوسف يعيش في هولندا، لكنه لم يكن يستطيع ركوب الدراجة. لم يكن يستطيع ركوب الدراجة لأنه جاء من قرية صغيرة
    في الجبال. كل يوم كان ينظر إلى كل راكبي الدراجات وكان حزينًا.
