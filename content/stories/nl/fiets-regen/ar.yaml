- key: s4
  source: 5593125d7d1141f1
  translation: 'فجأة جاء كلب ضخم وعليه قبعة صغيرة. قفز الكلب على الخزانة ونبح بصوت عالٍ جدًا. لم يعد يوسف يستطيع ركوب الدراجة
    لأن الكلب كان ثقيلًا جدًا. صرخ يوسف: «ساعدوني!» فقفز الكلب بعيدًا وهو يحمل الكعكة.'
