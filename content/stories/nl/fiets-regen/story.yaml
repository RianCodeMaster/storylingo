  - key: s2
    text: Op een ochtend belde zijn tante. 'Kom je naar mijn feest?' vroeg ze. 'Ja! Maar de bus rijdt vandaag niet, omdat
      er een staking is,' zei Yusuf. Opeens moest hij fietsen, omdat hij een taart en een kast naar het feest moest brengen.
    image_prompt: Yusuf with curly black hair, round glasses and yellow raincoat holds a phone in one hand and looks in panic
      at a big chocolate cake and a wooden cupboard next to him in a small Dutch living room.
    questions:
    - key: s2q1
