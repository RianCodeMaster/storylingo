  - key: s3
    text: Yusuf zette de taart op zijn hoofd en de kast op zijn rug. Hij ging op de fiets zitten, maar hij viel meteen in
      een plas. Opeens begon het heel hard te regenen. Hij kon niet fietsen, omdat de kast duizend kilo was.
    image_prompt: Yusuf with curly black hair, round glasses and yellow raincoat lies in a big puddle with a bicycle, a chocolate
      cake on his head and a huge wooden cupboard on his back, heavy rain falling on a Dutch street.
    questions:
