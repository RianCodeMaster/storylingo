story:
  title: Yusuf kon niet fietsen
  summary: Yusuf, who cannot ride a bike, must suddenly cycle through the rain with a cake and a cupboard because the bus
    is on strike — and a giant dog with a little hat makes everything worse.
  gestures:
  - concept: cannot
    description: Cross both arms into a big X in front of your chest, shake your head slowly, and wobble like a bike that
      is about to fall over.
    emoji: 🙅
  - concept: because
    description: Slap your forehead with one hand, then point firmly at the thing in front of you — the big 'a-ha, that is
      why!' move.
    emoji: 👉
  - concept: suddenly
    description: Jump up, throw both arms in the air and open your eyes wide, like a surprise party just exploded in the room.
    emoji: 😲
  scenes:
  - key: s1
    text: Yusuf woonde in Nederland, maar hij kon niet fietsen. Hij kon niet fietsen, omdat hij uit een klein dorp in de bergen
      kwam. Elke dag keek hij naar alle fietsers en hij was verdrietig.
    image_prompt: Yusuf, a young man with curly black hair, round glasses and a yellow raincoat, stands sadly on a Dutch street
      corner while a cheerful crowd of cyclists passes by; grey sky, brick houses, one windmill in the background.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Woonde Yusuf in Nederland?
      options: [ja, nee]
      answer: ja
      target: kon niet
    - key: s1q2
      kind: either_or
      prompt: Kon Yusuf niet fietsen omdat hij uit de bergen kwam, of omdat hij te klein was?
      options: [omdat hij uit de bergen kwam, omdat hij te klein was]
      answer: omdat hij uit de bergen kwam
      target: omdat
    - key: s1q3
      kind: who_what
      prompt: Wie keek elke dag naar de fietsers?
      options: [Yusuf, de tante, de hond]
      answer: Yusuf
    - key: s1q4
      kind: yes_no
      prompt: Was Yusuf blij?
      options: [ja, nee]
      answer: nee
