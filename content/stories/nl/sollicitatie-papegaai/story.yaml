      niet te bewegen. Karel gaf een harde schreeuw en gaf een duwtje tegen de deur.'
    image_prompt: A young Dutch woman, Fleur, with curly red hair, green round glasses and a mustard-yellow blazer, standing
      frozen in front of a big office door; on her shoulder sits Karel, a bright green parrot with an orange beak, pushing
      the door with his wing.
