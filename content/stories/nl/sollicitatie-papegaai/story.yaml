story:
  title: Karel de papegaai krijgt de baan
  summary: Fleur has a job interview but is too scared to speak, so her parrot Karel answers every question and gets hired.
  gestures:
  - concept: have
    description: Hug an invisible big box against your chest, then open your empty hands and shrug as if saying 'I had it,
      but that was before'.
    emoji: 📦
  - concept: not_dare
    description: Shrink down small, cover your eyes with one hand and shake your head fast, like you want to disappear.
    emoji: 🙈
  - concept: give
    description: Hold an invisible present with both hands and push it far forward to someone, nodding generously.
    emoji: 🎁
  scenes:
