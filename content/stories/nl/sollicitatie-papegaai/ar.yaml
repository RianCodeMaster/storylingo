- key: s3
  source: 6cdcf5b88160e924
  translation: 'كانت لدى السيدة دي بور سؤال، وكانت تحمل قلمًا في يدها. سألت: «لماذا تريدين هذه الوظيفة؟» لكن فلور فقدت صوتها
    ولم تجرؤ على الإجابة. لم تجرؤ على النظر ولم تجرؤ على البلع. أعطى كاريل إجابة فورية: «أنا أفضل آكل للكعك في هولندا!» أطلقت
    السيدة دي بور ضحكة عالية وأعطت كاريل إطراءً كبيرًا.'
