- key: s5
  source: cb70f43e00a010a2
  translation: 'وقفت السيدة دي بور وصافحت كاريل. «كاريل، أنت حصلت على الوظيفة!» حصل كاريل على الوظيفة، وأطلق صرخة عالية، وأعطى
    فلور قبلة على أنفها. لم تجرؤ فلور على الهتاف، ولم تجرؤ على البكاء، ولم تجرؤ على النظر. أصبح لديها الآن وظيفة أيضًا: كانت
    مساعدة ببغائها، وأخيرًا أصبح لديها رئيس له ريش!'
