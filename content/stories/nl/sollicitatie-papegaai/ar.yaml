summary: لدى فلور مقابلة عمل لكنها خائفة جدًا من الكلام، فيجيب ببغاؤها كاريل عن كل الأسئلة ويحصل على الوظيفة.
summary_source: 3f003d13398d76f5
gestures:
  have_past: 'اضمم صندوقًا خياليًا كبيرًا إلى صدرك، ثم افتح يديك الفارغتين وهز كتفيك كأنك تقول: كان لديّ، لكن ذلك قبل الآن.'
  not_dare: تصغّر وتنكمش، وتغطِّ عينيك بيد واحدة، وتهز رأسك بسرعة كأنك تريد الاختفاء.
  give: أمسك هدية خيالية بكلتا يديك وادفعها بعيدًا نحو شخص ما مع إيماءة كريمة.
  have: 'يملك: احتضن صندوقًا كبيرًا غير مرئي إلى صدرك، ثم افتح يديك الفارغتين وارفع كتفيك كأنك تقول: كان لديّ، لكن ذلك كان
    في الماضي.'
targets:
  had:
    gloss: كان/امتلك
    note: فعل ماضٍ شاذ من hebben؛ يقابل في العربية «كان» أو «امتلك»، ولا يتبع قاعدة -te/-de.
  durfde niet:
    gloss: لم يجرؤ
    note: بعد durfde niet يأتي المصدر مع te؛ في العربية نقول «لم يجرؤ على» + مصدر.
  gaf:
    gloss: أعطى
    note: ماضٍ شاذ من geven؛ يعني «أعطى»، وقد يعني «أطلق» مع schreeuw أو lach.
scenes:
- key: s1
  source: ef8bc8459a91e767
  translation: 'كان لدى فلور اليوم مقابلة عمل مهمة، وكانت ترتدي فستانًا أحمر. كان لديها أيضًا ببغاء على كتفها: كاريل. أعطى
    كاريل قبلة صغيرة على أذنها، لكن فلور لم تجرؤ على الدخول، ولم تجرؤ على المغادرة، ولم تجرؤ على الحركة. أطلق كاريل صرخة عالية
    ودفع الباب دفعًا خفيفًا.'
