- key: s2
  source: 1f47ae2962790adc
  translation: في الغرفة كانت السيدة دي بور ترتدي نظارة كبيرة، وكان لديها مكتب صغير جدًا. صافحت فلور، وأعطتها كأس ماء، وأومأ
    كاريل برأسه. لم تجرؤ فلور على الكلام، ولم تجرؤ على النظر، ولم تجرؤ على الحركة. كان فمها جافًا.
