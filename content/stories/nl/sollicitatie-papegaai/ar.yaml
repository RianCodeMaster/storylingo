- key: s4
  source: 79d9d83f702ab7c9
  translation: كان لدى السيدة دي بور عشرة أسئلة أخرى، وأعطت كاريل كل سؤال. أعطى كاريل عشرين إجابة، وأعطى أيضًا أغنية. لم تجرؤ
    فلور على الضحك، ولم تجرؤ على الحركة، ولم تجرؤ على الرمش. كان وجهها أحمر، وكانت تعاني من تشنج في كل أصابع قدميها.
