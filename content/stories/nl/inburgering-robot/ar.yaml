- key: s2
  source: 651cd014c13ba51d
  translation: 'طرح الروبوت سؤاله الأول: لماذا أنت هنا اليوم يا سيدي؟ أجاب لارس بصدق: أنا هنا لأنني بحاجة إلى دبلومي. قال
    الروبوت: لأنك بحاجة إلى دبلوم، هذا جيد، لكن جوابك يجب أن يكون في قافية! كان لارس قد ظن أنه يستطيع ببساطة أن يتكلم، لكن
    ذلك تبيّن أنه ليس كذلك.'
