- key: s4
  source: 7df107571ecb629f
  translation: 'أصبح لارس غاضبًا. وثب وصرخ: أنت روبوت، أنت من فولاذ، ليس لديك قلب، أنت... عمود! توقف الروبوت عن الصرير. أصبحت
    عينه الوحيدة كبيرة، وتبيّن أنه يجد هذه القافية رائعة. قال الروبوت: منذ سنوات أنتظر إنسانًا يتقافى أخيرًا، لأنه يقصدها!'
