- key: s5
  source: d1f83a8958f7d9d1
  translation: 'فجأة قال الروبوت: بطاريتي تقريبًا فارغة، أنا أكاد أسقط. وجب على لارس أن يصنع بسرعة قافية أخرى، لأن الروبوت
    وإلا سيتوقف. قال لارس: كنت صارمًا، لكنك أيضًا لطيف حقًا، ولذلك أحصل الآن على... الدبلوم! صرّ الروبوت. تبيّن أن الروبوت
    هو سرًا جار لارس، الذي كان يسمعه يتدرب على الهولندية في الحديقة منذ سنوات.'
