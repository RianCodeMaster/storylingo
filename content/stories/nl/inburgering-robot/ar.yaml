summary: يدخل لارس امتحان الاندماج الهولندي، لكن الممتحن يتبيّن أنه روبوت لا يتكلم إلا بالقافية، فعليه أن يتقافى لينال دبلومه.
summary_source: 3000287ca483551d
gestures:
  because: ادفع كلتا يديك إلى الأمام من صدرك كأنك تدفع سببًا، ثم اضرب الأرض بقدم واحدة بقوة عند آخر كلمة، لأن الفعل في الهولندية
    يأتي في النهاية.
  had_thought: انقر صدغك مرتين بنظرة حالمة إلى السقف، ثم ارفع كتفيك ودع يدك تسقط كبالون يفرغ من الهواء.
  turn_out: افتح راحتي يديك كأن ستارة تنفتح، وافتح عينيك واهمس تادا كأن مفاجأة ظهرت.
targets:
  omdat:
    gloss: لأن
    note: في الهولندية يأتي الفعل في آخر الجملة بعد omdat.
  had gedacht:
    gloss: كان قد ظن
    note: 'الماضي التام: had + التصريف الثالث.'
  bleek:
    gloss: تبيّن
    note: فعل قوي يعني ظهرت الحقيقة.
scenes:
- key: s1
  source: 1f3c55ac9dad8c39
  translation: 'كان لارس قد ظن أن امتحان الاندماج سيكون سهلًا. ظن أنه سيحصل فقط على أسئلة عن الطقس والدراجة. لكن الممتحن تبيّن
    أنه ليس إنسانًا: كان روبوتًا بعين واحدة كبيرة، وقبعة زرقاء صغيرة. قال الروبوت بصوت صرير: مرحبًا، مرحبًا، في قاعتي، أنا
    أقافي دائمًا، دون فشل.'
