- key: s3
  source: 7fe2759533d922ba
  translation: 'جرّب لارس قافية صغيرة: أنا من خرونينغن، وآكل بسرور... خبزًا؟ هزّ الروبوت رأسه لا. قال: ذلك لا يتقافى، هذه
    كارثة، أنت نملة وأنا مصباح! أصبح لارس خائفًا، لأن الروبوت بدأ يضحك بصوت عال جدًا. كانت يداه ترتجفان، لأنه لم يستطع أن
    يجد أي كلمة قافية. كان قد ظن أن الامتحان سيستمر فقط عشر دقائق؛ والآن تبيّن أنه صار ساعة بالفعل.'
