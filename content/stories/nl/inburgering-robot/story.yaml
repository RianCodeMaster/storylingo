      emotion: surprised
    - text: 'De robot zei met een piepstem: ''Welkom, welkom, in mijn zaal, ik rijm altijd, zonder faal.'''
      emotion: amused
  - key: s2
    text: 'De robot stelde zijn eerste vraag: ''Waarom ben je vandaag hier, meneer?'' Lars antwoordde eerlijk: ''Ik ben hier
      omdat ik mijn diploma nodig heb.'' ''Omdat je een diploma nodig hebt, dat is fijn,'' zei de robot, ''maar je antwoord
      moet in rijm zijn!'' Lars had gedacht dat hij gewoon kon praten, maar dat bleek niet zo te zijn.'
    image_prompt: The same thin man with round glasses and blue sweater looks shocked, hands in the air, while the silver
      one-eyed robot leans over the desk with a finger raised. A speech bubble with musical rhyme notes floats above the robot.
      Bright cartoon style, same exam room.
    questions:
    - key: s2q1
      kind: who_what
      prompt: Waarom is Lars hier?
      options:
      - omdat hij zijn diploma nodig heeft
      - omdat hij honger heeft
      - omdat hij de robot wil zien
      answer: omdat hij zijn diploma nodig heeft
      target: omdat
    - key: s2q2
      kind: yes_no
      prompt: Had Lars gedacht dat hij gewoon kon praten?
      options: [ja, nee]
      answer: ja
      target: had gedacht
    - key: s2q3
      kind: either_or
      prompt: Bleek Lars gewoon te kunnen praten of moest hij in rijm antwoorden?
      options: [hij moest in rijm antwoorden, hij kon gewoon praten]
      answer: hij moest in rijm antwoorden
      target: bleek
    - key: s2q4
      kind: who_what
      prompt: Wat wil de robot van Lars?
      options: [een antwoord in rijm, een kopje koffie, een nieuwe batterij]
      answer: een antwoord in rijm
    - key: s2q5
      kind: yes_no
      prompt: Bleek het examen makkelijk voor Lars te zijn?
      options: [ja, nee]
      answer: nee
      target: bleek
