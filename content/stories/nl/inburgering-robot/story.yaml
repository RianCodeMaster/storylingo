    - text: 'De robot stelde zijn eerste vraag: ''Waarom ben je vandaag hier, meneer?'' Lars antwoordde eerlijk: ''Ik ben
        hier omdat ik mijn diploma nodig heb.'' ''Omdat je een diploma nodig hebt, dat is fijn,'' zei de robot, ''maar je
        antwoord moet in rijm zijn!'' Lars had gedacht dat hij gewoon kon praten, maar dat bleek niet zo te zijn.'
      emotion: neutral
  - key: s3
    text: 'Lars probeerde een rijmpje: ''Ik kom uit Groningen, en ik eet graag... brood?'' De robot schudde nee. ''Dat rijmt
      niet, dat is een ramp, jij bent een mier en ik een lamp!'' Lars werd bang, omdat de robot heel hard begon te lachen.
      Zijn handen trilden, omdat hij geen enkel rijmwoord kon vinden. Hij had gedacht dat het examen maar tien minuten zou
      duren; nu bleek het al een uur te zijn.'
    image_prompt: The thin man with round glasses sits small in his chair, hands shaking, sweat drops flying, while the silver
      robot laughs with its one eye squeezed shut and a big open mouth. A clock on the wall shows a full hour. Bright cartoon
      style, same exam room.
    questions:
    - key: s3q1
      kind: yes_no
      prompt: Kon Lars een goede rijm geven?
      options: [ja, nee]
      answer: nee
    - key: s3q2
      kind: either_or
      prompt: Werd Lars bang of werd Lars boos?
      options: [bang, boos]
      answer: bang
    - key: s3q3
      kind: who_what
      prompt: Waarom trilden de handen van Lars?
      options: [omdat hij geen rijmwoord kon vinden, omdat het koud was, omdat hij boos was]
      answer: omdat hij geen rijmwoord kon vinden
      target: omdat
    - key: s3q4
      kind: yes_no
      prompt: Had Lars gedacht dat het examen tien minuten zou duren?
      options: [ja, nee]
      answer: ja
      target: had gedacht
