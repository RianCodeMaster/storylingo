    voice:
    - text: 'Lars probeerde een rijmpje: ''Ik kom uit Groningen, en ik eet graag...'
      emotion: amused
    - text: brood?' De robot schudde nee.
      emotion: neutral
    - text: '''Dat rijmt niet, dat is een ramp, jij bent een mier en ik een lamp!'' Lars werd bang, omdat de robot heel hard
        begon te lachen.'
      emotion: angry
    - text: Zijn handen trilden, omdat hij geen enkel rijmwoord kon vinden.
      emotion: whisper
    - text: Hij had gedacht dat het examen maar tien minuten zou duren; nu bleek het al een uur te zijn.
      emotion: whisper
  - key: s4
    text: 'Lars werd boos. Hij sprong op en riep: ''Jij bent een robot, jij bent van staal, jij hebt geen hart, jij bent...
      een paal!'' De robot stopte met piepen. Zijn ene oog werd groot, en hij bleek dit rijmpje geweldig te vinden. ''Al jaren
      wacht ik op een mens,'' zei de robot, ''die eindelijk rijmt, omdat hij het meent!'''
    image_prompt: The thin man with round glasses jumps up from his chair with both fists in the air, shouting. The silver
      robot's single eye is enormous and sparkling, its little blue hat tilted, tiny arms raised in joy. Papers fly off the
      desk. Bright cartoon style, same exam room.
    questions:
    - key: s4q1
      kind: yes_no
      prompt: Werd Lars boos?
      options: [ja, nee]
      answer: ja
    - key: s4q2
      kind: who_what
      prompt: Wat riep Lars over de robot?
      options: [jij bent van staal, jij bent een mier, jij bent een lamp]
      answer: jij bent van staal
    - key: s4q3
      kind: either_or
      prompt: Vond de robot het rijmpje geweldig of vreselijk?
      options: [geweldig, vreselijk]
      answer: geweldig
      target: bleek
    - key: s4q4
      kind: who_what
      prompt: Waarom wachtte de robot al jaren op een mens?
      options: [omdat hij wil dat iemand rijmt, omdat hij wil slapen, omdat hij boos is]
      answer: omdat hij wil dat iemand rijmt
      target: omdat
    - key: s4q5
      kind: yes_no
      prompt: Bleek de robot boos te zijn op Lars?
      options: [ja, nee]
      answer: nee
      target: bleek
