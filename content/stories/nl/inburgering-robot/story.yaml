  - key: s5
    text: 'Plotseling zei de robot: ''Mijn batterij is bijna leeg, ik val bijna om.'' Lars moest snel nog één rijmpje maken,
      omdat de robot anders zou uitvallen. ''Je was streng, maar ook wel aardig,'' zei Lars, ''en daarom krijg ik nu mijn...''
      ''Diploma!'' piepte de robot. De robot bleek stiekem de buurman van Lars te zijn, die hem al jaren Nederlands hoorde
      oefenen in de tuin.'
    image_prompt: The silver robot wobbles with a flashing empty battery icon on its chest while the thin man with round glasses
      points at it, triumphant. Behind them a window shows a garden and a shed. A diploma with a ribbon lies on the desk.
      Bright cartoon style, same exam room.
    questions:
    - key: s5q1
      kind: either_or
      prompt: Was de batterij van de robot bijna leeg of helemaal vol?
      options: [bijna leeg, helemaal vol]
      answer: bijna leeg
    - key: s5q2
      kind: who_what
      prompt: Waarom moest Lars snel nog een rijmpje maken?
      options:
      - omdat de robot anders zou uitvallen
      - omdat hij honger had
      - omdat het pauze was
      answer: omdat de robot anders zou uitvallen
      target: omdat
    - key: s5q3
      kind: yes_no
      prompt: Bleek de robot de buurman van Lars te zijn?
      options: [ja, nee]
      answer: ja
      target: bleek
    - key: s5q4
      kind: who_what
      prompt: Wat kreeg Lars aan het einde?
      options: [zijn diploma, een fiets, een hoedje]
      answer: zijn diploma
    - key: s5q5
      kind: yes_no
      prompt: Had Lars gedacht dat de examinator zijn buurman was?
      options: [ja, nee]
      answer: nee
      target: had gedacht
