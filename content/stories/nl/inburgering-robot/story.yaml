# A story, in its target language. Edit freely, then: storylingo.py sync  (and media / localize / check as it says).
# Keys (s2, s2q3) name a scene or question for good: keep them when you change a text, so learners keep their
# history. A new scene or question may leave its key out; sync gives it one. status: draft or published.
slug: inburgering-robot
status: published
tags: [algemeen, dagelijks]
brief:
  language: nl
  level: B1
  theme: Lars doet zijn inburgeringsexamen, maar de examinator blijkt een robot die alleen in rijm praat
  scenes: 5
  targets:
  - text: omdat
    gloss: because (verb at the end)
    concept: because
    kind: word
  - text: had gedacht
    gloss: had thought
    concept: had_thought
    kind: phrase
  - text: bleek
    gloss: turned out
    concept: turn_out
    kind: word
  narrator: jessica
story:
  title: Lars en de rijmende robot
  summary: Lars takes his Dutch integration exam, but the examiner turns out to be a robot who only speaks in rhyme, and Lars
    must rhyme his way to a diploma.
  gestures:
  - concept: because
    description: Push both hands forward from your chest as if shoving out a reason, then stomp one foot hard on the last
      word, because in Dutch the verb goes to the end.
    emoji: 🦶
  - concept: had_thought
    description: Tap your temple twice with a dreamy look up at the ceiling, then shrug and let your hand drop like a balloon
      losing air.
    emoji: 💭
  - concept: turn_out
    description: Open both palms wide like curtains opening, pop your eyes and whisper 'ta-da!' as if a surprise just appeared.
    emoji: 🎉
  scenes:
  - key: s1
    text: 'Lars had gedacht dat het inburgeringsexamen makkelijk zou zijn. Hij had gedacht dat hij alleen vragen over het
      weer en de fiets zou krijgen. Maar de examinator bleek geen mens te zijn: het was een robot met één groot oog en een
      klein blauw hoedje. De robot zei met een piepstem: ''Welkom, welkom, in mijn zaal, ik rijm altijd, zonder faal.'''
    image_prompt: A tall thin man around thirty with short blond hair, round glasses, a blue sweater and a green backpack
      stands nervously in a small exam room. Behind a desk sits a silver robot with one big round eye and a tiny blue hat,
      pointing at him. Papers and a lamp on the desk, bright cartoon style.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Had Lars gedacht dat het examen makkelijk zou zijn?
      options: [ja, nee]
      answer: ja
      target: had gedacht
    - key: s1q2
      kind: who_what
      prompt: Wat bleek de examinator te zijn?
      options: [een robot, een mens, een fiets]
      answer: een robot
      target: bleek
    - key: s1q3
      kind: yes_no
      prompt: Bleek de examinator een mens te zijn?
      options: [ja, nee]
      answer: nee
      target: bleek
    - key: s1q4
      kind: who_what
      prompt: Hoeveel ogen had de robot?
      options: [één oog, twee ogen, drie ogen]
      answer: één oog
    - key: s1q5
      kind: either_or
      prompt: Zei de robot 'ik rijm altijd' of 'ik zing altijd'?
      options: [ik rijm altijd, ik zing altijd]
      answer: ik rijm altijd
