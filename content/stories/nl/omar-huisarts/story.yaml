story:
  title: Omar en de groene neus
  summary: Omar wakes up with a bright green nose, is too afraid of the strict phone assistant to ask for help, and finally
    discovers at the doctor's office that the green is just paint.
  gestures:
  - concept: want
    description: Hug an enormous invisible ice cream to your chest and lean forward with big hungry eyes, like you really,
      really want it.
    emoji: 🤤
  - concept: afraid
    description: Wrap both arms around yourself and shake like a tiny scared leaf while your teeth chatter.
    emoji: 😱
  - concept: finally
    description: Throw both arms up in the air, tip your head back and sigh a long 'aaah' like you waited a thousand years.
    emoji: 🎉
