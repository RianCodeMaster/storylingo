- key: s4
  source: 302e68fe8ad9f97c
  translation: 'عند طبيب الأسرة، جلس عمر في غرفة صغيرة. نظر الطبيب إلى أنفه وسأل: ''ما هذا؟'' أراد عمر أن يبكي، لأنه كان خائفًا.
    أخيرًا جاء الطبيب بمنشفة بيضاء صغيرة.'
