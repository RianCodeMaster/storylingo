# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: يستيقظ عمر ذات صباح بأنف أخضر زاهٍ، ويخاف من مساعدة الهاتف الصارمة فلا يطلب المساعدة، ثم يكتشف أخيرًا عند الطبيب
  أن الأخضر مجرد دهان.
summary_source: 4700f8f9b2ab5ba0
gestures:
  want: احضن آيس كريم خياليًا كبيرًا إلى صدرك وانحنِ للأمام بعينين جوعى، كأنك تريده حقًا.
  afraid: أمسك ذراعيك حول نفسك وارتجف مثل ورقة صغيرة خائفة بينما أسنانك تصطك.
  finally: ارفع ذراعيك في الهواء، وأرجِع رأسك للخلف وتنفّس 'آآه' طويلة كأنك انتظرت ألف سنة.
targets:
  wilde:
    gloss: أراد
    note: في الهولندية يأتي 'wilde' بعد الفاعل غالبًا، وفي العربية 'أراد' فعل كامل.
  was bang:
    gloss: كان خائفًا
    note: في الهولندية 'bang' صفة بعد 'was'، وفي العربية نقول 'كان خائفًا'.
  eindelijk:
    gloss: أخيرًا
    note: ظرف زمن؛ في العربية 'أخيرًا' يمكن أن يقع أول الجملة أو وسطها.
