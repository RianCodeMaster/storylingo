- key: s3
  source: 4dcbd5ab091c5126
  translation: 'في اليوم التالي كان أنف عمر أكثر خضرة، أخضر جدًا جدًا. كان عمر خائفًا، لكنه أراد أن يتحسن. اتصل مرة أخرى وقالت
    المساعدة: ''تعال إذن، يا عمر!'' كان عمر متفاجئًا: كانت المساعدة لطيفة!'
