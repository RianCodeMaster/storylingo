  source: b1876dd69af6c2f3
  translation: استيقظ عمر ونظر في المرآة. كان أنفه أخضر، أخضر جدًا جدًا! أراد أن يذهب إلى طبيب الأسرة، لأن الأنف الأخضر ليس
    جيدًا. لكنه كان خائفًا من الهاتف.
