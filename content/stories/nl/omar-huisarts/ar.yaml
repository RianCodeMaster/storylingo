- key: s2
  source: 8096709d78d52e36
  translation: 'اتصل عمر بالطبيب العام، وردّت المساعدة: صباح الخير، معك مساعدة الطبيب العام! كان عمر خائفًا، لأن المساعدة
    بدت صارمة جدًا. أراد أن يقول شيئًا، لكنه لم يقل شيئًا وأغلق الهاتف.'
