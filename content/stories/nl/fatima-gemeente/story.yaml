story:
  title: Sanne, Pluis en het nummer
  summary: Sanne wants a new passport, but her fat cat Pluis eats the number she needs — until Pluis burps it back up at the
    town hall.
  gestures:
  - concept: want
    description: Hug an enormous invisible cake to your chest, lean forward with hungry eyes and nod hard, like you really,
      really want it.
    emoji: 🤲
  - concept: cannot
    description: Shake both flat hands in front of your chest in fast 'no-no-no' motions, puff out your cheeks, then let your
      arms fall down like heavy bags.
    emoji: 🙅
  - concept: have
    description: Hold both arms out as if carrying a giant invisible box, then pat your chest proudly and grin.
    emoji: 🎁
