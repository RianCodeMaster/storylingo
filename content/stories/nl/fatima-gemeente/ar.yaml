summary: سانِه تريد جواز سفر جديدًا، لكن قِطَّتها السمينة «بلاوس» تأكل الرقم الذي تحتاجه، ثم تُخرجه بتجشؤ في البلدية.
summary_source: 34ed383b12ed2ff8
gestures:
  want: اِحضن كعكة خيالية كبيرة إلى صدرك، وانحنِ للأمام بعينين جائعتين ووافق برأسك بقوة، كأنك تريدها حقًا.
  cannot: هُزّ يديك المفتوحتين أمام صدرك بحركات سريعة «لا لا لا»، وانفخ خديك، ثم أسقط ذراعيك كأنهما كيسان ثقيلان.
  have: أخرج ذراعيك كأنك تحمل صندوقًا خياليًا ضخمًا، ثم ربّت على صدرك بفخر وابتسم.
targets:
  wil:
    gloss: يريد
    note: فعل شاذ، ويأتي بعد الفاعل مثل العربية غالبًا.
  kan niet:
    gloss: لا يستطيع
    note: النفي في الهولندية بعد الفعل، وفي العربية قبل الفعل.
  heeft:
    gloss: لديه
    note: للملكية في العربية «لدى/عند»، وفي الهولندية فعل مستقل.
