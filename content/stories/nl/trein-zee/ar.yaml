summary: برام يجلس في القطار متجهًا إلى العمل، لكن القطار يذهب إلى البحر حيث يقف مديره على الشاطئ، ثم تعيدهما سمكة ضخمة إلى
  البيت.
summary_source: 47deb6fe4c86ca75
gestures:
  sit: انزل فجأة كأنك تجلس على كرسي غير مرئي، وحرّك مؤخرتك مرتين، وضمّ يديك كأنك تقرأ كتابًا.
  go_to: 'اخطُ خطوة كبيرة إلى الأمام بينما تمدّ ذراعيك إلى الأمام كقطار يغادر المحطة، وقل: تووت تووت!'
  stand: اقفز واقفًا بشكل مستقيم جدًا كتمثال، وذراعاك ملتصقتان بجانبيك، وارفع ذقنك، وتجمّد لثانيتين.
targets:
  zit:
    gloss: يجلس
    note: في الهولندية يتغيّر الفعل مع الفاعل، بينما العربية تُلحق الضمير بالفعل غالبًا.
  gaat naar:
    gloss: يذهب إلى
    note: حرف الجر 'naar' يشبه 'إلى' في العربية ويأتي قبل المكان.
  staat:
    gloss: يقف
    note: مثل 'zit'، يتغيّر 'staat' حسب الفاعل؛ وهنا هو للمفرد الغائب.
