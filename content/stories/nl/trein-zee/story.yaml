story:
  title: Bram en de trein naar de zee
  summary: Bram sits on the train to work, but the train goes to the sea, where his boss is standing on the beach — and then
    a giant fish takes them home.
  gestures:
  - concept: sit
    description: Squat down suddenly onto an invisible chair, wiggle your bottom twice and fold your hands like you are reading
      a book.
    emoji: 🪑
  - concept: go_to
    description: Stomp one big step forward while both arms shoot out in front of you like a train leaving the station, and
      say 'toot toot!'
    emoji: 🚂
  - concept: stand
    description: Jump up very straight like a statue, arms glued to your sides, chin high, and freeze for two seconds.
    emoji: 🧍
