- key: s4
  source: 20012b58d5ad301e
  translation: 'يتصل المالك المؤجّر بنور ويقول: ''الإيجار منخفض، لكن البط يجب أن يبقى.'' تفاجأ نور، لأنها تريد السكن دون حيوانات.
    تقول نعم رغم أنها تخاف من البط. تفكر: إذا قالت لا، فستفقد المركب.'
