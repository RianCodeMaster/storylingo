- key: s5
  source: 103d48d7a1b30c2e
  translation: 'توقّع نور العقد وتبقى في البيت العائم. في صباح اليوم التالي توجد بيضة ذهبية بين البط. تعرف نور: إذا وضع البط
    بيضًا ذهبيًا، فستستطيع دفع الإيجار. تعيش الآن سعيدة جدًا على المركب، رغم أنها لم تحب البط يومًا.'
