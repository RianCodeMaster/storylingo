summary: تبحث نور عن بيت للإيجار بأسعار معقولة في أمستردام، فتجد بيتًا عائمًا صغيرًا مليئًا بالبط التي تضع بيضة ذهبية غير
  متوقعة.
summary_source: b66fa01d9a70065d
gestures:
  although: ارفع كتفًا واحدًا، وحرّك إصبع التحذير، وادفع بابًا خياليًا بيدك الأخرى لتُظهر أن الفعل يذهب إلى آخر الجملة.
  if_then: ارفع إصبعًا واحدًا كعلامة سؤال، ثم افرقع أصابعك وأشر إلى الأمام بحماس لتُظهر النتيجة.
  would_like: شبّك يديك تحت ذقنك، ومِل إلى الأمام بعينين حالمتين، وتخيّل عناق بيت ذهبي صغير.
targets:
  hoewel:
    gloss: رغم أنّ
    note: بعد hoewel ينتقل الفعل إلى آخر الجملة الثانوية، بخلاف العربية التي تحافظ غالبًا على ترتيبها.
  als ... dan:
    gloss: إذا ... فإن
    note: بعد als تأتي الجملة الرئيسية غالبًا بـ dan؛ العربية قد تكتفي بـ إذا.
  zou willen:
    gloss: يرغب في
    note: zou فعل مساعد مع willen في المصدر، والعربية تعبّر غالبًا بفعل واحد مثل يرغب.
scenes:
- key: s1
  source: f323d01d12032625
  translation: 'تبحث نور منذ أشهر عن منزل للإيجار بأسعار معقولة في أمستردام. لديها مال قليل جدًا رغم أنها تعمل بجد. ترغب في
    السكن على قناة، لكن الإيجار هائل. تفكر نور: إذا وجدت مسكنًا، فسيكون أغلى بكثير.'
  glosses:
