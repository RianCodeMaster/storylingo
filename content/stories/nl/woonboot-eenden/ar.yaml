- key: s3
  source: 47ca778bc13d06c0
  translation: 'تذهب نور إلى البيت العائم، لكن المركب مليء بالبط. البط يُحدث ضجيجًا كثيرًا رغم أنه لطيف. تتمنى نور لو كان
    المركب فارغًا. تفاجأ: إذا خطت خطوة واحدة، تصوّت كلها في آن واحد.'
