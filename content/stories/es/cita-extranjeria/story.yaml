  - key: s3
    text: 'El martes, Daniel pone la fecha 2030 en el microondas y pulsa el botón. Aunque hay mucho humo y un ruido terrible,
      la máquina funciona: Daniel aparece en 2030. En la calle hay coches voladores y la gente lleva zapatos de oro, pero
      la oficina de extranjería todavía está en el mismo edificio gris. Daniel tendría que entrar rápido, porque su cita es
      a las nueve.'
    image_prompt: Daniel, the same man with curly black hair, round glasses and an orange jumper, stands in a futuristic Madrid
      street in 2030 with flying cars above him and people wearing shiny gold shoes, while a boring grey office building stands
      in the background.
    questions:
    - key: s3q1
      kind: yes_no
      prompt: ¿La máquina funciona aunque hay mucho humo?
      options: [Sí, "No"]
      answer: Sí
      target: aunque
    - key: s3q2
      kind: who_what
      prompt: ¿Qué hay en la calle en 2030?
      options: [coches voladores, caballos, bicicletas]
      answer: coches voladores
    - key: s3q3
      kind: either_or
      prompt: ¿Daniel aparece en 2030 o en 2040?
      options: ['2040', '2030']
      answer: '2030'
    - key: s3q4
      kind: yes_no
      prompt: ¿La oficina de extranjería está en un edificio nuevo?
      options: [Sí, "No"]
      answer: "No"
    - key: s3q5
