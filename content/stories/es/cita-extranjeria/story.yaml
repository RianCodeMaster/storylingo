  - key: s5
    text: 'Daniel vuelve a su cocina, en 2024, y mira el móvil: ¡hay una cita libre mañana a las ocho! Aunque grita de alegría,
      su vecina entra y dice: «He usado tu máquina para ir a 2050; allí tú ya eres español». Daniel había pedido una cita
      durante ocho meses y ahora ya no la necesita. Pero tendría que devolver la máquina a la luna, porque su vecina la ha
      aparcado allí.'
    image_prompt: Daniel, the same man with curly black hair, round glasses and an orange jumper, jumps in the air holding
      his phone in his bright kitchen while his old neighbour calmly points at the moon through the window, where a tiny microwave
      is parked.
