# A story, in its target language. Edit freely, then: storylingo.py sync  (and media / localize / check as it says).
# Keys (s2, s2q3) name a scene or question for good: keep them when you change a text, so learners keep their
# history. A new scene or question may leave its key out; sync gives it one. status: draft or published.
slug: cita-extranjeria
status: published
tags: [algemeen]
brief:
  language: es
  level: B1
  theme: Daniel necesita una cita en la oficina de extranjería, pero la primera cita libre es en el año 2030; entonces construye
    una máquina del tiempo
  scenes: 5
  targets:
  - text: aunque
    gloss: although
    concept: although
    kind: word
  - text: tendría que
    gloss: would have to
    concept: would_have_to
    kind: phrase
  - text: había pedido
    gloss: had asked for
    concept: had_asked
    kind: phrase
  narrator: charlie
story:
  title: La cita del año 2030
  summary: Daniel needs an appointment at the immigration office, the first free slot is in 2030, so he builds a time machine
    in his kitchen — and his neighbour takes it to the moon.
  gestures:
  - concept: although
    description: Shrug with one shoulder, push an invisible small obstacle away with your hand and nod hard, as if saying
      'even so!'
    emoji: 🤷‍♂️
  - concept: would_have_to
    description: Sigh loudly and mime carrying a giant heavy box on your back while taking one slow, dramatic step
    emoji: 🏋️
  - concept: had_asked
    description: Knock three times on an invisible door and then hold out both hands like a beggar asking for something
    emoji: 🙏
  scenes:
  - key: s1
    text: 'Daniel vive en Madrid y necesita una cita en la oficina de extranjería. Había pedido una cita durante ocho meses,
      pero la primera cita libre es en el año 2030. Aunque llama al teléfono cada mañana, la respuesta es siempre la misma:
      «No hay citas». Daniel tendría que esperar seis años, y eso es demasiado.'
    image_prompt: Daniel, a 34-year-old Spanish man with curly black hair, round glasses and an orange jumper, sits at a tiny
      kitchen table staring at a laptop showing the number 2030 in huge red letters; his face is desperate, a cold cup of
      coffee next to him.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: ¿La primera cita libre es en el año 2030?
      options: [Sí, "No"]
      answer: Sí
    - key: s1q2
      kind: either_or
      prompt: ¿Daniel había pedido una cita durante ocho meses o durante ocho días?
      options: [ocho meses, ocho días]
      answer: ocho meses
      target: había pedido
    - key: s1q3
      kind: who_what
      prompt: ¿Qué tendría que hacer Daniel?
      options: [esperar seis años, llamar a su madre, cambiar de país]
      answer: esperar seis años
      target: tendría que
    - key: s1q4
      kind: yes_no
      prompt: ¿Daniel consigue una cita aunque llama al teléfono cada mañana?
      options: [Sí, "No"]
      answer: "No"
      target: aunque
