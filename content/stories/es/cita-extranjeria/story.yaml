  - key: s2
    text: Daniel decide construir una máquina del tiempo en su cocina, aunque no sabe nada de física. Usa el microondas, un
      ventilador enorme y cuarenta y siete metros de papel de aluminio. Su vecina dice que es imposible, pero Daniel tendría
      que llegar a 2030 de alguna manera. Había pedido ayuda a tres científicos, pero los tres se rieron de él.
    image_prompt: Daniel, the same man with curly black hair, round glasses and an orange jumper, stands in a chaotic kitchen
      wrapping a microwave in an enormous pile of aluminium foil, with a big fan and cables everywhere; his old neighbour
      watches from the door with her arms crossed.
    questions:
    - key: s2q1
      kind: yes_no
      prompt: ¿Daniel sabe mucho de física?
      options: [Sí, "No"]
      answer: "No"
    - key: s2q2
      kind: either_or
      prompt: ¿Daniel había pedido ayuda a tres científicos o a tres vecinos?
      options: [tres vecinos, tres científicos]
      answer: tres científicos
      target: había pedido
    - key: s2q3
      kind: who_what
      prompt: ¿Qué usa Daniel para construir la máquina?
      options: [un microondas, una nevera, un coche]
      answer: un microondas
    - key: s2q4
      kind: yes_no
      prompt: ¿La vecina dice que la máquina es posible?
      options: [Sí, "No"]
      answer: "No"
    - key: s2q5
      kind: either_or
      prompt: ¿Daniel tendría que llegar a 2030 o a 2020?
      options: ['2030', '2020']
      answer: '2030'
      target: tendría que
