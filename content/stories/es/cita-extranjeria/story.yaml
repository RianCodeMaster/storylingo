  - key: s4
    text: 'En la oficina, una empleada muy amable le dice: «Su cita era ayer». Daniel explica que había pedido esa cita en
      2024, y la empleada sonríe: «Lo siento, en 2030 solo damos citas por internet». Aunque Daniel tiene una máquina del
      tiempo, no tiene internet en 2030, porque internet desapareció en 2029. La empleada añade: «Tendría que volver en 2031;
      hay una cita libre en marzo».'
    image_prompt: Daniel, the same man with curly black hair, round glasses and an orange jumper, argues with a smiling immigration
      clerk behind a glass window in a grey office; a sign on the wall says 'SIN INTERNET' and Daniel holds an old mobile
      phone with no signal.
    questions:
    - key: s4q1
      kind: who_what
      prompt: ¿Qué le dice la empleada a Daniel?
      options: [Su cita era ayer, Su cita es hoy, No hay oficina]
      answer: Su cita era ayer
    - key: s4q2
      kind: yes_no
      prompt: ¿Daniel tiene internet en 2030?
      options: [Sí, "No"]
      answer: "No"
      target: aunque
    - key: s4q3
      kind: either_or
      prompt: ¿Daniel había pedido la cita en 2024 o en 2019?
      options: ['2019', '2024']
      answer: '2024'
      target: había pedido
    - key: s4q4
      kind: yes_no
      prompt: ¿La empleada dice que Daniel tendría que volver en 2031?
      options: [Sí, "No"]
      answer: Sí
      target: tendría que
    - key: s4q5
      kind: either_or
      prompt: ¿Internet desapareció en 2029 o en 2019?
      options: ['2029', '2019']
      answer: '2029'
