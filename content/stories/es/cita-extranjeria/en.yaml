- key: s3
  source: 8b8a5c0932eeaac0
  translation: 'On Tuesday, Daniel sets the date 2030 on the microwave and presses the button. Although there is a lot of
    smoke and a terrible noise, the machine works: Daniel appears in 2030. In the street there are flying cars and people
    wear gold shoes, but the immigration office is still in the same grey building. Daniel would have to go in quickly, because
    his appointment is at nine.'
