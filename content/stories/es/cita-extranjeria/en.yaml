# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Daniel needs an appointment at the immigration office, but the first free slot is in 2030, so he builds a time machine
  in his kitchen — and his neighbour takes it to the moon.
summary_source: e3a8158eff5bbe47
gestures:
  although: Shrug with one shoulder, push an invisible small obstacle away with your hand and nod hard, as if saying 'even
    so!'
  would_have_to: Sigh loudly and mime carrying a giant heavy box on your back while taking one slow, dramatic step
  had_asked: Knock three times on an invisible door and then hold out both hands like a beggar asking for something
targets:
  aunque:
    gloss: although
    note: Like English 'although', it introduces a contrast; here it is followed by the indicative.
  tendría que:
    gloss: would have to
    note: Conditional of tener + que; compare English 'would have to'.
  había pedido:
    gloss: had asked for
    note: Pluperfect había + participle; compare English 'had asked for'.
