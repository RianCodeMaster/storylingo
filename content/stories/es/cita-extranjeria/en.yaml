- key: s1
  source: bfd859ee2eaf412e
  translation: 'Daniel lives in Madrid and needs an appointment at the immigration office. He had been trying to get an appointment
    for eight months, but the first free appointment is in 2030. Although he calls every morning, the answer is always the
    same: ''There are no appointments.'' Daniel would have to wait six years, and that is too much.'
