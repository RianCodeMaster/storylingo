- key: s4
  source: fdb337b92e7ccb70
  translation: 'At the office, a very kind employee says to him: ''Your appointment was yesterday.'' Daniel explains that
    he had requested that appointment in 2024, and the employee smiles: ''I''m sorry, in 2030 we only give appointments online.''
    Although Daniel has a time machine, he does not have internet in 2030, because the internet disappeared in 2029. The employee
    adds: ''You would have to come back in 2031; there is a free appointment in March.'''
