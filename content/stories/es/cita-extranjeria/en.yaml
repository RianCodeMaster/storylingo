- key: s5
  source: e516048b4e54e962
  translation: 'Daniel returns to his kitchen, in 2024, and looks at his mobile: there is a free appointment tomorrow at eight!
    Although he shouts with joy, his neighbour comes in and says: ''I used your machine to go to 2050; there you are already
    Spanish.'' Daniel had been trying to get an appointment for eight months and now he no longer needs it. But he would have
    to return the machine to the moon, because his neighbour has parked it there.'
