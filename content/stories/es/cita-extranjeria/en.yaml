- key: s2
  source: b3cf233e159a5bcb
  translation: Daniel decides to build a time machine in his kitchen, although he knows nothing about physics. He uses the
    microwave, a huge fan and forty-seven metres of aluminium foil. His neighbour says it is impossible, but Daniel would
    have to get to 2030 somehow. He had asked three scientists for help, but all three laughed at him.
