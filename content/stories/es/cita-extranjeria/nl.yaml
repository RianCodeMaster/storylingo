- key: s4
  source: fdb337b92e7ccb70
  translation: 'Op het kantoor zegt een heel vriendelijke medewerkster tegen hem: ''Uw afspraak was gisteren.'' Daniel legt
    uit dat hij die afspraak in 2024 had aangevraagd, en de medewerkster glimlacht: ''Het spijt me, in 2030 geven we alleen
    afspraken via internet.'' Hoewel Daniel een tijdmachine heeft, heeft hij in 2030 geen internet, omdat internet in 2029
    verdween. De medewerkster voegt toe: ''U zou in 2031 moeten terugkomen; er is een vrije afspraak in maart.'''
