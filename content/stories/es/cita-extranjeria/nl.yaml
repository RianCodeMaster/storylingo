- key: s2
  source: b3cf233e159a5bcb
  translation: Daniel besluit een tijdmachine in zijn keuken te bouwen, hoewel hij niets van natuurkunde weet. Hij gebruikt
    de magnetron, een enorme ventilator en zevenenveertig meter aluminiumfolie. Zijn buurvrouw zegt dat het onmogelijk is,
    maar Daniel zou op een of andere manier in 2030 moeten aankomen. Hij had drie wetenschappers om hulp gevraagd, maar de
    drie lachten hem uit.
