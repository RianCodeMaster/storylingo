- key: s5
  source: e516048b4e54e962
  translation: 'Daniel komt terug naar zijn keuken, in 2024, en kijkt naar zijn mobiel: er is morgen om acht uur een vrije
    afspraak! Hoewel hij van vreugde schreeuwt, komt zijn buurvrouw binnen en zegt: ''Ik heb jouw machine gebruikt om naar
    2050 te gaan; daar ben jij al Spanjaard.'' Daniel had acht maanden lang een afspraak aangevraagd en nu heeft hij die niet
    meer nodig. Maar hij zou de machine naar de maan moeten terugbrengen, omdat zijn buurvrouw hem daar heeft geparkeerd.'
