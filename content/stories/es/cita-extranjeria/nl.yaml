- key: s3
  source: 8b8a5c0932eeaac0
  translation: 'Op dinsdag zet Daniel de datum 2030 in de magnetron en drukt op de knop. Hoewel er veel rook en een vreselijk
    lawaai is, werkt de machine: Daniel verschijnt in 2030. Op straat zijn er vliegende auto''s en de mensen dragen gouden
    schoenen, maar het immigratiekantoor is nog steeds in hetzelfde grijze gebouw. Daniel zou snel naar binnen moeten gaan,
    omdat zijn afspraak om negen uur is.'
