# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Daniel heeft een afspraak nodig bij de immigratiedienst, de eerste vrije plek is in 2030, dus bouwt hij een tijdmachine
  in zijn keuken — en zijn buurvrouw neemt die mee naar de maan.
summary_source: e3a8158eff5bbe47
gestures:
  although: 'Trek één schouder op, duw een onzichtbaar klein obstakel weg met je hand en knik hard, alsof je zegt: ''toch!'''
  would_have_to: Zucht luid en doe alsof je een reusachtige zware doos op je rug draagt, terwijl je één langzame, dramatische
    stap zet.
  had_asked: Klop drie keer op een onzichtbare deur en houd dan beide handen op zoals een bedelaar die om iets vraagt.
targets:
  aunque:
    gloss: hoewel, ook al
    note: 'Let op: ''aunque'' betekent ''hoewel'' of ''ook al''; in het Nederlands verandert de werkwoordsvorm daarbij niet.'
  tendría que:
    gloss: zou moeten
    note: Condicional van 'tener que'; Nederlands gebruikt vaak 'zou moeten' voor een verplichting in een niet-echte situatie.
  había pedido:
    gloss: had aangevraagd
    note: Pluscuamperfecto; Nederlands gebruikt 'had' + voltooid deelwoord, net als 'had aangevraagd'.
scenes:
- key: s1
  source: bfd859ee2eaf412e
  translation: 'Daniel woont in Madrid en heeft een afspraak nodig bij het immigratiekantoor. Hij had acht maanden lang een
    afspraak aangevraagd, maar de eerste vrije afspraak is in het jaar 2030. Hoewel hij elke ochtend belt, is het antwoord
    altijd hetzelfde: ''Er zijn geen afspraken.'' Daniel zou zes jaar moeten wachten, en dat is te veel.'
