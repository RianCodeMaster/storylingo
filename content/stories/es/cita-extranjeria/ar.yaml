- key: s4
  source: fdb337b92e7ccb70
  translation: 'في المكتب، تقول له موظفة لطيفة جداً: «كان موعدك أمس». يشرح دانيال أنه كان قد طلب ذلك الموعد في 2024، فتبتسم
    الموظفة: «آسفة، في 2030 نعطي المواعيد عبر الإنترنت فقط». رغم أن دانيال لديه آلة زمن، لا يوجد إنترنت في 2030، لأن الإنترنت
    اختفى في 2029. تضيف الموظفة: «سيتعين عليك العودة في 2031؛ هناك موعد متاح في مارس».'
