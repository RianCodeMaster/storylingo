- key: s2
  source: b3cf233e159a5bcb
  translation: يقرر دانيال بناء آلة زمن في مطبخه، رغم أنه لا يعرف شيئاً عن الفيزياء. يستخدم الميكروويف ومروحة ضخمة وسبعة وأربعين
    متراً من ورق الألمنيوم. تقول جارته إن الأمر مستحيل، لكن دانيال سيتعين عليه الوصول إلى 2030 بطريقة ما. كان قد طلب المساعدة
    من ثلاثة علماء، لكن الثلاثة ضحكوا منه.
