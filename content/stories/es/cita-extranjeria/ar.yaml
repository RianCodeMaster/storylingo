summary: دانيال يحتاج موعداً في مكتب شؤون الأجانب، فأول موعد متاح في 2030، فيبني آلة زمن في مطبخه — ثم تأخذها جارته إلى القمر.
summary_source: e3a8158eff5bbe47
gestures:
  although: 'اهز كتفاً واحداً، وادفع عائقاً صغيراً متخيلاً بيدك، ثم أومئ بقوة كأنك تقول: «ومع ذلك!»'
  would_have_to: تنهّد بصوت عالٍ وتظاهر بحمل صندوق ضخم ثقيل على ظهرك بينما تأخذ خطوة بطيئة ودرامية.
  had_asked: اطرق ثلاث مرات على باب متخيل ثم مدّ يديك كمتسول يطلب شيئاً.
targets:
  aunque:
    gloss: رغم أن
    note: أداة ربط للتنازل؛ تقابل «رغم أن» في العربية.
  tendría que:
    gloss: سيتعين عليه أن
    note: شرط + que + مصدر؛ تقابل «سيكون عليه أن».
  había pedido:
    gloss: كان قد طلب
    note: 'ماضٍ بعيد: haber في الماضي + اسم المفعول؛ تقابل «كان قد طلب».'
scenes:
- key: s1
  source: bfd859ee2eaf412e
  translation: 'دانيال يعيش في مدريد ويحتاج موعداً في مكتب شؤون الأجانب. كان قد طلب موعداً طوال ثمانية أشهر، لكن أول موعد
    متاح هو في عام 2030. رغم أنه يتصل بالهاتف كل صباح، فالرد دائماً هو نفسه: «لا توجد مواعيد». سيتعين على دانيال الانتظار
    ست سنوات، وهذا كثير جداً.'
