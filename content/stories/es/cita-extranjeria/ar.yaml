- key: s5
  source: e516048b4e54e962
  translation: 'يعود دانيال إلى مطبخه، في 2024، وينظر إلى الهاتف: يوجد موعد متاح غداً في الثامنة! رغم أنه يصرخ من الفرح، تدخل
    جارته وتقول: «لقد استخدمت آلتك للذهاب إلى 2050؛ هناك أنت بالفعل إسباني». كان دانيال قد طلب موعداً طوال ثمانية أشهر والآن
    لم يعد يحتاجه. لكن سيتعين عليه إعادة الآلة إلى القمر، لأن جارته أوقفتها هناك.'
