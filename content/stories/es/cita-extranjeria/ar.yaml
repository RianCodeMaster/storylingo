- key: s3
  source: 8b8a5c0932eeaac0
  translation: 'يوم الثلاثاء، يضع دانيال تاريخ 2030 في الميكروويف ويضغط الزر. رغم وجود دخان كثيف وضجيج رهيب، تعمل الآلة: يظهر
    دانيال في 2030. في الشارع سيارات طائرة والناس يلبسون أحذية من ذهب، لكن مكتب شؤون الأجانب ما زال في المبنى الرمادي نفسه.
    سيتعين على دانيال الدخول بسرعة، لأن موعده في التاسعة.'
