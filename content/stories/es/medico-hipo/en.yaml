# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Javier goes to the doctor after three days of hiccups, but the doctor has hiccups too, and in the end the hiccups
  jump into her stethoscope.
summary_source: f16694e57dff8471
gestures:
  went: March on the spot with big exaggerated steps while your hand points forward to a far-away place, then freeze and point
    at the floor.
  have_past: Hug an invisible box against your chest with both arms and shake gently, like you are holding something heavy
    you have had for a long time.
  said: Open and close your hand like a talking mouth right in front of your own mouth, and move your head forward on every
    word.
  have: Hug an invisible box against your chest with both arms and shake gently, like you are holding something heavy you
    have had for a long time.
targets:
  fue:
    gloss: went; was
    note: Irregular preterite of ir/ser; English uses 'went' or 'was'.
  tenía:
    gloss: had; used to have
    note: Imperfect past for a past state; English usually says 'had'.
  dijo:
    gloss: said
    note: Irregular preterite of decir; English 'said' is also irregular.
