summary: يذهب خافيير إلى الطبيب بعد ثلاثة أيام من الفواق، لكن الطبيبة لديها فواق أيضاً، وفي النهاية ينتقل الفواق إلى سماعتها
  الطبية.
summary_source: f16694e57dff8471
gestures:
  went: سِرْ في مكانك بخطوات كبيرة مبالغ فيها، وأشر بيدك إلى مكان بعيد، ثم توقف وأشر إلى الأرض.
  have_past: عانق صندوقاً خيالياً إلى صدرك بذراعيك وهزّه برفق، كأنك تحمل شيئاً ثقيلاً مضى عليه وقت طويل.
  said: افتح يدك وأغلقها مثل فم يتكلم أمام فمك، وحرّك رأسك إلى الأمام مع كل كلمة.
  have: عانق صندوقًا خياليًا بذراعيك واضغطه على صدرك وحرّكه بلطف، كأنك تحمل شيئًا ثقيلًا منذ زمن طويل.
targets:
  fue:
    gloss: ذهبَ
    note: فعل ماضٍ من «ir» بمعنى ذهب هنا؛ العربية لا تصرّف حسب الشخص، والإسبانية تصرّف.
  tenía:
    gloss: كان لديه
    note: الماضي الناقص يعبّر عن حالة مستمرة؛ العربية تقول «كان عنده» غالباً.
  dijo:
    gloss: قالَ
    note: ماضٍ شاذّ من «decir»؛ العربية «قال» لا تتغير مع الفاعل، والإسبانية تتغير.
