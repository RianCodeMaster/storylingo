- key: s3
  source: ee4908028975c575
  translation: 'كانت الطبيبة كارمن سيرانو مصابة بالفواق أيضاً. كان لديها فواق منذ خمسة أيام. قالت: «هيب. صباح الخير، خافيير.
    هيب». قال خافيير: «دكتورة، عندي أربعة آلاف فواق في الساعة»، وقالت الطبيبة: «اهدأ، عندي فكرة».'
