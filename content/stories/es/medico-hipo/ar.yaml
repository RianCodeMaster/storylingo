- key: s5
  source: 9fc2413204f0ec5d
  translation: 'حينها شرب خافيير الماء بالمقلوب فاختفى فواقه. قالت الطبيبة: «جيد!» واختفى فواقها أيضاً. لكن السماعة الطبية
    كان لديها فواق: «هيب، هيب، هيب». ذهب خافيير إلى البيت سعيداً، وكانت الطبيبة تملك سماعة طبية مصابة بالفواق إلى الأبد.'
