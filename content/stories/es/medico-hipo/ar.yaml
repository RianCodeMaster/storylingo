- key: s1
  source: 4db80555e5a65ff9
  translation: 'كان خافيير مصاباً بالفواق منذ ثلاثة أيام. كان لديه أربعة آلاف فواق كل ساعة، وقالت جارته: «مصباحي يتحرك!».
    ذهب خافيير إلى طبيب الحي. ذهب في الثامنة صباحاً.'
