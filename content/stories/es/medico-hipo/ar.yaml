- key: s2
  source: 8a81b88dfcb5053d
  translation: 'في غرفة الانتظار، كانت الجدة مصابة بالفواق. الشرطي أيضاً كان مصاباً بالفواق. قالت الممرضة: «هيب. تفضل بالدخول،
    خافيير». ذهب خافيير إلى العيادة رقم ثلاثة عشر.'
