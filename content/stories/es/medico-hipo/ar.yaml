  translation: 'ذهبت الطبيبة إلى النافذة وصرخت: «تنين!». لم يكن خافيير خائفاً. قالت الطبيبة: «اشرب هذا الكأس من الماء». كان
    في الكأس عشرون لتراً، لكن خافيير شرب كله ثم ذهب إلى الحمام ثلاث مرات.'
