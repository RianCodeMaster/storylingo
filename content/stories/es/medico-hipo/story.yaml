      Javier fue al médico del barrio. Fue a las ocho de la mañana.'
    image_prompt: A thin Spanish man of about forty with messy black hair, round glasses and a red sweater is standing in
      a small kitchen, hiccuping with his whole body while a lampshade above him wobbles; the same character must look identical
      in every picture.
