story:
  title: Javier tiene hipo (y la doctora también)
  summary: Javier goes to the doctor after three days of hiccups, but the doctor has hiccups too, and in the end the hiccups
    jump into her stethoscope.
  gestures:
  - concept: went
    description: March on the spot with big exaggerated steps while your hand points forward to a far-away place, then freeze
      and point at the floor.
    emoji: 🚶
  - concept: have
    description: Hug an invisible box against your chest with both arms and shake gently, like you are holding something heavy
      you have had for a long time.
    emoji: 📦
  - concept: said
    description: Open and close your hand like a talking mouth right in front of your own mouth, and move your head forward
      on every word.
    emoji: 💬
  scenes:
