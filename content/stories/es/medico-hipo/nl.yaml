summary: Javier gaat na drie dagen hik naar de dokter, maar de dokter heeft ook de hik, en uiteindelijk springt de hik over
  naar haar stethoscoop.
summary_source: f16694e57dff8471
gestures:
  went: Doe alsof je met grote stappen ergens heen loopt, wijs naar een verre plek, stop en wijs naar de grond.
  have_past: Houd een onzichtbare doos stevig tegen je borst en schud zachtjes, alsof je iets zwaars al lang vasthoudt.
  said: Open en sluit je hand als een pratende mond vlak bij je eigen mond en beweeg je hoofd bij elk woord naar voren.
  have: Sla je armen om een onzichtbare doos tegen je borst en schud zachtjes, alsof je iets zwaars vasthoudt dat je al heel
    lang hebt.
targets:
  fue:
    gloss: ging
    note: 'Let op: fue is de verleden tijd van ir, net als ''ging'' in het Nederlands.'
  tenía:
    gloss: had
    note: 'Let op: tenía is de onvoltooid verleden tijd van tener, zoals ''had'' in het Nederlands.'
  dijo:
    gloss: zei
    note: 'Let op: dijo is de onregelmatige verleden tijd van decir, net als ''zei'' in het Nederlands.'
