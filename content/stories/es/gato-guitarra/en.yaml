# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Lucía moves into a new flat where a fat white cat plays the guitar terribly every night at four in the morning, until
  Lucía takes the guitar and plays it much better.
summary_source: b6b0f2f6a92db88a
gestures:
  have: Hug a big invisible box against your chest and pat it twice, nodding proudly like it is yours.
  live: Make a roof over your head with both hands, then point down at your feet twice to show where you live.
  play_instrument: Strum an imaginary guitar wildly with both hands, wiggle your hips and shout '¡Miau!'
targets:
  tiene:
    gloss: has
    note: Spanish often drops the subject pronoun; English needs 'he/she/it' before 'has'.
  vive:
    gloss: lives
    note: The -e ending often means he/she/it; English adds -s to 'live'.
  toca:
    gloss: plays (instrument)
    note: Use 'tocar' for instruments; English uses 'play' for both instruments and games.
