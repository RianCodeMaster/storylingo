# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Lucía verhuist naar een nieuw appartement waar een dikke witte kat elke nacht om vier uur 's ochtends vreselijk gitaar
  speelt, tot Lucía de gitaar pakt en veel beter speelt.
summary_source: b6b0f2f6a92db88a
gestures:
  have: Druk een grote onzichtbare doos tegen je borst en klop er twee keer op, knikkend alsof hij van jou is.
  live: Maak met beide handen een dak boven je hoofd en wijs twee keer naar je voeten om te tonen waar je woont.
  play_instrument: Strum wild met beide handen op een denkbeeldige gitaar, wiebel met je heupen en roep 'Miau!'
targets:
  tiene:
    gloss: heeft
    note: Spaans 'tiene' betekent hij/zij heeft; Nederlands gebruikt 'heeft' van 'hebben'.
  vive:
    gloss: woont
    note: Spaans 'vive' komt van 'vivir'; Nederlands zegt 'woont' van 'wonen'.
  toca:
    gloss: speelt (instrument)
    note: Spaans 'toca' gebruik je voor een muziekinstrument; Nederlands zegt 'speelt'.
scenes:
- key: s1
  source: 0faf0739f394b306
  translation: Lucía heeft een nieuw appartement. Het appartement is in Madrid. Het appartement heeft drie kamers en een enorm
    raam. Lucía heeft een kleine gele sleutel.
