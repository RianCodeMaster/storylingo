  - concept: have
    description: Hug a big invisible box against your chest and pat it twice, nodding proudly like it is yours.
    emoji: 📦
  - concept: live
    description: Make a roof over your head with both hands, then point down at your feet twice to show where you live.
    emoji: 🏠
  - concept: play_instrument
    description: Strum an imaginary guitar wildly with both hands, wiggle your hips and shout '¡Miau!'
    emoji: 🎸
