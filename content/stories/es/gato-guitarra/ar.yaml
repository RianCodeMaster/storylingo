# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: تنتقل لوسيا إلى شقة جديدة حيث يعزف قط أبيض سمين الغيتار بشكل سيئ كل ليلة في الرابعة صباحًا، حتى تأخذ لوسيا الغيتار
  وتعزف عليه أفضل بكثير.
summary_source: b6b0f2f6a92db88a
gestures:
  have: احضن صندوقًا كبيرًا غير مرئي إلى صدرك وربت عليه مرتين، وأومئ بفخر كأنه ملكك.
  live: اصنع سقفًا فوق رأسك بيديك، ثم أشر إلى قدميك مرتين لتظهر أين تعيش.
  play_instrument: 'اعزف غيتارًا خياليًا بجنون بكلتا يديك، وحرّك وركيك واصرخ: «مياو!»'
targets:
  tiene:
    gloss: لديه / يملك
    note: 'في الإسبانية يتصرّف الفعل مع الفاعل: yo tengo، ella tiene.'
  vive:
    gloss: يسكن / يعيش
    note: vive لـ él/ella، ومع yo نقول vivo؛ العربية لا تُصرّف الفعل هكذا.
  toca:
    gloss: يعزف / يلمس
    note: tocar + آلة = يعزف؛ مع él/ella تنتهي بـ -a.
scenes:
- key: s1
  source: 0faf0739f394b306
  translation: لدى لوسيا شقة جديدة. الشقة في مدريد. للشقة ثلاث غرف ونافذة عملاقة. لدى لوسيا مفتاح صغير أصفر.
  glosses:
    tiene: لديه
    piso: شقة
    nuevo: جديد
    está: تقع
    en: في
    "y": و
    habitaciones: غرف
    ventana: نافذة
    gigante: عملاقة
    llave: مفتاح
    pequeña: صغيرة
    amarilla: صفراء
- key: s2
  source: 053a1e5949dc6eb5
  translation: تعيش لوسيا في الشقة الجديدة. قط سمين أيضًا يعيش في الشقة. القط أبيض ولديه أذن سوداء. يعيش القط على الأريكة
    الحمراء.
  glosses:
