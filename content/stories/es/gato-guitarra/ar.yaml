- key: s3
  source: d487460ced8ea07e
  translation: 'في الرابعة صباحًا، يعزف القط الغيتار. الغيتار ضخم وأحمر. يعزف القط بشكل سيئ جدًا. يعزف القط ويغني: «مياو،
    مياو، مياو!»'
