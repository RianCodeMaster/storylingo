summary: بابلو ينتظر الحافلة ليذهب إلى العمل، لكن يصل حمار بنظارات شمسية، ثم تصل حمير كثيرة، ويكتشف أن الحمار هو سائق الحافلة.
summary_source: f42559beb584bc5d
gestures:
  wait: قف جامدًا كالتمثال، انقر على معصمك كأنك تنظر إلى الساعة، وتنهد بصوت عالٍ وأنت تنظر إلى السماء.
  arrive: افتح ذراعك كأنها باب حافلة وادفع قدمك إلى الأمام مع تعبير مفاجأة سعيد على وجهك.
  be_state: أشر إلى الأرض بكلتا يديك وجمّد وجهك في تعبير مضحك، سعيد أو غاضب، لتُظهر أين وكيف يكون الشخص.
targets:
  espera:
    gloss: ينتظر
    note: في الإسبانية يتغير الفعل مع الفاعل، بخلاف العربية التي يبقى فيها الفعل مع الضمير.
  llega:
    gloss: يصل
    note: هو يصل؛ الفعل الإسباني يتصرف مع الفاعل، والعربية تلحق الضمير بالفعل.
  está:
    gloss: يكون/يوجد
    note: تستخدم للمكان والحال، والعربية غالبًا تحذف فعل يكون في الحاضر.
