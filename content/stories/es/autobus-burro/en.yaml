# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Pablo waits for the bus to go to work, but a donkey with sunglasses arrives, and then a thousand donkeys arrive,
  and the donkey turns out to be the bus driver.
summary_source: f42559beb584bc5d
gestures:
  wait: Stand still, tap your wrist like a watch, and sigh while looking at the sky.
  arrive: Swing one arm like a bus door opening and step forward with a big 'ta-da!' face.
  be_state: Point to the floor with both hands and freeze your face in a silly state to show where and how someone is.
targets:
  espera:
    gloss: waits
    note: Spanish changes verb endings by person; English usually adds -s.
  llega:
    gloss: arrives
    note: The -a ending marks he/she/it; English adds -s.
  está:
    gloss: is (place/state)
    note: Spanish uses estar for place/state; English uses 'is'.
