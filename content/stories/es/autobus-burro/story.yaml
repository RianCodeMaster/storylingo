  - concept: wait
    description: Stand stiff as a statue, tap your wrist like a watch, and sigh loudly while looking at the sky.
    emoji: ⏳
  - concept: arrive
    description: Swing one arm like a bus door opening and stamp your foot forward with a big 'ta-da!' on your face.
    emoji: 🚪
  - concept: be_state
    description: Point to the floor with both hands and freeze your face in a silly state, happy or furious, to show where
      and how someone is.
    emoji: 📍
