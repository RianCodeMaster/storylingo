# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Pablo wacht op de bus naar zijn werk, maar er komt een ezel met zonnebril, daarna wel duizend ezels, en die ezel
  blijkt de buschauffeur te zijn.
summary_source: f42559beb584bc5d
gestures:
  wait: Sta stokstijf, tik op je pols als een horloge en zucht luid terwijl je naar de lucht kijkt.
  arrive: Zwaai één arm als een openschuivende busdeur en stamp je voet naar voren met een grote 'ta-da!'-blik.
  be_state: Wijs met beide handen naar de grond en zet je gezicht vast in een gekke staat, blij of woedend, om te tonen waar
    en hoe iemand is.
targets:
  espera:
    gloss: wacht
    note: 'Spaans vervoegt: espera = hij/zij wacht; Nederlands: hij/zij wacht.'
  llega:
    gloss: komt aan
    note: 'Spaans: llega = hij/zij komt aan; Nederlands heeft ''komt aan''.'
  está:
    gloss: is
    note: Spaans gebruikt 'está' voor plaats of stemming; Nederlands gebruikt gewoon 'is'.
