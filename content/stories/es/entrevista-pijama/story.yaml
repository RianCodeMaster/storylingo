story:
  title: La entrevista en pijama
  summary: Alejandro runs to a very important job interview and only in the office discovers that he is wearing his dinosaur
    pyjamas, but the company turns out to be looking for exactly that.
  gestures:
  - concept: realise
    description: Slap your forehead with one hand, open your eyes very wide, and point down at your own clothes with the other
      hand.
    emoji: 😳
  - concept: if_had
    description: Cover your eyes with one hand like you are hiding from your past self and wag a finger with the other hand.
    emoji: 🙈
  - concept: therefore
    description: Point at something, clap your hands together once, and then point forward with one finger like a decision
      is made.
    emoji: 👉
