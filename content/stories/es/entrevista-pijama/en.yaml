# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Alejandro runs to an important job interview, discovers in the office that he is wearing dinosaur pyjamas, and learns
  the company wants exactly someone to test pyjamas.
summary_source: 8d434fdc83e73852
gestures:
  realise: Slap your forehead with one hand, open your eyes very wide, and point down at your own clothes with the other hand.
  if_had: Cover your eyes with one hand like you are hiding from your past self and wag a finger with the other hand.
  therefore: Point at something, clap your hands together once, and then point forward with one finger like a decision is
    made.
targets:
  se dio cuenta de que:
    gloss: realised that
    note: Spanish uses 'darse cuenta de que' for 'realise that'; English uses no reflexive pronoun.
  si hubiera:
    gloss: if I had
    note: Introduces an unreal past condition; English often uses 'if I had + past participle'.
  por eso:
    gloss: that's why
    note: Means 'that's why'; it links a cause to a result, like English 'so'.
