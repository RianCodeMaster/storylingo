- key: s5
  source: 2254301e66e9ea3c
  translation: 'خرجت المديرة دونيا كارمن ببيجامة زرقاء عليها نجوم. قالت: «ممتاز! نحن نبحث عن شخص يجرّب بيجاماتنا». أدرك أليخاندرو
    أن خطأه كان حظًا. لو كان لبس بدلة، لما حصل على العمل. لهذا يعمل اليوم بالبيجامة كل يوم.'
