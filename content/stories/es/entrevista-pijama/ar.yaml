summary: يذهب أليخاندرو إلى مقابلة عمل مهمة جدًا، ولا يكتشف إلا في المكتب أنه يرتدي بيجامة الديناصور، لكن الشركة تبحث بالضبط
  عن ذلك.
summary_source: 8d434fdc83e73852
gestures:
  realise: اضرب جبهتك بيد، وافتح عينيك واسعًا، وأشر إلى ملابسك باليد الأخرى.
  if_had: غطِّ عينيك بيدك كأنك تخفي ماضيك، وحرّك إصبعك الآخر كتحذير.
  therefore: أشر إلى شيء، وصفّق مرة، ثم أشر إلى الأمام بإصبع واحد كأن القرار اتُّخذ.
targets:
  se dio cuenta de que:
    gloss: أدرك أن
    note: تركيب يعني «أدرك أن»؛ الفعل انعكاسي في الإسبانية، بينما العربية لا تحتاج ضميرًا انعكاسيًا.
  si hubiera:
    gloss: لو كنت قد
    note: يُستخدم مع اسم المفعول للفرض الماضي، ويقابله في العربية «لو» + الفعل الماضي.
  por eso:
    gloss: لهذا السبب
    note: رابط يعني «لهذا السبب» ويأتي قبل النتيجة، مثل «لذلك» في العربية.
