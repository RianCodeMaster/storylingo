  source: 41588b9fe9dac7d7
  translation: Alejandro had om half tien een heel belangrijk sollicitatiegesprek. Hij werd om twintig over negen wakker.
    Hij trok een jasje over zijn kleren aan en dacht dat hij klaar was. Daarom keek hij niet in de spiegel.
