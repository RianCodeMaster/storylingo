- key: s5
  source: 2254301e66e9ea3c
  translation: Mevrouw Carmen, de directrice, kwam naar buiten in een blauwe pyjama met sterren. 'Perfect!' zei ze. 'Wij zoeken
    iemand die onze pyjama's uitprobeert.' Alejandro besefte dat zijn fout geluk was. Als hij een pak had gedragen, had hij
    de baan niet gekregen. Daarom werkt hij vandaag elke dag in pyjama.
