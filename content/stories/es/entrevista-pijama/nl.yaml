# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Alejandro rent naar een heel belangrijk sollicitatiegesprek en ontdekt pas op kantoor dat hij zijn dinosauruspyjama
  draagt, maar het bedrijf blijkt precies zoiets te zoeken.
summary_source: 8d434fdc83e73852
gestures:
  realise: Sla met één hand op je voorhoofd, open je ogen wijd en wijs met je andere hand naar je kleren.
  if_had: Bedek je ogen met één hand alsof je je vroegere ik verbergt en zwaai met je andere hand met een opgeheven vinger.
  therefore: Wijs iets aan, klap één keer in je handen en wijs dan met één vinger naar voren alsof een besluit vaststaat.
targets:
  se dio cuenta de que:
    gloss: besefte dat
    note: In het Spaans heb je 'de que' nodig; in het Nederlands zeg je alleen 'dat'.
  si hubiera:
    gloss: als ... had
    note: Spaans gebruikt 'si hubiera + voltooid deelwoord'; Nederlands 'als ... had + voltooid deelwoord'.
  por eso:
    gloss: daarom
    note: Vaste verbinding voor 'daarom'; niet letterlijk als 'door dat' vertalen.
