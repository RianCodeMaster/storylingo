- key: s4
  source: 73f3bb34d1c6d9fa
  translation: 'Alejandro verstopte zich achter een enorme plant. Hij dacht: ''Als ik in de spiegel had gekeken, stond ik
    nu niet hier.'' Als hij normale kleren had gedragen, zou het gesprek makkelijk zijn. Hij besefte dat zijn jasje niets
    bedekte. Daarom belde hij zijn moeder om hulp te vragen.'
