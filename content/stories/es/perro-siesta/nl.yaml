# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Een heel klein hondje in Madrid kan door lawaaiige buren geen dutje doen, vindt een perfecte rustige plek en ontdekt
  dat het een concertpodium is.
summary_source: 7d6a533ebc4acf6c
gestures:
  cannot: Duw beide handen tegen een onzichtbare muur voor je en schud langzaam je hoofd, als een hondje dat er niet door
    kan.
  suddenly: Spring ter plekke, gooi je armen wijd open en zet je ogen groot, alsof er net een verrassing voor je ontplofte.
  went: Laat twee vingers stap voor stap over je andere handpalm lopen, als een hondje dat naar een nieuwe plek marcheert.
targets:
  no podía:
    gloss: kon niet
    note: Spaans gebruikt 'podía' voor een toestand in het verleden; Nederlands zegt vaak 'kon'.
  de repente:
    gloss: opeens
    note: Vaste uitdrukking; Nederlands 'opeens' staat ook vaak vooraan.
  fue a:
    gloss: ging naar
    note: '''Fue'' is verleden tijd van ''ir''; net als Nederlands ''ging naar''.'
