  source: ecdfb7d2bc97d52a
  translation: 'Pepito was een heel kleine hond. Hij woonde in Madrid, in een appartement met zijn familie. Elke dag wilde
    hij een dutje doen, maar hij kon niet slapen. De buren maakten veel lawaai: muziek, boormachines en een baby die schreeuwde.'
