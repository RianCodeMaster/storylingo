story:
  title: Pepito no podía dormir la siesta
  summary: A tiny dog in Madrid cannot nap because of noisy neighbours, finds the perfect quiet place, and discovers it is
    a concert stage.
  gestures:
  - concept: cannot
    description: Push both hands against an invisible wall in front of you and shake your head slowly, like a tiny dog who
      cannot get through.
    emoji: 🙅
  - concept: suddenly
    description: Jump on the spot, throw your arms wide open and open your eyes very big, as if a surprise just exploded in
      front of you.
    emoji: 😲
  - concept: went
    description: Walk two fingers across the palm of your other hand, step by step, like a little dog marching to a new place.
    emoji: 🚶
  scenes:
