# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: A tiny dog in Madrid cannot nap because of noisy neighbours, finds the perfect quiet place, and discovers it is a
  concert stage.
summary_source: 7d6a533ebc4acf6c
gestures:
  cannot: Push both hands against an invisible wall in front of you and shake your head slowly.
  suddenly: Jump on the spot, throw your arms wide open and open your eyes very big.
  went: Walk two fingers across your other palm, step by step.
targets:
  no podía:
    gloss: couldn't
    note: Spanish 'podía' is imperfect for an ongoing inability; English uses 'couldn't'.
  de repente:
    gloss: suddenly
    note: '''De repente'' is a set phrase; English ''suddenly'' is one word.'
  fue a:
    gloss: went to
    note: Spanish 'ir' is irregular; 'fue' means 'went'.
