summary: كلب صغير في مدريد لا يستطيع أخذ قيلولة بسبب جيرانه المزعجين، فيجد مكانًا هادئًا مثاليًا، ثم يكتشف أنه مسرح حفل موسيقي.
summary_source: 7d6a533ebc4acf6c
gestures:
  cannot: ادفع يديك كأنهما تلمسان جدارًا خفيًا وحرّك رأسك ببطء، مثل كلب صغير لا يستطيع المرور.
  suddenly: اقفز في مكانك وافتح ذراعيك وافتح عينيك كثيرًا كأن مفاجأة ظهرت فجأة.
  went: امشِ بإصبعين على راحة يدك خطوة خطوة، مثل كلب صغير يمشي إلى مكان جديد.
targets:
  no podía:
    gloss: لم يستطع
    note: الماضي الناقص مقابل «لم يستطع» في العربية.
  de repente:
    gloss: فجأة
    note: عبارة ظرفية مثل «فجأة» في العربية.
  fue a:
    gloss: ذهب إلى
    note: فعل ir في الماضي + a + مكان، مثل «ذهب إلى».
