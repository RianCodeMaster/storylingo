- key: s1
  source: ecdfb7d2bc97d52a
  translation: 'كان بيبيتو كلبًا صغيرًا جدًا. كان يعيش في مدريد، في شقة مع عائلته. كل يوم كان يريد أن يأخذ قيلولة، لكنه لم
    يستطع النوم. كان الجيران يصنعون ضجيجًا كثيرًا: موسيقى، ومثاقب، وطفل صغير يصرخ.'
