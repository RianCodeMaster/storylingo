story:
  title: Cincuenta tapas, por favor
  summary: Marta wants five tapas in a noisy bar in Madrid, but she orders too fast, gets fifty tapas, and ends up inviting
    the whole bar to a party.
  gestures:
  - concept: order
    description: Pretend to scribble wildly in a tiny invisible notebook, then throw the note over your shoulder like a pizza
      chef.
    emoji: 📝
  - concept: want
    description: Hug yourself and stare at an imaginary cake with huge hungry eyes, licking your lips.
    emoji: 😋
  - concept: there_is
    description: Sweep both arms wide open like a giant curtain, then point at the empty space with your mouth open in surprise.
    emoji: 👐
  scenes:
