# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Marta wants five tapas in a noisy bar in Madrid, but she orders too fast, gets fifty tapas, and ends up inviting
  the whole bar to a party.
summary_source: 0e032b6d36e66602
gestures:
  order: Pretend to scribble wildly in a tiny invisible notebook, then throw the note over your shoulder like a pizza chef.
  want: Hug yourself and stare at an imaginary cake with huge hungry eyes, licking your lips.
  there_was: Sweep both arms wide open like a giant curtain, then point at the empty space with your mouth open in surprise.
  there_is: Sweep both arms wide open like a giant curtain, then point at the empty space with your mouth open in surprise.
targets:
  pidió:
    gloss: ordered (he/she)
    note: Preterite of pedir; English simple past 'ordered'.
  quería:
    gloss: wanted
    note: Imperfect; English often uses simple 'wanted' for ongoing desire.
  había:
    gloss: there was/were
    note: Spanish haber = English 'there is/are'; here past 'there was/were'.
