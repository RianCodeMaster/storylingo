- key: s5
  source: dc60b673df587c48
  translation: 'في النهاية، دعت مارتا كل من في الحانة: «تاباس مجانًا للجميع!». أراد الجميع أن يأكلوا، وأراد باكو أن يرقص.
    كانت هناك حفلة ضخمة في الحانة الصغيرة. ولم يطلب باكو نقودًا: بل طلب جولة أخرى من التاباس.'
