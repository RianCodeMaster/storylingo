- key: s4
  source: 08dcabbf716d6ef2
  translation: نظرت مارتا إلى الطاولة وأرادت أن تبكي. كان هناك طعام يكفي مئة شخص، لكن في الحانة لم يكن هناك مكان لمزيد من
    الأطباق. حينها اتصلت مارتا بجارها بيبي. طلب بيبي خمس تاباس إضافية وأكل بسرعة كبيرة.
