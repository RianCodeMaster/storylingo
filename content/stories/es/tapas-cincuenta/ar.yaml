  source: 27a28a3b0e94486a
  translation: كانت مارتا جائعة جدًا. أرادت أن تأكل تاباس في حانة صغيرة في مدريد. كان في الحانة ناس كثيرون، وكان هناك أيضًا
    ضجيج كثير. أرادت مارتا طاولة هادئة.
