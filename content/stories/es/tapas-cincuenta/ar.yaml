- key: s3
  source: 697d2687872c8fd0
  translation: 'كتب باكو الطلب وذهب إلى المطبخ. بعد عشر دقائق، أحضر ما طلبته مارتا: خمسون تابا! كانت هناك أطباق من العجة والجامون
    والجبن في كل مكان. «خمسون!» صرخت مارتا. «أنا أردت خمسة!»'
