summary: تريد مارتا خمسة أطباق تاباس في حانة صاخبة في مدريد، لكنها تطلب بسرعة كبيرة، فتصلها خمسون تاباس، وتدعو في النهاية
  كل من في الحانة إلى حفلة.
summary_source: 0e032b6d36e66602
gestures:
  order: تظاهر بأنك تكتب بسرعة كبيرة في دفتر صغير غير مرئي، ثم ارمِ الورقة خلف كتفك مثل طاهي بيتزا.
  want: عانق نفسك وحدّق في كعكة خيالية بعينين جائعتين كبيرتين، ولحس شفتيك.
  there_was: افتح ذراعيك على وسعهما مثل ستارة عملاقة، ثم أشر إلى الفراغ وفمك مفتوح من الدهشة.
  there_is: افتح ذراعيك على مصراعيهما كأنك تسحب ستارة كبيرة، ثم أشِر إلى الفراغ وفمك مفتوح من الدهشة.
targets:
  pidió:
    gloss: طلب/طلبت
    note: 'ماضٍ من pedir؛ في العربية يتغير حسب الفاعل: طلب/طلبت.'
  quería:
    gloss: أراد/كان يريد
    note: ماضٍ ناقص للرغبة؛ قارنه بـ«كان يريد».
  había:
    gloss: كان هناك
    note: فعل وجود بمعنى «يوجد/كان هناك».
