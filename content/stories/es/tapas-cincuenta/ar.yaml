- key: s2
  source: 8704942bc9df2fd6
  translation: كان اسم النادل باكو، وكان لديه شارب ضخم. لم يكن باكو يسمع جيدًا لأن هناك موسيقى عالية جدًا. أرادت مارتا خمس
    تاباس بالعجة. لكن مارتا طلبت بسرعة كبيرة، فابتسم باكو.
