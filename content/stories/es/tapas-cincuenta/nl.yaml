- key: s5
  source: dc60b673df587c48
  translation: 'Uiteindelijk nodigde Marta de hele bar uit: «Gratis tapas voor iedereen!». Iedereen wilde eten, en Paco wilde
    dansen. Er was een enorm feest in de kleine bar. En Paco vroeg geen geld: hij bestelde nog een ronde tapas.'
