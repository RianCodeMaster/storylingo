# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Marta wil vijf tapas in een lawaaiige bar in Madrid, maar ze bestelt te snel, krijgt vijftig tapas en nodigt uiteindelijk
  de hele bar uit voor een feest.
summary_source: 0e032b6d36e66602
gestures:
  order: Doe alsof je wild in een piepklein denkbeeldig notitieboekje krabbelt en gooi het briefje over je schouder als een
    pizzabakker.
  want: Sla je armen om jezelf en staar met grote hongerige ogen naar een denkbeeldige taart, terwijl je je lippen aflik.
  there_was: Zwaai je armen wijd open als een groot gordijn en wijs dan met open mond van verbazing naar de lege plek.
  there_is: Zwaai beide armen wijd open als een groot gordijn en wijs dan met open mond van verbazing naar de lege plek.
targets:
  pidió:
    gloss: bestelde
    note: Derde persoon verleden tijd; vergelijk Nederlands 'bestelde'.
  quería:
    gloss: wilde
    note: Onvoltooid verleden tijd; vergelijk Nederlands 'wilde'.
  había:
    gloss: er was/waren
    note: Onpersoonlijk; vergelijk Nederlands 'er was/waren'.
