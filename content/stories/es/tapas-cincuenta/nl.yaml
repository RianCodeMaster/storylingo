- key: s3
  source: 697d2687872c8fd0
  translation: 'Paco schreef de bestelling op en ging naar de keuken. Tien minuten later bracht hij wat Marta had besteld:
    vijftig tapas! Overal stonden borden met tortilla, ham en kaas. «Vijftig!», riep Marta. «Ik wilde er vijf!»'
