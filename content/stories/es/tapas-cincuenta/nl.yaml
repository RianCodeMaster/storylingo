  source: 08dcabbf716d6ef2
  translation: Marta keek naar de tafel en wilde huilen. Er was eten voor honderd mensen, maar in de bar was geen ruimte voor
    meer borden. Toen belde Marta haar buurman Pepe. Pepe bestelde nog vijf tapas en at heel snel.
