# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Sofía woont in een flat in Madrid met vier huisgenoten en een zeer serieuze kip, Pepa, die beslist wie de badkamer
  schoonmaakt, tot een zak maïs en een klassiek concert Pepa's echte geheim onthullen.
summary_source: a14f733f7ae7d2bd
gestures:
  would_like: Leg beide handen op je hart, sluit je ogen en zucht alsof je van een enorme taart droomt.
  however: Steek één platte hand op en draai die dan scherp om, zodat de rug van je hand te zien is, alsof je een pannenkoek
    omkeert.
  when: Knipper één keer met je vingers en wijs naar een denkbeeldige klok, alsof er net een magisch moment begint.
targets:
  me gustaría:
    gloss: ik zou graag willen
    note: 'Spaans: me gustaría + infinitief; Nederlands: ik zou graag ... willen.'
  sin embargo:
    gloss: echter
    note: Staat vaak aan het begin met komma; Nederlands 'echter' kan ook middenin staan.
  cuando:
    gloss: wanneer/als
    note: Betekent 'wanneer/als'; na cuando geen toekomende tijd voor toekomst.
