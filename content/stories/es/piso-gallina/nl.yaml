- key: s4
  source: 5213ce244769f1ac
  translation: 'Sofía is wanhopig: de badkamervloer heeft al driehonderd kippenharen. ''Ik zou willen dat Pepa de badkamer
    schoonmaakte'', zegt ze tegen haar huisgenoten, ''maar ze schreeuwt alleen maar''. Haar huisgenoten hebben een idee: ze
    geven Pepa een kleine bezem en een zak maïs. Wanneer Pepa de maïs ziet, rent ze naar de badkamer en sluit de deur.'
