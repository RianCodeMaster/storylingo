- key: s5
  source: d96cb13be2c766b5
  translation: 'Een half uur later opent Sofía heel langzaam de badkamerdeur. Pepa maakt helemaal niets schoon: ze zit in
    de badkuip, met klassieke muziek, en zingt als een operazangeres. ''Ik zou graag een normale kip zijn'', zegt Pepa, ''maar
    ik vind warm water heerlijk''. Sinds die dag neemt Pepa elke dag een bad, en wanneer ze klaar is, is de badkamer echt
    schoon.'
