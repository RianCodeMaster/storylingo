- key: s3
  source: 25be251ce139fafd
  translation: Op een maandag besluit Pepa dat Sofía elke dag de badkamer schoonmaakt, vier keer per dag. 'Ik zou graag een
    andere kip hebben', denkt Sofía, maar Pepa is de enige kip in de buurt. Toch accepteert Sofía het, want ze is heel beleefd.
    Als ze klaar is, glanst de badkamer als een spiegel, en Pepa maakt hem met haar poten weer vies.
