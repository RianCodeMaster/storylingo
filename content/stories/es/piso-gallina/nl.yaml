- key: s2
  source: 19c339eacc563ffe
  translation: 'Pepa heeft een heel eenvoudig systeem om te beslissen wie de badkamer schoonmaakt. Wanneer iemand naar binnen
    wil, kijkt Pepa naar diens nagels: als ze vies zijn, schreeuwt ze als een politieagent. Als de nagels echter schoon zijn,
    mag de persoon naar binnen. ''Ik zou graag een normale badkamer hebben'', zegt Sofía, maar Pepa luistert niet.'
