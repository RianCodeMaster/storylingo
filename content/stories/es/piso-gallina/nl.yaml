- key: s1
  source: bbb74c87b286d531
  translation: In een klein flatje in Madrid woont Sofía met vier huisgenoten en een kip. De kip heet Pepa en is erg serieus.
    Wanneer Sofía 's ochtends opstaat, staat er altijd een enorme rij voor de badkamer. Pepa staat bij de deur en kijkt naar
    iedereen als een rechter.
