story:
  title: Pepa, la gallina que manda en el baño
  summary: Sofía shares a flat in Madrid with four people and a very serious hen called Pepa, who decides who cleans the bathroom,
    until a bag of corn and a classical-music concert reveal Pepa's real secret.
  gestures:
  - concept: would_like
    description: Put both hands over your heart, close your eyes and sigh like you are dreaming of a giant cake.
    emoji: 😌
  - concept: however
    description: Hold up one flat hand, then sharply turn it over to show the back of your hand, like flipping a pancake.
    emoji: 🔄
  - concept: when
    description: Snap your fingers once and point at an imaginary clock, as if a magic moment just started.
    emoji: ⏰
  scenes:
  - key: s1
    text: En un piso pequeño de Madrid vive Sofía con cuatro compañeros y una gallina. La gallina se llama Pepa y es muy seria.
      Cuando Sofía se levanta por la mañana, siempre hay una cola enorme delante del baño. Pepa está en la puerta y mira a
      todos como un juez.
    image_prompt: 'A small sunny Madrid flat hallway: Sofía, a young woman with curly dark hair, red glasses and a yellow
      jumper, stands in a queue with four other roommates, while a small white hen with a red comb and a tiny purple scarf
      sits in front of the bathroom door like a judge.'
