summary: صوفيا تشارك شقة في مدريد مع أربعة أشخاص ودجاجة جدّية جدًا اسمها بيبا، التي تقرر من ينظف الحمّام، إلى أن يكشف كيس
  ذرة وحفل موسيقى كلاسيكية سرّ بيبا الحقيقي.
summary_source: a14f733f7ae7d2bd
gestures:
  would_like: ضع كلتي يديك على قلبك، أغمض عينيك وتنفّس ببطء كأنك تحلم بكعكة ضخمة.
  however: ارفع يدًا واحدة مسطحة، ثم اقلبها بسرعة لتُظهر ظهر يدك، كأنك تقلب فطيرة.
  when: افرقع بأصابعك مرة واحدة وأشر إلى ساعة خيالية، كأن لحظة سحرية بدأت للتو.
targets:
  me gustaría:
    gloss: أودّ
    note: تعبير مهذّب عن الرغبة؛ في العربية يُقابله «أودّ» غالبًا.
  sin embargo:
    gloss: ومع ذلك
    note: رابط استدراك؛ مثل «لكن» أو «ومع ذلك» ويبدأ جملة جديدة غالبًا.
  cuando:
    gloss: عندما
    note: ظرف زمني؛ في العربية «عندما/حين» ويأتي بعده فعل عادة.
scenes:
- key: s1
  source: bbb74c87b286d531
  translation: في شقة صغيرة في مدريد تعيش صوفيا مع أربعة رفقاء ودجاجة. الدجاجة اسمها بيبا وهي جدّية جدًا. عندما تستيقظ صوفيا
    في الصباح، يكون هناك دائمًا طابور ضخم أمام الحمّام. بيبا تقف عند الباب وتنظر إلى الجميع مثل قاضٍ.
