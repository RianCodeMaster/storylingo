- key: s4
  source: 5213ce244769f1ac
  translation: 'صوفيا يائسة: أرضية الحمّام فيها الآن ثلاثمئة شعرة دجاج. تقول لرفقائها: «أودّ أن تنظف بيبا الحمّام»، «ومع ذلك،
    هي فقط تصرخ». لدى رفقائها فكرة: يعطون بيبا مكنسة صغيرة وكيس ذرة. عندما ترى بيبا الذرة، تركض إلى الحمّام وتغلق الباب.'
