- key: s2
  source: 19c339eacc563ffe
  translation: 'لدى بيبا نظام بسيط جدًا لتقرير من ينظف الحمّام. عندما يريد شخص ما الدخول، تنظر بيبا إلى أظافره: إذا كانت متسخة،
    تصرخ مثل شرطية. ومع ذلك، إذا كانت الأظافر نظيفة، يمكن للشخص أن يمرّ. تقول صوفيا: «أودّ لو كان لديّ حمّام عادي»، لكن بيبا
    لا تستمع.'
