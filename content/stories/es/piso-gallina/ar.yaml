- key: s3
  source: 25be251ce139fafd
  translation: 'في يوم اثنين، تقرر بيبا أن صوفيا تنظف الحمّام كل يوم، أربع مرات في اليوم. تفكر صوفيا: «أودّ لو كان لديّ دجاجة
    أخرى»، لكن بيبا هي الدجاجة الوحيدة في الحي. ومع ذلك، تقبل صوفيا، لأنها مهذبة جدًا. عندما تنتهي، يلمع الحمّام مثل المرآة،
    فتعيد بيبا توسيخه بأقدامها.'
