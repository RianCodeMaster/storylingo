# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Sofía shares a small flat in Madrid with four people and a very serious hen, Pepa, who controls the bathroom and
  hides a secret love of classical music and hot baths.
summary_source: a14f733f7ae7d2bd
gestures:
  would_like: Put both hands over your heart, close your eyes and sigh like you are dreaming of a giant cake.
  however: Hold up one flat hand, then sharply turn it over to show the back of your hand, like flipping a pancake.
  when: Snap your fingers once and point at an imaginary clock, as if a magic moment just started.
targets:
  me gustaría:
    gloss: I would like
    note: Spanish puts 'me' before the verb; English says 'I would like' with the liker as subject.
  sin embargo:
    gloss: however
    note: Formal connector like English 'however'; it usually needs a comma.
  cuando:
    gloss: when
    note: For future events Spanish often uses the subjunctive after cuando, unlike English 'when'.
