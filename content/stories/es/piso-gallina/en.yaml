  source: bbb74c87b286d531
  translation: In a small flat in Madrid, Sofía lives with four flatmates and a hen. The hen is called Pepa and is very serious.
    When Sofía gets up in the morning, there is always a huge queue outside the bathroom. Pepa is at the door and looks at
    everyone like a judge.
