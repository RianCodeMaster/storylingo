- key: s5
  source: d96cb13be2c766b5
  translation: 'Half an hour later, Sofía opens the bathroom door very slowly. Pepa isn''t cleaning anything: she is in the
    bathtub, with classical music, and sings like an opera singer. ''I would like to be a normal hen,'' says Pepa, ''however,
    I really like hot water.'' From that day on, Pepa bathes every day, and when she finishes, the bathroom is really clean.'
