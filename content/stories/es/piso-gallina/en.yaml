- key: s2
  source: 19c339eacc563ffe
  translation: 'Pepa has a very simple system for deciding who cleans the bathroom. When someone wants to go in, Pepa looks
    at their nails: if they are dirty, she shouts like a policewoman. However, if the nails are clean, the person can go in.
    ''I would like to have a normal bathroom,'' says Sofía, but Pepa doesn''t listen.'
