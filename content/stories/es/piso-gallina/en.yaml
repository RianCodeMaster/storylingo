- key: s4
  source: 5213ce244769f1ac
  translation: 'Sofía is desperate: the bathroom floor already has three hundred hen hairs. ''I would like Pepa to clean the
    bathroom,'' she says to her flatmates, ''however, she only shouts.'' Her flatmates have an idea: they give Pepa a small
    broom and a bag of corn. When Pepa sees the corn, she runs to the bathroom and closes the door.'
