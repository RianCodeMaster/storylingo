- key: s3
  source: 25be251ce139fafd
  translation: One Monday, Pepa decides that Sofía cleans the bathroom every day, four times a day. 'I would like to have
    another hen,' Sofía thinks, but Pepa is the only hen in the neighbourhood. However, Sofía accepts, because she is very
    polite. When she finishes, the bathroom shines like a mirror, and Pepa dirties it again with her feet.
