summary: تشتري كارمن بطيخة ضخمة من السوق، لكنها أكبر من أن تدخل بيتها الصغير، وتجد داخلها مئة بطيخة صغيرة.
summary_source: f90d4b6771a2b601
gestures:
  buy: امسك بطيخة خيالية ضخمة بذراعيك، ثم اصفع عملة في يد بائع خيالي واغمز بعينك.
  be: أشر إلى نفسك بإبهاميك، ثم ابسط ذراعيك بعرضهما لتبين أن شيئًا ضخم جدًا.
  want: مدّ يديك إلى الأمام مثل من يتلهف إلى بطيخة ويلعق شفتيه.
targets:
  compra:
    gloss: تشتري
    note: 'فعل مضارع للغائب المفرد؛ في العربية يتغير حسب الفاعل: هي تشتري.'
  es:
    gloss: تكون
    note: 'في العربية لا نستخدم فعل الكينونة عادة في المضارع: هي كبيرة.'
  quiere:
    gloss: تريد
    note: 'فعل مضارع للغائب المفرد؛ في العربية: هي تريد.'
