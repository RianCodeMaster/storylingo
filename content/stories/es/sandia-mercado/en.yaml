# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Carmen buys an enormous watermelon at the market, but it is far too big for her small house, and inside it she finds
  a hundred tiny watermelons.
summary_source: f90d4b6771a2b601
gestures:
  buy: Hold an invisible giant watermelon with both arms, then slap a coin into an imaginary shopkeeper's hand and wink.
  be: Point at yourself with both thumbs, then stretch your arms out wide to show how enormously big something is.
  want: Stretch both hands forward like a hungry zombie reaching for a watermelon and lick your lips.
targets:
  compra:
    gloss: buys
    note: Spanish verb endings show who does it; English often needs a pronoun like 'she'.
  es:
    gloss: is
    note: Spanish has two verbs for 'to be'; English has only one.
  quiere:
    gloss: wants
    note: Spanish changes the ending to show 'he/she wants'; English uses the pronoun.
