# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Carmen koopt een enorme watermeloen op de markt, maar die is veel te groot voor haar kleine huis, en binnenin vindt
  ze honderd kleine watermeloenen.
summary_source: f90d4b6771a2b601
gestures:
  buy: Doe alsof je een reusachtige watermeloen met beide armen vasthoudt, sla dan een munt in de hand van een denkbeeldige
    marktkoopman en knipoog.
  be: Wijs met beide duimen naar jezelf en strek daarna je armen wijd uit om te laten zien hoe enorm groot iets is.
  want: Steek beide handen naar voren als een hongerige zombie die een watermeloen wil pakken en lik je lippen.
targets:
  compra:
    gloss: koopt
    note: Spaans 'compra' is één werkwoordsvorm; Nederlands zegt 'koopt'.
  es:
    gloss: is
    note: Spaans 'es' komt van 'ser'; Nederlands 'is' komt van 'zijn'.
  quiere:
    gloss: wil
    note: Spaans 'quiere' komt van 'querer'; de stam verandert.
