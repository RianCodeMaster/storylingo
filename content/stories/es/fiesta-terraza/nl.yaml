- key: s3
  source: 9912377c442b5c69
  translation: Toen kwam burgemeester Bermúdez met een muziekkorps van dertig muzikanten. Het korps speelde heel hard een
    pasodoble terwijl de buren dansten. Elena opende alle zakken chips zodat de mensen iets konden eten. 'Wat een mooi feest!'
    zei de burgemeester.
