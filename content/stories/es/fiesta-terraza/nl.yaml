# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Elena had vijf vrienden uitgenodigd, maar door een verkeerd bericht komt de hele buurt, de burgemeester met een muziekkorps
  en Elena's woedende kat, en uiteindelijk wordt het het beste feest van het jaar.
summary_source: 3ad61538bebcd962
gestures:
  had_invited: Doe alsof je een klein uitnodigingsbriefje op een plakbriefje schrijft en het met één vinger ver weg laat schieten,
    terwijl je 'pum!' zegt wanneer het bij één persoon landt.
  so_that: Open een onzichtbare deur zo wijd als je kunt met beide armen en houd hem open met een trotse glimlach, knikkend
    zodat de ander erdoor kan lopen.
  while: Wrijf met één hand cirkels over je buik en klop tegelijk met de andere op je hoofd, wiegend met je heupen om te laten
    zien dat twee dingen tegelijk gebeuren.
targets:
  había invitado:
    gloss: had uitgenodigd
    note: 'Net als ''had uitgenodigd'': haber + voltooid deelwoord.'
  para que:
    gloss: zodat
    note: Na 'para que' volgt in het Spaans de subjuntivo; Nederlands 'zodat' gebruikt de gewone werkwoordsvorm.
  mientras:
    gloss: terwijl
    note: Net als 'terwijl'; bij gelijktijdige feiten vaak indicativo.
scenes:
- key: s1
  source: c5ef6de0dac9c9f5
  translation: Elena had vijf vrienden uitgenodigd op haar kleine terras. De hele ochtend maakte ze schoon, kocht ze twaalf
    kroketten en zette ze zes stoelen klaar zodat iedereen het comfortabel had. Terwijl ze een liedje van Rosalía zong, keek
    ze op haar telefoon en glimlachte.
