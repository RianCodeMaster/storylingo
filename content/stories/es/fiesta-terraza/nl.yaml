- key: s4
  source: d75b997bbbf039ad
  translation: 'Het probleem was dat het terras heel klein was: tweehonderd mensen op twintig vierkante meter. Het gebouw
    begon te bewegen en Elena''s kat Napoleón sprong woedend op het hoofd van de burgemeester. Terwijl de band harder speelde,
    rende Elena naar de bar beneden om meer ijs te krijgen.'
