- key: s5
  source: 37e4e66043f59c96
  translation: 'Uiteindelijk brachten alle buren eten en het feest werd het beste van het jaar. Elena keek op haar telefoon
    en zag de waarheid: ze had de hele buurt uitgenodigd, omdat ze het bericht naar de groep ''Hele Buurt'' had gestuurd en
    niet naar haar vijf vrienden. Ze lachte en danste met de burgemeester. Terwijl Napoleón op de bank sliep, besloot Elena
    het feest elke maand te herhalen.'
