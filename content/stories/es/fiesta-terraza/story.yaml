story:
  title: 'La fiesta de Elena: ¡todo el barrio en la terraza!'
  summary: Elena había invitado a cinco amigos, pero por un mensaje equivocado llegan todo el barrio, el alcalde con una banda
    de música y su gato furioso, y al final es la mejor fiesta del año.
  gestures:
  - concept: had_invited
    description: Pretend you are writing a tiny invitation on a sticky note and then flick it far away with one finger, saying
      '¡pum!' as it lands on one single person.
    emoji: ✉️
  - concept: so_that
    description: Open an invisible door as wide as you can with both arms and hold it open with a big proud smile, nodding
      so the other person walks through.
    emoji: 🚪
  - concept: while
    description: Rub your belly in circles with one hand and pat the top of your head at the same time, wiggling your hips
      to show that two things happen at once.
    emoji: 🔄
