- key: s5
  source: 37e4e66043f59c96
  translation: 'In the end, all the neighbors brought food and the party was the best of the year. Elena looked at her phone
    and saw the truth: she had invited the whole neighborhood, because she sent the message to the group ''Whole Neighborhood''
    and not to her five friends. She laughed and danced with the mayor. While Napoleon slept on the sofa, Elena decided to
    repeat the party every month.'
