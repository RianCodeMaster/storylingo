  source: c5ef6de0dac9c9f5
  translation: Elena had invited five friends to her small terrace. All morning she cleaned, bought twelve croquettes and
    put out six chairs so everyone would be comfortable. While she was singing a Rosalía song, she looked at her phone and
    smiled.
