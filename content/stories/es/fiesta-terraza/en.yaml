# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Elena meant to invite five friends, but a wrong message brings the whole neighborhood, the mayor with a band and
  her furious cat, and it turns into the best party of the year.
summary_source: 3ad61538bebcd962
gestures:
  had_invited: Pretend you are writing a tiny invitation on a sticky note and then flick it far away with one finger, saying
    '¡pum!' as it lands on one single person.
  so_that: Open an invisible door as wide as you can with both arms and hold it open with a big proud smile, nodding so the
    other person walks through.
  while: Rub your belly in circles with one hand and pat the top of your head at the same time, wiggling your hips to show
    that two things happen at once.
targets:
  había invitado:
    gloss: had invited
    note: 'Spanish past perfect: había + participle, like English ''had invited''.'
  para que:
    gloss: so that
    note: Takes the subjunctive, unlike English 'so that'.
  mientras:
    gloss: while
    note: Used for two actions happening at the same time, like English 'while'.
