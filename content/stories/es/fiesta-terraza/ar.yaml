- key: s5
  source: 37e4e66043f59c96
  translation: 'في النهاية أحضر كل الجيران طعامًا وكانت الحفلة أفضل حفلة في السنة. نظرت إيلينا إلى هاتفها ورأت الحقيقة: كانت
    قد دعت كل الحي، لأنها أرسلت الرسالة إلى مجموعة «الحي كله» وليس إلى أصدقائها الخمسة. فضحكت ورقصت مع العمدة. وبينما كان
    نابليون نائمًا على الأريكة، قررت إيلينا تكرار الحفلة كل شهر.'
