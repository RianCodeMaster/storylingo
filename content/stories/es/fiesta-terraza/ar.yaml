summary: دعت إيلينا خمسة أصدقاء، لكن بسبب رسالة خاطئة وصل الحي كله، والعمدة مع فرقة موسيقية وقطه الغاضب، وفي النهاية كانت
  أفضل حفلة في السنة.
summary_source: 3ad61538bebcd962
gestures:
  had_invited: تظاهر بأنك تكتب دعوة صغيرة على ورقة لاصقة ثم تنقرها بإصبعك بعيدًا وهي تقول «بُم!» لتقع على شخص واحد فقط.
  so_that: افتح بابًا خياليًا بعرض ما تستطيع بكلتا يديك واحتفظ به مفتوحًا بابتسامة فخورة وهزّ رأسك كي يعبر الآخر.
  while: افرك بطنك بحركات دائرية بيد واربت على رأسك بالأخرى في الوقت نفسه وهزّ وركيك لتظهر أن أمرين يحدثان معًا.
targets:
  había invitado:
    gloss: كانت قد دعت
    note: الماضي التام في الإسبانية (había + اسم المفعول) يقابل «كان قد فعل» في العربية.
  para que:
    gloss: لكي / حتى
    note: يتبعه فعل في صيغة subjuntivo، بينما في العربية يليه فعل مضارع منصوب غالبًا.
  mientras:
    gloss: بينما / في حين
    note: يَربط حدثين متزامنين، مثل «بينما» في العربية.
