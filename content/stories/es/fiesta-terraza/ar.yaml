- key: s1
  source: c5ef6de0dac9c9f5
  translation: دعت إيلينا خمسة أصدقاء إلى شرفتها الصغيرة. طوال الصباح نظّفت واشترت اثنتي عشرة كروكيت ووضعت ست كراسي ليكون
    الجميع مرتاحين. وبينما كانت تغني أغنية لروزاليا، نظرت إلى هاتفها وابتسمت.
