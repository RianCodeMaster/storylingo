- key: s2
  source: ddbc85b7f1e017b8
  translation: 'في الثامنة رنّ الجرس. لم يكونوا خمسة أصدقاء: بل كان الحي كله. وصل جارها باكو مع عائلته، عشرين شخصًا، وخلفه
    كان هناك مئة جار آخر. كانت إيلينا قد دعت خمسة أشخاص فقط وكان لديها اثنتا عشرة كروكيت فقط.'
