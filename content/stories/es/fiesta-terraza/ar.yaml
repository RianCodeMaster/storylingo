- key: s4
  source: d75b997bbbf039ad
  translation: 'كانت المشكلة أن الشرفة صغيرة جدًا: مئتا شخص في عشرين مترًا. بدأ المبنى يتحرك، فقفز قط إيلينا نابليون غاضبًا
    إلى رأس العمدة. وبينما كانت الفرقة تعزف بصوت أعلى، جرت إيلينا إلى الحانة بالأسفل لكي يعطوها مزيدًا من الثلج.'
