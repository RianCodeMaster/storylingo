- key: s3
  source: 9912377c442b5c69
  translation: 'ثم وصل العمدة برموديث مع فرقة موسيقية من ثلاثين موسيقيًا. عزفت الفرقة باسودوبلي بصوت عالٍ جدًا بينما كان الجيران
    يرقصون. فتحت إيلينا كل أكياس البطاطس لكي يأكل الناس شيئًا. قال العمدة: «يا لها من حفلة جميلة!»'
