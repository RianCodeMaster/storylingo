# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Carmen, a 92-year-old grandmother from Seville, wants to be a flamenco star but is afraid of the stage, until her
  enormous cat helps her dance on TV in her tiny 1960 shoes.
summary_source: bb2215589c84c4d6
gestures:
  want: Open both arms wide in front of you and pull the air into your chest with a greedy face, like you are grabbing exactly
    what you want.
  afraid: Hug yourself tightly, shake like jelly and open your eyes very wide with a scared face.
  finally: Throw both arms up in the air, look up at the sky and shout '¡por fin!' like you just won the lottery.
targets:
  quería:
    gloss: wanted
    note: 'Imperfect past: it describes a past wish or background, like English ''wanted'' here; compare preterite ''quise''.'
  tenía miedo:
    gloss: was afraid
    note: Spanish uses tener miedo ('have fear'), not ser miedo; 'tenía' is imperfect 'was'.
  por fin:
    gloss: finally / at last
    note: Fixed phrase; unlike English 'finally', it often stresses a long wait.
