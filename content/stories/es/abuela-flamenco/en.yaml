- key: s1
  source: fe2159a4bd996955
  translation: 'Carmen was 92 years old and lived in Seville with her cat, a huge orange cat. Carmen wanted to be a flamenco
    star. But she was afraid of the stage and afraid of people. One day, her grandson saw an advertisement on television:
    ''We are looking for flamenco stars.'''
