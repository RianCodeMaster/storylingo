  - concept: want
    description: Open both arms wide in front of you and pull the air into your chest with a greedy face, like you are grabbing
      exactly what you want.
    emoji: 🤲
  - concept: afraid
    description: Hug yourself tightly, shake like jelly and open your eyes very wide with a scared face.
    emoji: 😨
  - concept: finally
    description: Throw both arms up in the air, look up at the sky and shout '¡por fin!' like you just won the lottery.
    emoji: 🎉
