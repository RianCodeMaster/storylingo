- key: s2
  source: 3f1d788b7bb2289d
  translation: 'كانت كارمن تريد الذهاب إلى برنامج تلفزيوني وتريد أن ترقص أمام الجميع. لكنها كانت خائفة: كانت تخاف من ألف شيء!
    في المطبخ كانت ترقص مع ألف موزة ومع قطها الضخم. قالت كارمن: «أريد أن أرقص في التلفزيون»، وبكت قليلًا.'
