- key: s4
  source: 0e9de9ed2c2f1aa7
  translation: 'أخيرًا جاء اليوم: كانت كارمن على مسرح التلفزيون، مع ألف ضوء وألف شخص. كانت كارمن خائفة، خوفًا شديدًا! لكن
    قطها الضخم كان معها، وكانت كارمن تريد أن ترقص. كانت تريد أن ترقص حقًّا. قالت كارمن: «أخيرًا!»، ورقصت بحذائها الصغير من
