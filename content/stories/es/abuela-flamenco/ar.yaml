- key: s3
  source: 7f5f8c076f2f13b5
  translation: 'اتصل حفيدها بالتلفزيون: «جدتي تريد أن ترقص». قال رجل التلفزيون: «حسنًا! غدًا، أخيرًا، سترقص جدتك في التلفزيون».
    لكن كانت هناك مشكلة: حذاء كارمن كان من عام 1960 وكان صغيرًا جدًا. كانت كارمن خائفة، وقطها الضخم كان يلعق حذاءها الصغير.'
