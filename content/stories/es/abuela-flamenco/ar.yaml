- key: s5
  source: 9295b364e387ea4a
  translation: 'رقصت كارمن في التلفزيون وصرخ الجمهور: «أولي!». أخيرًا، أصبحت الجدة كارمن نجمة فلامنكو. لكن كانت هناك مفاجأة:
    النجمة الحقيقية كانت قطها الضخم، الذي كان لديه عقد بقيمة 1000 يورو. وعندها كانت كارمن خائفة... من قطها الشهير!'
