summary: كارمن، جدة تبلغ 92 عامًا من إشبيلية، تريد أن تصبح نجمة فلامنكو لكنها تخاف من المسرح، حتى يساعدها قطها الضخم على الرقص
  على التلفاز بحذائها الصغير من 1960.
summary_source: bb2215589c84c4d6
gestures:
  want: افتح ذراعيك على اتساعهما أمامك واسحب الهواء إلى صدرك بوجه طامع، كأنك تلتقط ما تريده بالضبط.
  afraid: احتضن نفسك بقوة وارتجف كالجلّي وافتح عينيك جدًا بوجه خائف.
  finally: ارفع ذراعيك في الهواء وانظر إلى السماء واصرخ «أخيرًا!» كأنك ربحت اليانصيب.
targets:
  quería:
    gloss: كانت تريد
    note: الماضي الناقص «quería» يعني «كانت تريد».
  tenía miedo:
    gloss: كانت خائفة
    note: الإسبانية تقول حرفيًا «تملك خوفًا»؛ العربية تقول «خافت/كانت خائفة».
  por fin:
    gloss: أخيرًا
    note: تركيب من كلمتين يعني «في النهاية/أخيرًا».
scenes:
- key: s1
  source: fe2159a4bd996955
  translation: 'كانت كارمن في الثانية والتسعين من عمرها، وتعيش في إشبيلية مع قطها، قط ضخم برتقالي اللون. كانت كارمن تريد أن
    تصبح نجمة فلامنكو. لكنها كانت تخاف من المسرح وتخاف من الناس. وفي يوم من الأيام، رأى حفيدها إعلانًا في التلفزيون: «نبحث
    عن نجوم فلامنكو».'
