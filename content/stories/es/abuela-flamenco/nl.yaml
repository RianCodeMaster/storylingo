# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Carmen, een 92-jarige oma uit Sevilla, wil een flamencoster worden maar is bang voor het podium, tot haar enorme
  kat haar op tv laat dansen in haar kleine schoenen uit 1960.
summary_source: bb2215589c84c4d6
gestures:
  want: Open je armen wijd voor je en trek de lucht met een hebberig gezicht naar je borst, alsof je precies pakt wat je wilt.
  afraid: Sla je armen stevig om jezelf, bibber als pudding en zet je ogen heel wijd op met een bang gezicht.
  finally: Gooi je armen in de lucht, kijk naar boven en roep '¡por fin!' alsof je net de loterij hebt gewonnen.
targets:
  quería:
    gloss: wilde
    note: Onvoltooid verleden tijd, net als Nederlands 'wilde'.
  tenía miedo:
    gloss: was bang
    note: Letterlijk 'had angst'; Nederlands zegt 'was bang'.
  por fin:
    gloss: eindelijk
    note: Vaste uitdrukking; in het Nederlands één woord.
scenes:
- key: s1
  source: fe2159a4bd996955
  translation: 'Carmen was 92 en woonde in Sevilla met haar kat, een enorme oranje kat. Carmen wilde een flamencoster worden.
    Maar ze was bang voor het podium en bang voor mensen. Op een dag zag haar kleinzoon een advertentie op televisie: ''We
    zoeken flamencosterren''.'
