# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: An enormous octopus in Valencia wants to cook the world's biggest paella, but with eight arms everything flies away,
  so he sells flying rice instead.
summary_source: 688bae9af18186d1
gestures:
  want: Hug a giant invisible paella, rub your tummy, and stretch both arms out toward it with a hungry smile.
  cannot: Wave all your fingers like eight octopus arms, then cross both arms in a big X and shake your head no.
  like: Pat your heart with both hands, make a big happy smile, and wiggle like a happy octopus.
targets:
  quiere:
    gloss: wants
    note: Spanish verb endings show who; 'quiere' can mean 'he wants' or 'she wants'.
  no puede:
    gloss: cannot
    note: Spanish puts 'no' before the verb, as in 'no puede' = 'cannot'.
  le gusta:
    gloss: likes it
    note: Literally 'it is pleasing to him/her'; English uses 'likes' the other way round.
