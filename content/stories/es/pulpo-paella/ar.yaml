summary: أخطبوط ضخم في بلنسية يريد أن يطهو أكبر بايلا في العالم، لكنه بأذرعه الثماني يجعل كل شيء يطير، فيبيع أرزًا طائرًا.
summary_source: 688bae9af18186d1
gestures:
  want: احتضن بايلا خيالية كبيرة، افرك بطنك، ومدّ ذراعيك نحوها بابتسامة جائعة.
  cannot: حرّك أصابعك كأنها ثمانية أذرع أخطبوط، ثم اعقد ذراعيك على شكل إكس وحرّك رأسك بالنفي.
  like: ربّت على قلبك بيديك، ابتسم ابتسامة كبيرة، وتمايل مثل أخطبوط سعيد.
targets:
  quiere:
    gloss: يريد
    note: في الإسبانية «quiere» للغائب، وفي العربية «يريد» تتغير حسب الشخص.
  no puede:
    gloss: لا يستطيع
    note: النفي «no» قبل الفعل، مثل «لا» قبل الفعل في العربية.
  le gusta:
    gloss: يحب / تعجبه
    note: التركيب «le gusta» يوافق الشيء المعجب به، مثل «يعجبه» في العربية.
