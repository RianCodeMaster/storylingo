# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Een enorme octopus in Valencia wil de grootste paella ter wereld koken, maar met acht armen vliegt alles weg, dus
  verkoopt hij vliegende rijst.
summary_source: 688bae9af18186d1
gestures:
  want: Omhels een denkbeeldige reuzenpaella, wrijf over je buik en strek je armen hongerig uit.
  cannot: Beweeg al je vingers als acht octopusarmen, kruis dan je armen in een grote X en schud nee.
  like: Klop met beide handen op je hart, lach breed en wiebel als een blije octopus.
targets:
  quiere:
    gloss: wil
    note: Spaans gebruikt 'quiere' voor hij/zij; Nederlands zegt 'hij/zij wil'.
  no puede:
    gloss: kan niet
    note: In het Spaans staat 'no' vóór het werkwoord; in het Nederlands zeg je 'kan niet'.
  le gusta:
    gloss: houdt van
    note: Letterlijk 'het bevalt hem/haar'; Nederlands zegt 'hij/zij houdt van'.
