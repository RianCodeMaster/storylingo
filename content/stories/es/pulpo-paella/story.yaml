story:
  title: Paco y la paella voladora
  summary: An enormous octopus in Valencia wants to cook the world's biggest paella, but with eight arms everything flies
    away, so he sells flying rice instead.
  gestures:
  - concept: want
    description: Hug a giant invisible paella, rub your tummy, and stretch both arms out toward it with a hungry smile.
    emoji: 🤤
  - concept: cannot
    description: Wave all your fingers like eight octopus arms, then cross both arms in a big X and shake your head no.
    emoji: 🙅
  - concept: like
    description: Pat your heart with both hands, make a big happy smile, and wiggle like a happy octopus.
    emoji: 🥰
