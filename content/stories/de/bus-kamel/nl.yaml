# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Lena wacht 1000 minuten op de bus, maar een snelle kameel genaamd Klaus neemt haar mee — en uiteindelijk is hij bus
  nummer 7.
summary_source: 957ec73d576e3bec
gestures:
  wait: Sta stokstijf als een standbeeld bij de bushalte, tik snel met je voet en staar naar een reusachtig onzichtbaar horloge
    op je arm, met luide zuchten.
  come: Stamp met reuzestappen in slow motion naar de klas, zwaai met beide armen in grote cirkels en roep 'Hallo!'
  take_along: Stop een denkbeeldig klein vriendje onder je arm als een rugzak en marcheer weg met je vrije arm trots zwaaiend.
targets:
  wartet:
    gloss: wacht
    note: 'Duits: wartet (hij/zij), Nederlands: wacht.'
  kommt:
    gloss: komt
    note: 'Duits: kommt (hij/zij), Nederlands: komt.'
  mitnehmen:
    gloss: meenemen
    note: 'Scheidbaar: ''nimmt ... mit'', net als Nederlands ''neemt ... mee''.'
scenes:
- key: s1
  source: 05f5abccaf5d5800
  translation: Lena wacht bij de bushalte. Ze wacht op de bus. De bus komt niet. Lena wacht 1000 minuten.
  glosses:
    wartet: wacht
    an: bij
    Haltestelle: bushalte
    Sie: ze
    auf: op
    Bus: bus
