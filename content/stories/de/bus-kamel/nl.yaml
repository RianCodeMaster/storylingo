- key: s5
  source: e69dec7e684b7674
  translation: 'Klaus neemt Lena mee naar school. De school komt in zicht, en de bus komt eindelijk ook! De bus wacht bij
    de bushalte, maar Lena wil met Klaus meerijden. Klaus lacht: ''Ik ben bus nummer 7.'''
