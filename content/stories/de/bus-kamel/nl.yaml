- key: s3
  source: 636fa5c48c3a925e
  translation: 'Klaus wil Lena meenemen. Klaus zegt: ''Ik wil jou meenemen.'' Lena vraagt: ''Kun je mij meenemen?'' Klaus
    zegt: ''Ja! Ik neem je mee!'''
