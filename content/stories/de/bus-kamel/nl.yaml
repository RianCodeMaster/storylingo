- key: s2
  source: 5fcbd75fea9a1c81
  translation: 'Daar komt een kameel naar de bushalte. De kameel heet Klaus. Klaus komt heel snel. Lena zegt: ''Er komt een
    kameel!'''
  glosses:
    Da: daar
