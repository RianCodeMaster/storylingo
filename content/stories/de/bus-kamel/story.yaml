story:
  title: Lena und das Kamel an der Haltestelle
  summary: Lena waits 1000 minutes for the bus, but a fast camel named Klaus takes her along — and in the end he is bus number
    7.
  gestures:
  - concept: wait
    description: Stand stiff like a statue at a bus stop, tap your foot fast and stare at a giant invisible watch on your
      arm, sighing loudly.
    emoji: ⏰
  - concept: come
    description: Stomp toward the class in slow-motion giant steps while waving both arms in big circles and shouting 'Hallo!'
    emoji: 🚶
  - concept: take_along
    description: Tuck an imaginary tiny friend under your arm like a backpack and march off swinging your free arm proudly.
    emoji: 🎒
