# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Lena waits 1000 minutes for the bus, but a fast camel named Klaus takes her along — and in the end he is bus number
  7.
summary_source: 957ec73d576e3bec
gestures:
  wait: Stand stiff like a statue at a bus stop, tap your foot fast and stare at a giant invisible watch on your arm, sighing
    loudly.
  come: Stomp toward the class in slow-motion giant steps while waving both arms in big circles and shouting 'Hallo!'
  take_along: Tuck an imaginary tiny friend under your arm like a backpack and march off swinging your free arm proudly.
targets:
  wartet:
    gloss: waits
    note: German adds -et for er/sie/es; English adds -s.
  kommt:
    gloss: comes
    note: German adds -t for er/sie/es; English adds -s.
  mitnehmen:
    gloss: take along
    note: 'Separable verb: ''mit'' goes to the end, as in Klaus nimmt Lena mit.'
