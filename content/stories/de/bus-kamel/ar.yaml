- key: s5
  source: e69dec7e684b7674
  translation: 'كلاوس يأخذ لينا معه إلى المدرسة. المدرسة تظهر، والحافلة تأتي أخيرًا أيضًا! الحافلة تنتظر عند المحطة، لكن لينا
    تريد أن تركب مع كلاوس. يضحك كلاوس: «أنا الحافلة رقم 7».'
