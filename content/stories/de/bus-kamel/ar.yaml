- key: s3
  source: 636fa5c48c3a925e
  translation: 'كلاوس يريد أن يأخذ لينا معه. يقول كلاوس: «أريد أن آخذك معي». تسأل لينا: «هل تستطيع أن تأخذني معك؟» يقول كلاوس:
    «نعم! سآخذك معي!»'
