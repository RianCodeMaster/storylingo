- key: s2
  source: 5fcbd75fea9a1c81
  translation: 'وهناك يأتي جمل إلى المحطة. الجمل اسمه كلاوس. كلاوس يأتي بسرعة كبيرة. تقول لينا: «جمل يأتي!»'
  glosses:
    Da: هناك
    kommt: يأتي
    Kamel: جمل
