summary: تنتظر لينا الحافلة 1000 دقيقة، لكن جملًا سريعًا اسمه كلاوس يأخذها معه — وفي النهاية هو الحافلة رقم 7.
summary_source: 957ec73d576e3bec
gestures:
  wait: قف متصلبًا كتمثال عند موقف الحافلات، ودقّ بقدمك بسرعة وحدّق في ساعة خيالية كبيرة على ذراعك مع تنهيدات عالية.
  come: 'اخطُ نحو الصف بخطوات عملاقة بطيئة جدًا، ولوّح بذراعيك بدائرتين كبيرتين واصرخ: «هالو!»'
  take_along: ضع صديقًا خياليًا صغيرًا تحت إبطك مثل حقيبة ظهر، ثم سِر مبتعدًا وأنت تلوّح بذراعك الأخرى بفخر.
targets:
  wartet:
    gloss: تنتظر
    note: مثل العربية، الفعل يتغيّر حسب الفاعل؛ هنا الفاعل مؤنث.
  kommt:
    gloss: يأتي/تأتي
    note: في العربية «هو يأتي» و«هي تأتي»، والألمانية أيضًا تغيّر النهاية.
  mitnehmen:
    gloss: يأخذ معه
    note: 'فعل منفصل: nimmt ... mit؛ في العربية يبقى الفعل متصلًا.'
scenes:
