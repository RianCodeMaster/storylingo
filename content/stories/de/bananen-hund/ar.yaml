- key: s5
  source: b4e46f32efdf17c4
  translation: 'في المساء، لم يعد برونو يأكل الموز. يأكل حذاء تيم. يقول تيم: «أوه لا!» يذهب تيم إلى السوبرماركت مرة أخرى.
    لا يشتري موزًا. يشتري أحذية.'
