summary: تيم يذهب إلى السوبرماركت ويشتري مئة موزة لأن كلبه برونو يأكل الموز فقط — حتى يأكل برونو شيئًا آخر.
summary_source: 5600299c9838f9af
gestures:
  go: امشِ في مكانك بخطوات قوية وحرّك ذراعًا إلى الأمام كأنك تسير نحو السوبرماركت.
  buy: احمل سلة تسوق خيالية بيد وارمِ موزًا خياليًا في السلة باليد الأخرى مع قول «تشينغ!».
  eat: افتح فمك مثل وحش جائع وقلّد تقشير موزة عملاقة وأكلها بأصوات مضغ عالية.
targets:
  geht:
    gloss: يذهب
    note: الفعل الألماني يتصرّف مع الضمير، بخلاف العربية التي يعتمد فيها الفاعل على الضمير أو السياق.
  kauft:
    gloss: يشتري
    note: في الألمانية نضيف -t للفاعل هو/هي، أما العربية فتتحدد فيها صيغة الفعل بالضمير أو السياق.
  isst:
    gloss: يأكل
    note: في الألمانية يتغير الفعل مع الفاعل، أما العربية فتعتمد أكثر على الضمائر.
