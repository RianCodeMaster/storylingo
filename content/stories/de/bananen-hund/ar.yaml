- key: s3
  source: f10eb00ccd0041d0
  translation: 'امرأة ترى تيم. تقول: «مئة موزة؟!» يقول تيم: «نعم! كلبي يأكل الموز فقط.» تضحك المرأة بصوت عالٍ جدًا.'
