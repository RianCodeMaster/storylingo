# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Tim gaat naar de supermarkt en koopt honderd bananen omdat zijn hond Bruno alleen bananen eet — tot Bruno iets anders
  eet.
summary_source: 5600299c9838f9af
gestures:
  go: Stamp met grote stappen op je plaats en zwaai één arm naar voren als een soldaat die naar de supermarkt loopt.
  buy: Houd een onzichtbaar winkelmandje in één hand en gooi met de andere onzichtbare bananen over je schouder erin, terwijl
    je 'cha-ching!' zegt.
  eat: Doe je mond open als een hongerig monster en beeld uit dat je een reusachtige banaan pelt en met luid smakgeluid opeet.
targets:
  geht:
    gloss: gaat
    note: Duits 'geht' lijkt op Nederlands 'gaat'; beide betekenen 'gaat'.
  kauft:
    gloss: koopt
    note: Duits 'kauft' lijkt op Nederlands 'koopt', maar let op de andere klinker.
  isst:
    gloss: eet
    note: Duits 'isst' betekent 'eet'; het lijkt minder op het Nederlandse woord.
