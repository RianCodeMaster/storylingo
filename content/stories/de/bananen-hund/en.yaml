# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Tim goes to the supermarket and buys one hundred bananas because his dog Bruno only eats bananas — until Bruno eats
  something else.
summary_source: 5600299c9838f9af
gestures:
  go: March in place with big stomping steps and swing one arm forward like a soldier walking to the supermarket.
  buy: Hold an invisible shopping basket with one hand and throw invisible bananas over your shoulder into it with the other,
    saying 'cha-ching!'
  eat: Open your mouth like a hungry monster and mime peeling and munching a giant banana with loud chomping sounds.
targets:
  geht:
    gloss: goes
    note: 'German adds -t for he/she/it; English adds -s: er geht = he goes.'
  kauft:
    gloss: buys
    note: 'German uses -t for er/sie/es; English uses -s: er kauft = he buys.'
  isst:
    gloss: eats
    note: German 'isst' is the he/she/it form; English 'eats' also takes -s.
