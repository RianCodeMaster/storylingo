# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Hugo the hamster wants to get rich on the stock market, but he cannot read the numbers, is afraid of people, and
  accidentally eats 1,000 bananas.
summary_source: 286a2ab4b9de8823
gestures:
  want: Stretch both arms forward with big grabbing hands and a hungry face, as if you really want to grab something.
  cannot: 'Wave both hands quickly in front of your face and shake your head wildly, as if saying: no, no, I can''t!'
  afraid: Hug yourself, tremble a little, and open your eyes very wide.
targets:
  wollte:
    gloss: wanted
    note: German 'wollte' is the simple past of 'wollen'; English uses 'wanted'.
  konnte nicht:
    gloss: could not
    note: German puts 'nicht' after the modal verb, like English 'could not'.
  hatte Angst:
    gloss: was afraid
    note: German says 'had fear' with 'haben'; English says 'was afraid'.
