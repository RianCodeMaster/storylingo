summary: Hamster Hugo wil rijk worden op de beurs, maar hij kan de cijfers niet lezen, hij is bang voor de mensen en hij eet
  per ongeluk 1000 bananen op.
summary_source: 286a2ab4b9de8823
gestures:
  want: Strek beide armen ver voor je uit met grote grijphanden en een hongerig gezicht, alsof je iets heel graag wilt pakken.
  cannot: 'Zwaai met beide handen vlak voor je gezicht heen en weer en schud wild je hoofd, alsof je zegt: nee, nee, dat lukt
    niet!'
  afraid: Sla je armen om jezelf heen, ga een beetje bibberen en zet je ogen heel wijd open.
