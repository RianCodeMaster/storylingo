summary: أراد هوغو الهامستر أن يصبح غنيًا في البورصة، لكنه لم يستطع قراءة الأرقام، وكان يخاف من الناس، وأكل بالخطأ 1000 موزة.
summary_source: 286a2ab4b9de8823
gestures:
  want: مدّ ذراعيك أمامك مع يديْن مفتوحتين وكأنك تريد الإمساك بشيء، وأظهر وجهًا متشوقًا.
  cannot: 'حرّك يديْك أمام وجهك يمينًا ويسارًا وهزّ رأسك بقوة وكأنك تقول: لا، لا، هذا غير ممكن!'
  afraid: طوّق نفسك بذراعيك، وارتجف قليلًا، وافتح عينيك على اتساعهما.
targets:
  wollte:
    gloss: أراد
    note: في الألمانية هو ماضٍ من wollen؛ في العربية نستعمل ماضي «أراد».
  konnte nicht:
    gloss: لم يستطع
    note: الألمانية تضع nicht مع الفعل المساعد؛ العربية تنفي الفعل الماضي بـ«لم».
  hatte Angst:
    gloss: كان خائفًا
    note: الألمانية تقول حرفيًا «كان لديه خوف»؛ العربية تستعمل «كان خائفًا».
