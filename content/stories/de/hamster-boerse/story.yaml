story:
  title: Hamster Hugo geht zur Börse
  summary: Hamster Hugo wil rijk worden op de beurs, maar hij kan de cijfers niet lezen, hij is bang voor de mensen en hij
    eet per ongeluk 1000 bananen op.
  gestures:
  - concept: want
    description: Strek beide armen ver voor je uit met grote grijphanden en een hongerig gezicht, alsof je iets heel graag
      wilt pakken.
    emoji: 🤲
  - concept: cannot
    description: 'Zwaai met beide handen vlak voor je gezicht heen en weer en schud wild je hoofd, alsof je zegt: nee, nee,
      dat lukt niet!'
    emoji: 🙅
  - concept: afraid
    description: Sla je armen om jezelf heen, ga een beetje bibberen en zet je ogen heel wijd open.
    emoji: 😨
  scenes:
  - key: s1
