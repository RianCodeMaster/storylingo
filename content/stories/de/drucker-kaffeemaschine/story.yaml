      prompt: Was will Herr Stirn?
      options: [den Drucker ersetzen, die Kaffeemaschine kaufen]
      answer: den Drucker ersetzen
    - key: s3q3
      kind: who_what
      prompt: Warum will Herr Stirn den Drucker ersetzen?
      options: [weil er völlig verrückt ist, weil er zu langsam ist, weil er zu alt ist]
