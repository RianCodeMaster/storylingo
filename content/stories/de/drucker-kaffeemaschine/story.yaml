  - key: s5
    text: 'Plötzlich wird Kiki sehr heiß und spuckt Kaffee auf Herrn Stirn, weil er Klaus wehtut. Der Chef kommt und ruft:
      „Klaus bleibt für immer, damit das Büro nie langweilig wird!“ Trotzdem ist die Geschichte noch nicht zu Ende: Kiki sieht
      den neuen Drucker Kevin und schreibt mit Kaffeeschaum: „Du bist auch süß.“ Klaus ist nur fünf Minuten traurig und druckt
      dann einen Liebesbrief für den Toaster.'
    image_prompt: The red coffee machine with long eyelashes sprays a fountain of brown coffee over the tall system administrator
      with round glasses, who waves his arms; the small white printer Klaus with two round googly eyes and a red heart sticker
