  - key: s3
    text: 'Herr Stirn ist der Systemadministrator. Er sagt: „Ich will diesen Drucker ersetzen, weil er völlig verrückt ist.“
      Er bestellt einen neuen Drucker, damit Klaus endlich verschwindet. Trotzdem druckt Klaus jeden Tag weiter.'
    image_prompt: A tall thin system administrator with round glasses, a grey shirt and a clipboard stands in front of the
      small white printer Klaus, who has two round googly eyes and a red heart sticker on his front panel; a laptop shows
      an order form for a new printer, and the red coffee machine with long eyelashes watches from the side.
    questions:
    - key: s3q1
      kind: who_what
      prompt: Wer ist Herr Stirn?
      options: [der Systemadministrator, der Chef, ein Kollege]
      answer: der Systemadministrator
    - key: s3q2
