story:
  title: Klaus, der Drucker mit dem großen Herzen
  summary: Printer Klaus wordt smoorverliefd op koffiemachine Kiki, print duizend liefdesbrieven, en de systeembeheerder wil
    hem vervangen — maar Kiki blijkt heel andere plannen te hebben.
  gestures:
  - concept: because
    description: 'Doe je hand als een trechter bij je mond en knik langzaam achterover met je hoofd, alsof je zegt: ''omdat...
      ja, dáárom!'''
    emoji: 🤔
  - concept: so_that
    description: Houd je handen als een kommetje en schuif ze met wijde ogen naar voren, alsof je het doel aan iemand cadeau
      doet.
    emoji: 🎯
  - concept: nevertheless
    description: Zet je handen in je zij, stamp één keer hard op de vloer en steek je kin omhoog als een eigenwijze peuter.
    emoji: 😤
  scenes:
  - key: s1
    text: Klaus ist ein Drucker. Er arbeitet in einem großen IT-Büro in Berlin und liebt die Kaffeemaschine Kiki, weil sie
      so warm und schön ist. Er kann nicht sprechen, weil er nur ein Drucker ist. Deshalb druckt er jeden Morgen einen Liebesbrief,
      damit Kiki ihn lesen kann.
    image_prompt: Klaus, a small white office printer with two round googly eyes and a red heart sticker on his front panel,
      sits on a desk in a bright Berlin IT office and prints a page covered in little hearts; next to him stands a shiny red
      coffee machine with long eyelashes, smiling.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Liebt Klaus die Kaffeemaschine Kiki?
      options: [Ja, Nein]
      answer: Ja
    - key: s1q2
      kind: either_or
      prompt: 'Was ist Klaus: eine Kaffeemaschine oder ein Drucker?'
      options: [eine Kaffeemaschine, ein Drucker]
      answer: ein Drucker
    - key: s1q3
      kind: who_what
      prompt: Warum kann Klaus nicht sprechen?
      options: [weil er nur ein Drucker ist, weil er schüchtern ist, weil er krank ist]
      answer: weil er nur ein Drucker ist
      target: weil
    - key: s1q4
      kind: who_what
      prompt: Warum druckt Klaus jeden Morgen einen Liebesbrief?
      options: [damit Kiki ihn lesen kann, damit er Hunger hat, damit er müde wird]
