  translation: يطبع كلاوس 1000 صفحة من رسائل الحب لكي تستطيع كيكي قراءة كل كلمة. الزملاء غاضبون لأن المكتب كله أصبح أبيض الآن.
    ومع ذلك يواصل كلاوس الطباعة. يطبع قلبًا كبيرًا مثل طاولة.
