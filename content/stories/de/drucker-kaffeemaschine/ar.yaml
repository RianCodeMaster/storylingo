# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). scenes follow story.yaml in order.
summary: تقع الطابعة كلاوس في حب آلة القهوة كيكي، فتطبع ألف رسالة حب، ويريد مدير النظام استبدالها، لكن لكيكي خططًا أخرى.
summary_source: 9f31d5b98ae940fe
gestures:
  because: 'ضع يدك كقمع عند فمك وأمِل رأسك ببطء إلى الخلف كأنك تقول: لأن... لهذا السبب!'
  so_that: اجعل يديك كوعاء وادفعهما إلى الأمام بعينين واسعتين كأنك تقدم الهدف لشخص.
  nevertheless: ضع يديك على خصرك، واضرب الأرض بقدمك مرة بقوة، وارفع ذقنك كطفل عنيد.
targets:
  weil:
    gloss: لأن
    note: في الألمانية بعد weil يأتي الفعل في آخر الجملة الثانوية، بخلاف العربية.
  damit:
    gloss: لكي
    note: بعد damit يأتي الفعل غالبًا في آخر الجملة، وتشبه لكي في العربية.
  trotzdem:
    gloss: رغم ذلك
    note: trotzdem تبدأ الجملة عادة ويأتي الفعل بعدها مباشرة، بخلاف رغم أن.
scenes:
- key: s1
  source: f73280f46e7a70e8
  translation: كلاوس طابعة. يعمل في مكتب تقنية معلومات كبير في برلين ويحب آلة القهوة كيكي لأنها دافئة وجميلة جدًا. لا يستطيع
    الكلام لأنه طابعة فقط. لذلك يطبع كل صباح رسالة حب لكي تقرأها كيكي.
