- key: s5
  source: b8ee5a468ba0fbfc
  translation: 'فجأة تصبح كيكي ساخنة جدًا وتبصق قهوة على السيد شتيرن لأنه يؤذي كلاوس. يأتي الرئيس ويصرخ: يبقى كلاوس إلى الأبد
    لكي لا يشعر المكتب بالملل أبدًا! ومع ذلك، القصة لم تنتهِ بعد: ترى كيكي الطابعة الجديدة كيفن وتكتب برغوة القهوة: أنت لطيف
    أيضًا. كلاوس حزين خمس دقائق فقط ثم يطبع رسالة حب للمحمصة.'
