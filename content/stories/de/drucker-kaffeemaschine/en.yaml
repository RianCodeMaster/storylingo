  translation: 'Suddenly Kiki gets very hot and spits coffee on Mr. Stirn because he is hurting Klaus. The boss comes and
    shouts, ''Klaus stays forever so that the office never gets boring!'' Nevertheless, the story is not over yet: Kiki sees
    the new printer Kevin and writes with coffee foam, ''You''re sweet too.'' Klaus is sad for only five minutes and then
    prints a love letter for the toaster.'
