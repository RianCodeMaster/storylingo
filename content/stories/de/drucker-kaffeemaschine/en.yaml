  translation: 'On Monday the new printer Kevin arrives. Klaus is very afraid because he does not want to lose Kiki. He prints
    1,000 pages in a minute so that everyone can see: he is the best printer in the world. Nevertheless, Mr. Stirn pulls out
    the plug.'
