# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). scenes follow story.yaml in order.
summary: Printer Klaus falls hopelessly in love with coffee machine Kiki, prints a thousand love letters, and the system administrator
  wants to replace him — but Kiki has very different plans.
summary_source: 9f31d5b98ae940fe
gestures:
  because: Make a funnel with your hand at your mouth and slowly nod your head back as if saying, 'because... yes, that's
    why!'
  so_that: Cup your hands and push them forward with wide eyes, as if handing the goal to someone.
  nevertheless: Put your hands on your hips, stamp once hard on the floor, and lift your chin like a stubborn toddler.
targets:
  weil:
    gloss: because
    note: 'Subordinating conjunction: the verb goes to the end, unlike in English.'
  damit:
    gloss: so that
    note: 'Subordinating conjunction: the verb goes to the end.'
  trotzdem:
    gloss: nevertheless
    note: 'Adverb: it starts the clause and the verb comes second.'
