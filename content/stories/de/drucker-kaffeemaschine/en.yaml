- key: s1
  source: f73280f46e7a70e8
  translation: Klaus is a printer. He works in a big IT office in Berlin and loves the coffee machine Kiki because she is
    so warm and beautiful. He cannot speak because he is only a printer. So every morning he prints a love letter so that
    Kiki can read it.
