scenes:
- key: s1
  source: f73280f46e7a70e8
  translation: Klaus is een printer. Hij werkt in een groot IT-kantoor in Berlijn en is verliefd op koffiemachine Kiki, omdat
    ze zo warm en mooi is. Hij kan niet praten, omdat hij maar een printer is. Daarom print hij elke ochtend een liefdesbrief,
    zodat Kiki hem kan lezen.
