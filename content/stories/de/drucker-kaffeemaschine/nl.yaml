- key: s5
  source: b8ee5a468ba0fbfc
  translation: 'Plots wordt Kiki heel heet en spuugt koffie over meneer Stirn, omdat hij Klaus pijn doet. De baas komt en
    roept: ''Klaus blijft voor altijd, zodat het kantoor nooit saai wordt!'' Toch is het verhaal nog niet voorbij: Kiki ziet
    de nieuwe printer Kevin en schrijft met koffieschuim: ''Jij bent ook schattig.'' Klaus is maar vijf minuten verdrietig
    en print dan een liefdesbrief voor de broodrooster.'
