# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). scenes follow story.yaml in order.
summary: Printer Klaus wordt smoorverliefd op koffiemachine Kiki, print duizend liefdesbrieven, en de systeembeheerder wil
  hem vervangen — maar Kiki blijkt heel andere plannen te hebben.
summary_source: 9f31d5b98ae940fe
gestures:
  because: 'Doe je hand als een trechter bij je mond en knik langzaam achterover met je hoofd, alsof je zegt: ''omdat... ja,
    dáárom!'''
  so_that: Houd je handen als een kommetje en schuif ze met wijde ogen naar voren, alsof je het doel aan iemand cadeau doet.
  nevertheless: Zet je handen in je zij, stamp één keer hard op de vloer en steek je kin omhoog als een eigenwijze peuter.
