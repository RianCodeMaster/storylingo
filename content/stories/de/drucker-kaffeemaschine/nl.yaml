- key: s4
  source: 1c2df21ca1327807
  translation: 'Op maandag komt de nieuwe printer Kevin. Klaus heeft grote angst, omdat hij Kiki niet wil verliezen. Hij print
    1000 pagina''s in één minuut, zodat iedereen ziet: hij is de beste printer van de wereld. Toch trekt meneer Stirn de stekker
