  - key: s5
    text: Als der Bauer Mathilde im Misthaufen sah, lachte er laut. Nachdem er ihr eine alte Badewanne gezeigt hatte, baute
      er mit ihr eine neue Rakete. Am Abend flogen sie zusammen zum Mond — aber nur im Traum. Mathilde freute sich auf den
      nächsten Morgen.
