  - key: s4
    text: Als Mathilde den roten Knopf drückte, passierte nichts. Nachdem sie dreimal laut „Muh!“ gerufen hatte, machte die
      Rakete nur ein kleines „Puff“. Die Rakete flog zwei Meter hoch und landete im Misthaufen. Mathilde war sehr wütend.
    image_prompt: The same small brown-and-white cow with red collar and brass bell, sitting furious and covered in straw
      in a big manure pile, a milk-can rocket tipped over next to her with a tiny puff of smoke, farmyard at night.
    questions:
    - key: s4q1
      kind: yes_no
      prompt: Passierte etwas, als Mathilde den Knopf drückte?
      options: [Nein, Ja]
      answer: Nein
      target: als
    - key: s4q2
