story:
  title: Mathilde will Astronautin werden
  summary: Een Beierse koe bouwt een raket van melkbussen om astronaut te worden, maar het loopt anders dan ze denkt.
  gestures:
  - concept: when_past
    description: 'Doe alsof je met je vinger op een grote denkbeeldige klok tikt die precies één keer ''TIKS'' zegt, en houd
      je hand daarna stil in de lucht: het gebeurde maar één keer.'
    emoji: ⏱️
  - concept: after
    description: 'Wijs met je duim over je schouder naar achteren en klap dan hard één keer in je handen: eerst dat, en dan
      pas dat.'
    emoji: ➡️
  - concept: look_forward
    description: Wrijf in je handen, kijk met een grote glimlach naar de hemel en spring één keer op van plezier.
    emoji: 🤩
  scenes:
  - key: s1
    text: 'Mathilde war eine kleine Kuh aus Bayern. Sie stand jeden Tag auf einer großen Wiese und aß Gras. Als sie eines
      Abends den Mond sah, sagte sie: „Ich will Astronautin werden!“ Ihre Freunde lachten laut.'
    image_prompt: A small brown-and-white cow with a red collar and a brass bell, big dreamy eyes, standing on a green Bavarian
      meadow at dusk, looking up at a huge full moon, other cows laughing in the background.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: War Mathilde eine Kuh aus Bayern?
      options: [Ja, Nein]
      answer: Ja
    - key: s1q2
      kind: who_what
      prompt: 'Wer sagte: „Ich will Astronautin werden!“?'
      options: [Mathilde, Der Bauer, Der Mond]
      answer: Mathilde
    - key: s1q3
      kind: either_or
      prompt: Was wollte Mathilde, als sie den Mond sah?
      options: [Sie wollte Astronautin werden, Sie wollte schlafen]
      answer: Sie wollte Astronautin werden
      target: als
    - key: s1q4
      kind: either_or
      prompt: Waren ihre Freunde traurig oder lachten sie?
      options: [Sie lachten, Sie waren traurig]
      answer: Sie lachten
