  - key: s3
    text: Für den Flug brauchte Mathilde tausend Liter Milch. Als niemand hinsah, trank sie die ganze Milch aus. Nachdem sie
      alles getrunken hatte, war der Tank leer. Aber Mathilde freute sich auf den Flug.
    image_prompt: The same small brown-and-white cow with red collar and brass bell, with a huge round belly, drinking from
      an enormous milk can next to her milk-can rocket, empty cans lying all around, stars in the evening sky.
    questions:
    - key: s3q1
      kind: who_what
      prompt: Wie viel Milch brauchte Mathilde?
      options: [Tausend Liter, Zwei Liter, Hundert Liter]
      answer: Tausend Liter
    - key: s3q2
      kind: yes_no
      prompt: Trank Mathilde die Milch selbst aus?
      options: [Ja, Nein]
      answer: Ja
      target: als
    - key: s3q3
      kind: either_or
      prompt: Was war, nachdem sie alles getrunken hatte?
      options: [Der Tank war leer, Die Rakete war voll]
      answer: Der Tank war leer
      target: nachdem
    - key: s3q4
      kind: either_or
      prompt: Worauf freute sich Mathilde trotzdem?
      options: [auf den Flug, auf das Essen]
      answer: auf den Flug
