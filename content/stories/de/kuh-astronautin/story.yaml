      emotion: amused
  - key: s2
    text: Mathilde sammelte alte Milchkannen auf dem ganzen Bauernhof. Nachdem sie hundert Kannen gesammelt hatte, baute sie
      eine große Rakete. Als die Rakete fertig war, tanzte sie und freute sich auf ihren ersten Flug. Der Bauer war wütend,
      weil seine Milch weg war.
    image_prompt: The same small brown-and-white cow with red collar and brass bell, proudly standing next to a tall wobbly
      rocket built from many shiny milk cans, a farmyard behind her, an angry farmer waving his arms in the distance.
    questions:
    - key: s2q1
      kind: yes_no
      prompt: Sammelte Mathilde alte Milchkannen?
      options: [Ja, Nein]
      answer: Ja
    - key: s2q2
      kind: who_what
      prompt: Wie viele Kannen sammelte Mathilde?
      options: [Hundert, Drei, Tausend]
      answer: Hundert
      target: nachdem
    - key: s2q3
      kind: either_or
      prompt: Was baute sie, nachdem sie die Kannen gesammelt hatte?
      options: [eine Rakete, ein Haus]
      answer: eine Rakete
      target: nachdem
    - key: s2q4
      kind: either_or
      prompt: Worauf freute sich Mathilde?
      options: [auf ihren ersten Flug, auf das Gras]
      answer: auf ihren ersten Flug
      target: freute sich auf
    - key: s2q5
      kind: who_what
      prompt: Wer war wütend?
      options: [Der Bauer, Mathilde, Die Freunde]
