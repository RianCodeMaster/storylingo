- key: s3
  source: 82544482c93bbd97
  translation: كانت ماتيلده تحتاج ألف لتر من الحليب للرحلة. وعندما لم يكن أحد ينظر، شربت كل الحليب. وبعد أن شربت كل شيء، أصبح
    الخزان فارغًا. لكن ماتيلده تطلّعت إلى الرحلة.
