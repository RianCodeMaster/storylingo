- key: s4
  source: 087ce01be0232af8
  translation: عندما ضغطت ماتيلده الزر الأحمر، لم يحدث شيء. وبعد أن صاحت «موه!» بصوت عالٍ ثلاث مرات، أطلق الصاروخ مجرد «بوف»
    صغير. طار الصاروخ مترين عاليًا وهبط في كومة السماد. وكانت ماتيلده غاضبة جدًا.
