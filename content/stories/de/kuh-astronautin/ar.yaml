summary: بقرة بافارية صغيرة تبني صاروخًا من عبوات الحليب كي تصبح رائدة فضاء، لكن الأمور لا تسير كما تتوقع.
summary_source: 66198ad9b438b4b5
gestures:
  when_past: 'تظاهر بأنك تنقر بإصبعك على ساعة خيالية كبيرة تقول «تِك» مرة واحدة، ثم أبقِ يدك ساكنة في الهواء: لقد حدث ذلك
    مرة واحدة فقط.'
  after: 'أشر بإبهامك خلف كتفك ثم صفّق بقوة مرة واحدة: أولًا هذا، وبعد ذلك فقط ذاك.'
  look_forward: افرك يديك، وانظر إلى السماء بابتسامة عريضة، واقفز مرة واحدة من الفرح.
targets:
  als:
    gloss: عندما (حدث واحد)
    note: تقابل «لما» للحدث الماضي الواحد، لا للعادة.
  nachdem:
    gloss: بعد أن
    note: تأتي مع جملة ثانوية وفعل ماضٍ سبق الحدث الرئيس؛ تقابل «بعد أن».
  freute sich auf:
    gloss: تطلّع إلى
    note: فعل انعكاسي يتطلب «sich» وحرف «auf» مع النصب؛ العربية لا تحتاج ضميرًا انعكاسيًا هنا.
scenes:
- key: s1
  source: 5e79272c4d6269dc
  translation: 'كانت ماتيلده بقرة صغيرة من بافاريا. كانت تقف كل يوم في مرج كبير وتأكل العشب. وعندما رأت القمر ذات مساء، قالت:
    «أريد أن أصبح رائدة فضاء!» فضحك أصدقاؤها بصوت عالٍ.'
