- key: s2
  source: 717db76c2d7f14f3
  translation: جمعت ماتيلده عبوات حليب قديمة من المزرعة كلها. وبعد أن جمعت مئة عبوة، بنت صاروخًا كبيرًا. وعندما أصبح الصاروخ
    جاهزًا، رقصت وتطلّعت إلى رحلتها الأولى. وكان المزارع غاضبًا لأن حليبه قد اختفى.
