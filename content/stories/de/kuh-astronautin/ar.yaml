- key: s5
  source: ec3d0d5ec1b8630f
  translation: عندما رأى المزارع ماتيلده في كومة السماد، ضحك بصوت عالٍ. وبعد أن أراها حوض استحمام قديمًا، بنى معها صاروخًا
    جديدًا. وفي المساء طارا معًا إلى القمر — لكن في الحلم فقط. وتطلّعت ماتيلده إلى الصباح التالي.
