- key: s3
  source: 82544482c93bbd97
  translation: Voor de vlucht had Mathilde duizend liter melk nodig. Toen niemand keek, dronk ze alle melk op. Nadat ze alles
    gedronken had, was de tank leeg. Maar Mathilde verheugde zich op de vlucht.
