- key: s5
  source: ec3d0d5ec1b8630f
  translation: Toen de boer Mathilde in de mesthoop zag, lachte hij hard. Nadat hij haar een oude badkuip had laten zien,
    bouwde hij samen met haar een nieuwe raket. 's Avonds vlogen ze samen naar de maan — maar alleen in een droom. Mathilde
    verheugde zich op de volgende ochtend.
