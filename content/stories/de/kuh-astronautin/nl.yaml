- key: s4
  source: 087ce01be0232af8
  translation: Toen Mathilde op de rode knop drukte, gebeurde er niets. Nadat ze drie keer hard 'Moe!' had geroepen, maakte
    de raket alleen een klein 'Puf'. De raket vloog twee meter hoog en landde in de mesthoop. Mathilde was heel woedend.
