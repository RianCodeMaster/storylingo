summary: Een Beierse koe bouwt een raket van melkbussen om astronaut te worden, maar het loopt anders dan ze denkt.
summary_source: 66198ad9b438b4b5
gestures:
  when_past: 'Doe alsof je met je vinger op een grote denkbeeldige klok tikt die precies één keer ''TIKS'' zegt, en houd je
    hand daarna stil in de lucht: het gebeurde maar één keer.'
  after: 'Wijs met je duim over je schouder naar achteren en klap dan hard één keer in je handen: eerst dat, en dan pas dat.'
  look_forward: Wrijf in je handen, kijk met een grote glimlach naar de hemel en spring één keer op van plezier.
targets:
  als:
    gloss: toen (één keer in het verleden)
    note: null
  nachdem:
    gloss: nadat
    note: null
  freute sich auf:
    gloss: verheugde zich op
    note: null
