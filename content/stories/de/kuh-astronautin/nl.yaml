- key: s2
  source: 717db76c2d7f14f3
  translation: Mathilde verzamelde oude melkbussen op de hele boerderij. Nadat ze honderd bussen had verzameld, bouwde ze
    een grote raket. Toen de raket klaar was, danste ze en verheugde ze zich op haar eerste vlucht. De boer was woedend, omdat
    zijn melk weg was.
