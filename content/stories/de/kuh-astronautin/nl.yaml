- key: s1
  source: 5e79272c4d6269dc
  translation: 'Mathilde was een kleine koe uit Beieren. Ze stond elke dag op een grote weide en at gras. Toen ze op een avond
    de maan zag, zei ze: ''Ik wil astronaut worden!'' Haar vrienden lachten hard.'
