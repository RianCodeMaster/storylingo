  source: ec3d0d5ec1b8630f
  translation: When the farmer saw Mathilde in the manure pile, he laughed loudly. After he had shown her an old bathtub,
    he built a new rocket with her. In the evening they flew together to the moon—but only in a dream. Mathilde looked forward
