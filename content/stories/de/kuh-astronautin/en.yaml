# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). scenes follow story.yaml in order.
summary: A Bavarian cow builds a rocket out of milk cans to become an astronaut, but things turn out differently than she
  expects.
summary_source: 66198ad9b438b4b5
gestures:
  when_past: 'Tap an imaginary clock once with your finger and freeze your hand in the air: it happened just one time.'
  after: 'Point your thumb back over your shoulder, then clap once: first this, then that.'
  look_forward: Rub your hands, smile up at the sky, and jump once with excitement.
targets:
  als:
    gloss: when
    note: Use German 'als' for one past event, like English 'when'.
  nachdem:
    gloss: after
    note: '''Nachdem'' often introduces past perfect in German, just as English ''after'' can.'
  freute sich auf:
    gloss: looked forward to
    note: German uses reflexive 'sich freuen auf'; English 'look forward to' has no reflexive.
scenes:
- key: s1
  source: 5e79272c4d6269dc
  translation: Mathilde was a little cow from Bavaria. Every day she stood in a big meadow and ate grass. When she saw the
    moon one evening, she said, “I want to become an astronaut!” Her friends laughed loudly.
