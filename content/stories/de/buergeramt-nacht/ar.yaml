  source: f860344da2537a12
  translation: كان الموظف يُدعى السيد شميت. كان على سارة أن تضع أوراقها على الطاولة. كان السيد شميت متعبًا جدًا، لأن عينيه
    كانتا مغمضتين تقريبًا. لم تستطع سارة أن تتحدث بصوت عالٍ، لأنها كانت تضطر إلى الضحك دائمًا.
