summary: تذهب سارة لتسجيل نفسها في مكتب المواطنين، لكن موعدها في الثالثة صباحًا، والموظف ببيجامة يختم ورقتها كأنها كلب.
summary_source: e7426e88ca70e5b1
gestures:
  must: ادفع صندوقًا ثقيلًا وهميًا نحو الأرض بكلتا يديك مع دوس إحدى قدميك، كأنك مضطر لفعل شيء صعب.
  be_past: 'أشر بإبهاميك إلى الخلف فوق كتفك، وأومئ ببطء وقل بتعبير وجهك: هكذا كان الأمر.'
  cannot_past: حرّك رأسك بسرعة رافضًا، وادفع الهواء بكلتا يديك المسطحتين، وارفع كتفيك عاليًا.
  be: 'أشِر بإبهاميك إلى الوراء فوق كتفك، وأومئ برأسك ببطء، وقل بتعبير وجهك: هكذا كان الأمر.'
  cannot: حرّك رأسك بسرعة يمينًا ويسارًا، وادفع الهواء بعيدًا بكفّيك المسطحتين، وارفع كتفيك عاليًا في تعبير عن عدم القدرة.
targets:
  musste:
    gloss: اضطرّت إلى
    note: فعل مساعد في الماضي؛ يقابله في العربية «كان لا بد أن».
  war:
    gloss: كانت
    note: ماضٍ من sein؛ في العربية «كان/كانت».
  konnte nicht:
    gloss: لم تستطع
    note: konnte ماضٍ من können وnicht للنفي؛ في العربية «لم يستطع».
