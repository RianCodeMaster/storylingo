summary: Sarah moet zich inschrijven bij het Bürgeramt, maar haar afspraak is om drie uur 's nachts en de ambtenaar in pyjama
  stempelt haar formulier af als hond.
summary_source: e7426e88ca70e5b1
gestures:
  must: Duw een onzichtbare zware doos met beide handen naar de grond en stamp met één voet, alsof je iets heel moeilijks
    echt moet doen.
  be_past: 'Wijs met beide duimen achter je over je schouder, knik langzaam en zeg met je gezicht: ''zo was het''.'
  cannot_past: Schud snel je hoofd, duw de lucht met beide platte handen weg en haal hoog je schouders op.
  be: 'Wijs met beide duimen achter je over je schouder, knik langzaam en zeg met je gezicht: ''zo was het''.'
  cannot: Schud snel je hoofd, duw de lucht weg met beide platte handen en haal je schouders hoog op.
targets:
  musste:
    gloss: moest
    note: Duitse verleden tijd van müssen; vergelijk Nederlands 'moest'.
  war:
    gloss: was
    note: Duitse verleden tijd van sein; Nederlands 'was' lijkt erop.
  konnte nicht:
    gloss: kon niet
    note: Duitse verleden tijd van können + nicht; Nederlands 'kon niet'.
