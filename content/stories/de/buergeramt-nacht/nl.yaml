- key: s5
  source: 2809b1b981797ca8
  translation: Meneer Schmidt stempelde in zijn slaap, driehonderd keer. Aan het einde was Sarah ingeschreven – maar als hond.
    Ze kon niet boos zijn, want de afspraak was gewoon te grappig. Ze hoefde maar één keer met haar staart te kwispelen, en
    dan was alles perfect.
