  source: f860344da2537a12
  translation: De ambtenaar heette meneer Schmidt. Sarah moest haar papieren op tafel leggen. Meneer Schmidt was heel moe,
    want zijn ogen waren bijna dicht. Sarah kon niet hard praten, omdat ze steeds moest lachen.
