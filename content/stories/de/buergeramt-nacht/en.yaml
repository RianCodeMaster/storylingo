# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Sarah has to register at the Bürgeramt, but her appointment is at three in the morning and the official in pajamas
  stamps her form as a dog.
summary_source: e7426e88ca70e5b1
gestures:
  must: Push an invisible heavy box down to the floor with both hands while stomping one foot, like you really have to do
    something hard.
  be_past: Point both thumbs back over your shoulder, nod slowly and say 'that's how it was' with your face.
  cannot_past: Shake your head fast, push the air away with both flat hands and shrug your shoulders high.
  be: Point both thumbs back over your shoulder, nod slowly and say 'that's how it was' with your face.
  cannot: Shake your head fast, push the air away with both flat hands and shrug your shoulders high.
targets:
  musste:
    gloss: had to
    note: Past of müssen; English uses 'had to', not 'musted'.
  war:
    gloss: was
    note: Past of sein; irregular like English 'was/were'.
  konnte nicht:
    gloss: could not
    note: Past of können + nicht; English 'could not'.
