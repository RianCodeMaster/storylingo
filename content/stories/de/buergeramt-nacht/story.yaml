story:
  title: Der Termin um drei Uhr nachts
  summary: Sarah has to register at the Bürgeramt, but her appointment is at three in the morning and the official in pajamas
    stamps her form as a dog.
  gestures:
  - concept: must
    description: Push an invisible heavy box down to the floor with both hands while stomping one foot, like you really have
      to do something hard.
    emoji: 😤
  - concept: be
    description: Point both thumbs back over your shoulder, nod slowly and say 'that's how it was' with your face.
    emoji: 👈
  - concept: cannot
    description: Shake your head fast, push the air away with both flat hands and shrug your shoulders high.
    emoji: 🙅
