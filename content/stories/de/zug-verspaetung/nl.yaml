# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Felix wil om zeven uur op het werk zijn, zijn trein heeft vijf uur vertraging, dus loopt hij veertig kilometer door
  de regen en komt als eerste aan — op zondag, wanneer het kantoor dicht is.
summary_source: e62d111aea337a69
gestures:
  want: Streel beide armen naar voren met grijpende handen en een grote hongerige glimlach, alsof je iets heel graag wilt.
  went: Marsjeer op de plaats met grote stampende stappen en zwaai je armen als een dolle wandelaar.
  have_past: Druk een onzichtbare grote doos tegen je borst en knik trots om te laten zien wat je had.
  have: Omarm een onzichtbare grote doos tegen je borst en knik trots om te laten zien wat je had.
targets:
  wollte:
    gloss: wilde
    note: Duits 'wollte' is verleden tijd van 'wollen'; Nederlands 'wilde' lijkt erop.
  ist gegangen:
    gloss: is gegaan
    note: Duits gebruikt 'sein' als hulpwerkwoord bij 'gehen'; Nederlands zegt ook 'is gegaan'.
  hatte:
    gloss: had
    note: Duits 'hatte' is verleden tijd van 'haben'; Nederlands 'had' lijkt er sterk op.
