  source: 74a0ab8cf950ef2b
  translation: 'Felix wilde op tijd op het werk komen. Hij wilde om zeven uur op kantoor zijn. Hij had drie wekkers en een
    heel grote klok. Maar Felix wilde nog meer: hij wilde de eerste mens op kantoor zijn.'
