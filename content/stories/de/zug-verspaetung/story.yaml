story:
  title: Felix wollte pünktlich sein
  summary: Felix wants to be at work at seven, his train is five hours late, so he walks forty kilometres through the rain
    and arrives first — on a Sunday, when the office is closed.
  gestures:
  - concept: want
    description: Stretch both arms forward with greedy grabby hands and a big hungry smile, as if you really, really want
      something.
    emoji: 🤲
  - concept: went
    description: March in place with huge stomping steps and swing your arms like a crazy hiker.
    emoji: 🚶
  - concept: have
    description: Hug an invisible big box to your chest and nod proudly to show what you had.
    emoji: 🤗
  scenes:
