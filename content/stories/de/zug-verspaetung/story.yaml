      große Uhr. Aber Felix wollte noch mehr: Er wollte der erste Mensch im Büro sein.'
    image_prompt: A tall thin young man named Felix with curly red hair, round glasses, a green winter coat and a yellow backpack
      stands in his tiny bedroom at night, surrounded by three ringing alarm clocks and one enormous wall clock, looking determined.
    questions:
