  source: 209b9429bc9e9a5e
  translation: 'في السادسة والنصف كان فيليكس في المكتب. كان حذاؤه مبللًا وكان جائعًا جدًا. السيدة كروم، مديرته، كانت تحمل
    المفتاح. قالت: أنت الأول! كل الآخرين أرادوا المجيء، لكنهم ما زالوا في القطار.'
