summary: أراد فيليكس أن يصل إلى العمل في السابعة، لكن قطاره تأخر خمس ساعات، فمشى أربعين كيلومترًا تحت المطر ووصل أولًا — يوم
  أحد والمكتب مغلق.
summary_source: e62d111aea337a69
gestures:
  want: مدّ ذراعيك إلى الأمام بأيدي تتلمس بشغف وابتسامة جائعة، كأنك تريد شيئًا جدًا.
  went: اسرع في مكانك بخطوات ثقيلة كبيرة ولوّح بذراعيك مثل ماشٍ مجنون.
  have_past: احضن صندوقًا كبيرًا غير مرئي إلى صدرك وأومئ بفخر لتبيّن ما كان لديك.
  have: اضمم صندوقًا كبيرًا خياليًا إلى صدرك وأومئ برأسك بفخر لتُظهر ما كان لديك.
targets:
  wollte:
    gloss: أراد
    note: ماضٍ بسيط، والعربية تعبّر عن الإرادة الماضية بـ«أراد».
  ist gegangen:
    gloss: ذهب / مشى
    note: الماضي التام مع sein لأفعال الحركة؛ العربية تستعمل الماضي البسيط.
  hatte:
    gloss: كان لديه
    note: ماضٍ بسيط لـ haben؛ يقابل «كان عنده» في العربية.
scenes:
- key: s1
  source: 74a0ab8cf950ef2b
  translation: 'أراد فيليكس أن يصل إلى العمل في الموعد. أراد أن يكون في المكتب في السابعة. كان لديه ثلاثة منبهات وساعة كبيرة
    جدًا. لكن فيليكس أراد المزيد: أراد أن يكون أول شخص في المكتب.'
