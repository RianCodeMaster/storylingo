  source: 209b9429bc9e9a5e
  translation: At half past six Felix was in the office. He had wet shoes and was very hungry. Ms. Krumm, his boss, had the
    key. 'You are the first! Everyone else wanted to come, but they are still on the train,' said Ms. Krumm.
