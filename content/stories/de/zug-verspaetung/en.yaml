# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Felix wants to be at work at seven, his train is five hours late, so he walks forty kilometres through the rain and
  arrives first — on a Sunday, when the office is closed.
summary_source: e62d111aea337a69
gestures:
  want: Stretch both arms forward with greedy grabby hands and a big hungry smile, as if you really, really want something.
  went: March in place with huge stomping steps and swing your arms like a crazy hiker.
  have_past: Hug an invisible big box to your chest and nod proudly to show what you had.
  have: Hug an invisible big box to your chest and nod proudly to show what you had.
targets:
  wollte:
    gloss: wanted
    note: Simple past of wollen; like English 'wanted', but German verbs change endings for person.
  ist gegangen:
    gloss: went / has gone
    note: German uses sein + past participle for movement; English often just says 'went'.
  hatte:
    gloss: had
    note: Simple past of haben; English 'had' is also one word for all persons.
scenes:
