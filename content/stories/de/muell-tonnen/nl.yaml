- key: s3
  source: bdcda65b37cc967c
  translation: Op maandag stond Lukas met een yoghurtbeker voor de twaalf containers. Hij stond daar veertig minuten en huilde
    zacht. Het erf was stil, want er waren alleen Lukas en de containers. Hij mocht niet aanbellen, want mevrouw Becker hield
    een middagdutje.
