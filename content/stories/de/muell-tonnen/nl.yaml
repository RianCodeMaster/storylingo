- key: s2
  source: 6a35f1ef3c1270c3
  translation: Mevrouw Becker heeft uitgelegd dat de roze container voor plastic is. De zilveren container was voor oude sokken
    en de turquoise container voor kapotte paraplu's. Lukas was heel in de war, want er waren te veel regels. Hij mocht niet
    hardop praten wanneer hij afval sorteerde.
