# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Mevrouw Becker legt Lukas de afvalscheiding uit met twaalf containers in twaalf kleuren, Lukas is doodsbang om een
  fout te maken, en uiteindelijk gooit de vuilniswagen alles in één gat.
summary_source: 653cdd3fe4977f26
gestures:
  explained: Steek één vinger omhoog als een strenge leraar, open je andere hand als een boek en knik drie keer langzaam terwijl
    je 'So!' zegt.
  not_allowed: Kruis je armen in een grote X voor je borst en schud hard met je hoofd, als een bewaker bij een heel belangrijke
    deur.
  there_was: Open je armen wijd en presenteer iets onzichtbaars voor je, als een goochelaar die een enorme tafel vol containers
    laat zien.
  there_is: Open je armen wijd en laat iets onzichtbaars voor je zien, alsof je een goochelaar bent die een enorme tafel vol
    bakken toont.
targets:
  hat erklärt:
    gloss: heeft uitgelegd
    note: 'Duits ''hat ... erklärt'' lijkt op Nederlands ''heeft ... uitgelegd'': haben/hebben + voltooid deelwoord.'
  durfte nicht:
    gloss: mocht niet
    note: Duits 'durfte' is de verleden tijd van dürfen; Nederlands 'mocht'.
  es gab:
    gloss: er was
    note: Duits 'es gab' betekent 'er was'; letterlijk 'het gaf'.
scenes:
- key: s1
  source: e80830a2aaf4de47
  translation: 'Mevrouw Becker is 84 jaar oud en heel streng. Gisteren heeft mevrouw Becker de afvalscheiding uitgelegd: twaalf
    containers in twaalf kleuren. Op het erf stonden twaalf containers, en er waren twaalf kleuren. Lukas mocht niet eens
    één fout maken.'
