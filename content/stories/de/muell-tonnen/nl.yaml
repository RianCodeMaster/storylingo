- key: s4
  source: eef37484c032d13a
  translation: 'Plotseling stond mevrouw Becker achter hem en was woedend als een onweer. Ze heeft uitgelegd: ''Het deksel
    is plastic, de beker is papier!'' Lukas gooide de beker snel in de oranje container. Toen schreeuwde mevrouw Becker: ''Fout!
    De oranje container is voor batterijen!'''
