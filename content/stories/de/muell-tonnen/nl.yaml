- key: s5
  source: 06952b9499abf137
  translation: 'De volgende ochtend kwam de vuilniswagen en gooide alle twaalf containers in hetzelfde gat. In de wagen was
    maar één gat, en er waren geen kleuren meer. Mevrouw Becker zag dat en viel flauw. Lukas heeft gelachen en heeft uitgelegd:
    ''Afvalscheiding is heel simpel!'''
