    text: 'Frau Becker ist 84 Jahre alt und sehr streng. Gestern hat Frau Becker die Mülltrennung erklärt: zwölf Tonnen in
      zwölf Farben. Auf dem Hof standen zwölf Tonnen, und es gab zwölf Farben. Lukas durfte nicht einmal einen Fehler machen.'
