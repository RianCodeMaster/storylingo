story:
  title: Zwölf Tonnen, zwölf Farben
  summary: Frau Becker explains garbage separation to Lukas with twelve bins in twelve colors, Lukas is terrified of making
    a mistake, and in the end the garbage truck throws everything into one hole.
  gestures:
  - concept: explained
    description: Point one finger up like a strict teacher, open the other hand like a book, and nod slowly three times while
      saying 'So!'
    emoji: 👩‍🏫
  - concept: not_allowed
    description: Cross both arms in a big X in front of your chest and shake your head hard, like a guard at a very important
      door.
    emoji: 🙅
  - concept: there_is
    description: Open both arms wide and present something invisible in front of you, like a magician showing a huge table
      full of bins.
    emoji: ✨
