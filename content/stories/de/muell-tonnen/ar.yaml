summary: تشرح السيدة بيكر لوكاس فصل النفايات عبر اثنتي عشرة حاوية بألوان مختلفة، فيرتعب من ارتكاب خطأ، وفي النهاية ترمي شاحنة
  النفايات كل شيء في الحفرة نفسها.
summary_source: 653cdd3fe4977f26
gestures:
  explained: 'ارفع إصبعًا كمعلم صارم، وافتح اليد الأخرى ككتاب، وأومئ ببطء ثلاث مرات وأنت تقول: «هكذا!»'
  not_allowed: اعقد ذراعيك على صدرك بشكل X كبير، وحرّك رأسك بقوة يمينًا ويسارًا، كحارس أمام باب مهم جدًا.
  there_was: افتح ذراعيك واسعًا واعرض شيئًا غير مرئي أمامك، كساحر يعرض طاولة كبيرة مليئة بالحاويات.
  there_is: افتح ذراعيك واسعًا واعرض شيئًا غير مرئي أمامك، كساحر يعرض طاولة كبيرة مليئة بالصناديق.
targets:
  hat erklärt:
    gloss: قد شرحَ
    note: الماضي التام الألماني يتكون من haben/sein + اسم مفعول؛ في العربية يكفي فعل ماضٍ واحد.
  durfte nicht:
    gloss: لم يُسمح له
    note: الفعل الناقص dürfen في الماضي مع nicht يعبر عن المنع؛ يقابله «لم يُسمح له».
  es gab:
    gloss: كان هناك
    note: صيغة ثابتة للموجود في الماضي؛ تقابل «كان هناك» في العربية.
