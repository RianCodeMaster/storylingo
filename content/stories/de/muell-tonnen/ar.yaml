- key: s4
  source: eef37484c032d13a
  translation: 'فجأة وقفت السيدة بيكر خلفه وكانت غاضبة كعاصفة رعدية. شرحت: «الغطاء بلاستيك، والكوب ورق!» رمى لوكاس الكوب بسرعة
    في الحاوية البرتقالية. حينها صرخت السيدة بيكر: «خطأ! الحاوية البرتقالية مخصصة للبطاريات!»'
