- key: s1
  source: e80830a2aaf4de47
  translation: 'السيدة بيكر تبلغ من العمر 84 عامًا وهي صارمة جدًا. أمس شرحت السيدة بيكر فصل النفايات: اثنتا عشرة حاوية بألوان
    اثني عشر لونًا. في الفناء كانت هناك اثنتا عشرة حاوية، وكانت هناك اثنا عشر لونًا. لم يُسمح للوكاس حتى بارتكاب خطأ واحد.'
