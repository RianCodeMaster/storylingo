- key: s5
  source: 06952b9499abf137
  translation: 'في صباح اليوم التالي جاءت شاحنة النفايات ورمت كل الحاويات الاثنتي عشرة في الحفرة نفسها. في الشاحنة كان هناك
    ثقب واحد فقط، ولم تكن هناك ألوان بعد الآن. رأت السيدة بيكر ذلك فسقطت مغشيًا عليها. ضحك لوكاس وشرح: «فصل النفايات سهل جدًا!»'
