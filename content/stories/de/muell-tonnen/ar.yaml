- key: s3
  source: bdcda65b37cc967c
  translation: في يوم الاثنين وقف لوكاس أمام الحاويات الاثنتي عشرة حاملًا كوب زبادي. وقف هناك أربعين دقيقة وبكى بهدوء. كان
    الفناء هادئًا، لأنه لم يكن هناك إلا لوكاس والحاويات. لم يكن مسموحًا له أن يرن الجرس، لأن السيدة بيكر كانت تأخذ قيلولة
