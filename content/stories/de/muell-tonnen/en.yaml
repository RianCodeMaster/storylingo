- key: s3
  source: bdcda65b37cc967c
  translation: On Monday Lukas stood in front of the twelve bins with a yogurt cup. He stood there for forty minutes and cried
    quietly. The yard was quiet, because there were only Lukas and the bins. He was not allowed to ring the bell, because
    Mrs. Becker was taking a nap.
