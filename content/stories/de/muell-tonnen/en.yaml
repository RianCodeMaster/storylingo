  source: 06952b9499abf137
  translation: 'The next morning the garbage truck came and threw all twelve bins into the same hole. In the truck there was
    only one hole, and there were no colors anymore. Mrs. Becker saw that and fainted. Lukas laughed and explained: ''Waste
    separation is very easy!'''
