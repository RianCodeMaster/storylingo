- key: s2
  source: 6a35f1ef3c1270c3
  translation: Mrs. Becker explained that the pink bin is for plastic. The silver bin was for old socks, and the turquoise
    bin for broken umbrellas. Lukas was very confused because there were too many rules. He was not allowed to speak loudly
    when he sorted the garbage.
