- key: s4
  source: eef37484c032d13a
  translation: 'Suddenly Mrs. Becker stood behind him and was angry like a thunderstorm. She explained: ''The lid is plastic,
    the cup is paper!'' Lukas quickly threw the cup into the orange bin. Then Mrs. Becker shouted: ''Wrong! The orange bin
    is for batteries!'''
