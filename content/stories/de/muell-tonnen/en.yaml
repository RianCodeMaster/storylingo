# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Mrs. Becker explains garbage separation to Lukas with twelve bins in twelve colors, Lukas is terrified of making
  a mistake, and in the end the garbage truck throws everything into one hole.
summary_source: 653cdd3fe4977f26
gestures:
  explained: Point one finger up like a strict teacher, open the other hand like a book, and nod slowly three times while
    saying 'So!'
  not_allowed: Cross both arms in a big X in front of your chest and shake your head hard, like a guard at a very important
    door.
  there_was: Open both arms wide and present something invisible in front of you, like a magician showing a huge table full
    of bins.
  there_is: Open both arms wide and present something invisible in front of you, like a magician showing a huge table full
    of bins.
targets:
  hat erklärt:
    gloss: explained
    note: German perfect tense uses hat + participle; English often uses simple past.
  durfte nicht:
    gloss: was not allowed
    note: Durfte is simple past of dürfen; English says 'was not allowed to'.
  es gab:
    gloss: there was/were
    note: German es gab means 'there was/were'; English uses there + be.
scenes:
- key: s1
  source: e80830a2aaf4de47
  translation: 'Mrs. Becker is 84 years old and very strict. Yesterday Mrs. Becker explained waste separation: twelve bins
    in twelve colors. In the yard stood twelve bins, and there were twelve colors. Lukas was not allowed to make even one
    mistake.'
