# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Anna heeft een sollicitatiegesprek via video, maar haar kat Paul springt op het toetsenbord en beantwoordt elke vraag
  beter dan zij.
summary_source: fd62afc3a2435e43
gestures:
  when_past: 'Knijp één keer met je vingers en gooi je duim over je schouder met een wetende knik, alsof je zegt: ''precies
    toen gebeurde het''.'
  because: Duw beide vuisten vanaf je borst naar voren alsof je de reden de wereld in schuift, met een vastberaden gezicht
    van 'daarom!'.
  would_have: Laat één open hand langzaam omhoog zweven en zucht dromerig, alsof je een wolkje van wat had kunnen zijn loslaat.
targets:
  als:
    gloss: toen (verleden)
    note: Duitse bijzin met 'als' zet het werkwoord achteraan; Nederlands gebruikt vaak 'toen'.
  weil:
    gloss: omdat
    note: Net als Nederlands 'omdat' houdt Duits 'weil' het werkwoord achteraan.
  hätte:
    gloss: zou hebben
    note: Konjunktiv II van 'haben'; Nederlands gebruikt 'zou(den) hebben'.
scenes:
- key: s1
  source: 66dcc540aa49d1a5
  translation: Anna had vandaag een groot sollicitatiegesprek via video. Ze had graag langer geslapen, maar ze moest om zeven
    uur achter de laptop zitten, omdat 400 mensen de baan wilden en slechts één persoon hem kreeg. Toen Anna de laptop opende,
    kwam haar kater Paul de kamer binnen en ging direct op de tafel zitten.
