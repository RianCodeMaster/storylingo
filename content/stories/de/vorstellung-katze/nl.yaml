- key: s5
  source: e452d67e138ee7a0
  translation: 'Aan het einde zei mevrouw Kranich: ''Wij nemen de kater.'' Anna was verdrietig, omdat ze de baan echt nodig
    had. Maar toen glimlachte mevrouw Kranich en zei: ''U zou ook een baan hebben — als assistente van meneer Paul.'' Toen
    Anna thuiskwam, lag Paul al op de bank en sliep als een baas.'
