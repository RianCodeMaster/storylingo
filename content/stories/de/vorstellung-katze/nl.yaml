- key: s4
  source: 1d1f70fddb610698
  translation: 'Paul antwoordde op elke vraag, en elk antwoord was beter dan dat van Anna. Hij schreef: ''Ik kan 40 uur per
    week slapen en toch 300 pyjama''s per dag naaien.'' Anna had dat nooit zo goed kunnen formuleren, omdat ze van de zenuwen
    nauwelijks kon ademen. Toen mevrouw Kranich naar haar salariswensen vroeg, tikte Paul: ''Twee blikken tonijn per dag.'''
