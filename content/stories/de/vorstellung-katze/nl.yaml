- key: s3
  source: 50072d3ee10b2541
  translation: 'Mevrouw Kranich lachte hard en zei: ''Eindelijk iemand die moedig is!'' Anna wist niet wat ze moest zeggen,
    omdat ze nog nooit zo''n bazin had gezien. Ze had het liefst de laptop dichtgeklapt, maar haar handen trilden te erg.
    Toen Paul de tweede vraag hoorde, tikte hij meteen het perfecte antwoord.'
