- key: s2
  source: 67266c5dbe314727
  translation: 'Om negen uur begon het gesprek met mevrouw Kranich van het pyjamabedrijf. Toen mevrouw Kranich de eerste vraag
    stelde, sprong Paul plotseling op het toetsenbord. Anna wilde hem wegnemen, omdat ze bang was, maar op dat moment tikte
    Paul al met beide poten. Op het scherm stond: ''Ik zou graag meer salaris hebben.'''
