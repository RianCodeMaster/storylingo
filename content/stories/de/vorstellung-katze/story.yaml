  - key: s5
    text: 'Am Ende sagte Frau Kranich: „Wir nehmen den Kater.“ Anna war traurig, weil sie den Job wirklich gebraucht hätte.
      Aber dann lächelte Frau Kranich und sagte: „Sie hätten auch eine Stelle — als Assistentin von Herrn Paul.“ Als Anna
      nach Hause kam, lag Paul schon auf dem Sofa und schlief wie ein Chef.'
    image_prompt: The same red-haired woman in a green jumper laughs with relief while the fat tabby cat with one black ear
      lies stretched out on a sofa wearing a tiny tie, sleeping like a boss.
    questions:
    - key: s5q1
      kind: who_what
      prompt: Wen wollte Frau Kranich am Ende nehmen?
      options: [den Kater, Anna, die Nachbarin]
      answer: den Kater
    - key: s5q2
      kind: yes_no
      prompt: War Anna zuerst traurig?
      options: [ja, nein]
      answer: ja
    - key: s5q3
      kind: either_or
      prompt: Bekam Anna die Stelle als Assistentin oder als Chefin?
      options: [als Assistentin, als Chefin]
      answer: als Assistentin
    - key: s5q4
      kind: yes_no
      prompt: War Anna am Ende traurig, weil sie keine Stelle hatte?
      options: [ja, nein]
      answer: nein
      target: weil
    - key: s5q5
      kind: who_what
      prompt: Als Anna nach Hause kam, was machte Paul?
      options: [er schlief auf dem Sofa, er tippte weiter, er kochte Kaffee]
      answer: er schlief auf dem Sofa
      target: als
