        und nur eine Person ihn bekam.
      emotion: surprised
    - text: Als Anna den Laptop aufmachte, kam ihr Kater Paul ins Zimmer und setzte sich direkt auf den Tisch.
      emotion: amused
  - key: s2
    text: 'Um neun Uhr begann das Gespräch mit Frau Kranich von der Schlafanzug-Firma. Als Frau Kranich die erste Frage stellte,
      sprang Paul plötzlich auf die Tastatur. Anna wollte ihn wegnehmen, weil sie Angst hatte, aber da tippte Paul schon mit
      beiden Pfoten. Auf dem Bildschirm stand: „Ich hätte gern mehr Gehalt.“'
    image_prompt: The same red-haired woman in a green jumper reaches toward the laptop while the fat tabby cat with one black
      ear stands with both paws on the keyboard; on the screen a video call shows a strict woman with grey hair.
    questions:
    - key: s2q1
      kind: yes_no
      prompt: Begann das Gespräch um neun Uhr?
      options: [ja, nein]
      answer: ja
    - key: s2q2
      kind: either_or
      prompt: Sprang Paul auf die Tastatur oder auf den Teppich?
      options: [auf die Tastatur, auf den Teppich]
      answer: auf die Tastatur
    - key: s2q3
      kind: who_what
      prompt: Was stand auf dem Bildschirm?
      options:
      - Ich hätte gern mehr Gehalt
      - Ich hätte gern mehr Urlaub
      - Ich hätte gern einen Kaffee
      answer: Ich hätte gern mehr Gehalt
      target: hätte
    - key: s2q4
      kind: yes_no
      prompt: Wollte Anna Paul wegnehmen, weil sie Angst hatte?
      options: [ja, nein]
      answer: ja
      target: weil
    - key: s2q5
      kind: who_what
      prompt: Als Frau Kranich die erste Frage stellte, wer sprang auf die Tastatur?
      options: [Paul, Anna, Frau Kranich]
      answer: Paul
      target: als
