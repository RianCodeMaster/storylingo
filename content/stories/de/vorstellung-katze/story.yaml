# A story, in its target language. Edit freely, then: storylingo.py sync  (and media / localize / check as it says).
# Keys (s2, s2q3) name a scene or question for good: keep them when you change a text, so learners keep their
# history. A new scene or question may leave its key out; sync gives it one. status: draft or published.
slug: vorstellung-katze
status: published
tags: [algemeen, werk]
brief:
  language: de
  level: B1
  theme: Anna hat ein Vorstellungsgespräch per Video, als ihre Katze plötzlich auf die Tastatur springt und alle Fragen besser
    beantwortet als sie
  scenes: 5
  targets:
  - text: als
    gloss: when (past, verb at the end)
    concept: when_past
    kind: word
  - text: weil
    gloss: because (verb at the end)
    concept: because
    kind: word
  - text: hätte
    gloss: would have
    concept: would_have
    kind: word
  narrator: jessica
story:
  title: Der Kater bekommt den Job
  summary: Anna has a video job interview, but her cat Paul jumps on the keyboard and answers every question better than she
    does.
  gestures:
  - concept: when_past
    description: Snap your fingers once, then throw your thumb back over your shoulder with a knowing nod, as if saying 'that
      was the exact moment it happened'.
    emoji: 👆
  - concept: because
    description: Push both fists forward from your chest like you are shoving the reason out into the world, with a determined
      'that's why!' face.
    emoji: 💪
  - concept: would_have
    description: Float one open hand slowly upward and give a dreamy sigh, like you are releasing a little cloud of what could
      have been.
    emoji: ☁️
  scenes:
  - key: s1
    text: Anna hatte heute ein großes Vorstellungsgespräch per Video. Sie hätte gern länger geschlafen, aber sie musste um
      sieben Uhr am Laptop sitzen, weil 400 Leute den Job wollten und nur eine Person ihn bekam. Als Anna den Laptop aufmachte,
      kam ihr Kater Paul ins Zimmer und setzte sich direkt auf den Tisch.
    image_prompt: A young woman with curly red hair and a green jumper sits nervously at a wooden desk in front of an open
      laptop in a small apartment; a fat tabby cat with one black ear jumps onto the desk beside her.
    questions:
    - key: s1q1
      kind: yes_no
      prompt: Hätte Anna gern länger geschlafen?
      options: [ja, nein]
      answer: ja
      target: hätte
    - key: s1q2
      kind: either_or
      prompt: Wollten 400 Leute den Job oder 40 Leute?
      options: [400 Leute, 40 Leute]
      answer: 400 Leute
    - key: s1q3
      kind: who_what
      prompt: Wer kam ins Zimmer?
      options: [der Kater Paul, Frau Kranich, die Nachbarin]
      answer: der Kater Paul
    - key: s1q4
      kind: either_or
      prompt: Musste Anna um sieben Uhr am Laptop sitzen oder um elf Uhr?
      options: [um sieben Uhr, um elf Uhr]
      answer: um sieben Uhr
    - key: s1q5
      kind: yes_no
      prompt: Setzte sich Paul auf den Boden?
      options: [ja, nein]
      answer: nein
