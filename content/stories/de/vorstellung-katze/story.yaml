  - key: s3
    text: 'Frau Kranich lachte laut und sagte: „Endlich jemand, der mutig ist!“ Anna wusste nicht, was sie sagen sollte, weil
      sie noch nie so eine Chefin gesehen hatte. Sie hätte am liebsten den Laptop zugeklappt, aber ihre Hände zitterten zu
      stark. Als Paul die zweite Frage hörte, tippte er sofort die perfekte Antwort.'
    image_prompt: The same red-haired woman in a green jumper stares open-mouthed at the screen while the fat tabby cat with
      one black ear types confidently; the woman on the video call laughs loudly and claps her hands.
    questions:
    - key: s3q1
      kind: yes_no
      prompt: Lachte Frau Kranich laut?
      options: [ja, nein]
      answer: ja
    - key: s3q2
      kind: either_or
      prompt: Fand Frau Kranich die Antwort mutig oder langweilig?
      options: [mutig, langweilig]
      answer: mutig
    - key: s3q3
      kind: yes_no
      prompt: Wusste Anna nicht, was sie sagen sollte, weil sie so eine Chefin noch nie gesehen hatte?
      options: [ja, nein]
      answer: ja
      target: weil
    - key: s3q4
      kind: yes_no
      prompt: Hätte Anna am liebsten den Laptop zugeklappt?
      options: [ja, nein]
      answer: ja
      target: hätte
