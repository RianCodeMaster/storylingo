  - key: s4
    text: 'Paul antwortete auf jede Frage, und jede Antwort war besser als die von Anna. Er schrieb: „Ich kann 40 Stunden
      pro Woche schlafen und trotzdem 300 Schlafanzüge pro Tag nähen.“ Anna hätte das nie so gut formulieren können, weil
      sie vor Nervosität kaum atmen konnte. Als Frau Kranich nach den Gehaltswünschen fragte, tippte Paul: „Zwei Dosen Thunfisch
      pro Tag.“'
    image_prompt: The same red-haired woman in a green jumper has her head in her hands while the fat tabby cat with one black
      ear proudly types with both paws; the screen shows a long chat full of answers and the words 'Zwei Dosen Thunfisch'.
    questions:
    - key: s4q1
      kind: yes_no
      prompt: Waren Pauls Antworten besser als Annas Antworten?
      options: [ja, nein]
      answer: ja
    - key: s4q2
      kind: either_or
      prompt: Wollte Paul zwei Dosen Thunfisch pro Tag oder zwei Dosen Katzenmilch?
      options: [zwei Dosen Thunfisch, zwei Dosen Katzenmilch]
      answer: zwei Dosen Thunfisch
    - key: s4q3
      kind: who_what
      prompt: Wie viele Schlafanzüge wollte Paul pro Tag nähen?
      options: ['300', '30', '3000']
      answer: '300'
    - key: s4q4
      kind: yes_no
      prompt: Konnte Anna gut antworten, weil sie ruhig war?
      options: [ja, nein]
      answer: nein
      target: weil
    - key: s4q5
      kind: yes_no
      prompt: Hätte Anna das besser formulieren können?
      options: [ja, nein]
      answer: nein
      target: hätte
