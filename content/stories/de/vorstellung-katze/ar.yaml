- key: s5
  source: e452d67e138ee7a0
  translation: 'في النهاية قالت السيدة كرانيش: «سنأخذ القط.» حزنت آنا لأنها كانت تحتاج الوظيفة حقًا. لكن بعدها ابتسمت السيدة
    كرانيش وقالت: «ستحصلين أنت أيضًا على وظيفة — مساعدة للسيد بول.» عندما وصلت آنا إلى البيت، كان بول قد تمدد على الأريكة
    ونام مثل رئيس.'
