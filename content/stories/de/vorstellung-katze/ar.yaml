summary: لدى آنا مقابلة عمل عبر الفيديو، لكن قطها بول يقفز على لوحة المفاتيح ويجيب عن كل سؤال أفضل منها.
summary_source: fd62afc3a2435e43
gestures:
  when_past: 'اطقطق بأصابعك مرة ثم ألقِ إبهامك خلف كتفك مع إيماءة معرفة، كأنك تقول: تلك كانت اللحظة بالضبط.'
  because: 'ادفع قبضتيك للأمام من صدرك كأنك تدفع السبب إلى العالم، مع وجه حاسم يقول: لهذا السبب!'
  would_have: ارفع يدًا مفتوحة ببطء نحو الأعلى وتنهد تنهيدة حالمة، كأنك تطلق سحابة صغيرة مما كان يمكن أن يكون.
targets:
  als:
    gloss: عندما (للماضي)
    note: تُستخدم als للحدث الماضي الواحد، مثل «لما» في العربية.
  weil:
    gloss: لأن
    note: بعد weil ينتقل الفعل إلى نهاية الجملة، بخلاف «لأن» العربية.
  hätte:
    gloss: كان سـ/كان يودّ
    note: hätte صيغة شرطية لـ haben، تقابل «كان + سـ» في العربية.
scenes:
- key: s1
  source: 66dcc540aa49d1a5
  translation: كان لدى آنا اليوم مقابلة عمل كبيرة عبر الفيديو. كانت تتمنى لو نامت أطول، لكن كان عليها الجلوس أمام الحاسوب
    في السابعة لأن 400 شخص أرادوا الوظيفة وشخص واحد فقط سينالها. عندما فتحت آنا الحاسوب، دخل قطها بول الغرفة وجلس مباشرة على
    الطاولة.
