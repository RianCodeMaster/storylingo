- key: s2
  source: 67266c5dbe314727
  translation: 'في التاسعة بدأت المقابلة مع السيدة كرانيش من شركة ملابس النوم. عندما طرحت السيدة كرانيش السؤال الأول، قفز
    بول فجأة على لوحة المفاتيح. أرادت آنا أن تبعده لأنها خافت، لكن بول كان قد بدأ يكتب بمخلبيه. على الشاشة ظهر: «كنت أودّ
    راتبًا أعلى».'
