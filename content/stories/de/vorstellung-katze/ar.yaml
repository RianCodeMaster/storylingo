- key: s4
  source: 1d1f70fddb610698
  translation: 'أجاب بول عن كل سؤال، وكان كل جواب أفضل من جواب آنا. كتب: «أستطيع أن أنام 40 ساعة في الأسبوع ومع ذلك أخيط 300
    بيجامة في اليوم.» لم تكن آنا لتستطيع صياغة ذلك بهذا الجمال أبدًا لأنها كانت بالكاد تتنفس من التوتر. عندما سألت السيدة
    كرانيش عن توقعات الراتب، كتب بول: «علبتا تونة في اليوم.»'
