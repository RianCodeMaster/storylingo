- key: s3
  source: 50072d3ee10b2541
  translation: 'ضحكت السيدة كرانيش بصوت عالٍ وقالت: «أخيرًا شخص شجاع!» لم تعرف آنا ماذا تقول لأنها لم ترَ رئيسة كهذه من قبل.
    كانت تفضّل إغلاق الحاسوب، لكن يديها كانتا ترتجفان بشدة. عندما سمع بول السؤال الثاني، كتب فورًا الجواب المثالي.'
