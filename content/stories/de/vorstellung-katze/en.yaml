- key: s4
  source: 1d1f70fddb610698
  translation: 'Paul answered every question, and every answer was better than Anna''s. He wrote: ''I can sleep 40 hours per
    week and still sew 300 pajamas per day.'' Anna would never have been able to phrase that so well, because she could hardly
    breathe from nervousness. When Ms. Kranich asked about salary wishes, Paul typed: ''Two cans of tuna per day.'''
