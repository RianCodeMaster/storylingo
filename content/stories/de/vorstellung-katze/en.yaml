- key: s5
  source: e452d67e138ee7a0
  translation: 'At the end Ms. Kranich said: ''We''ll take the tomcat.'' Anna was sad because she really would have needed
    the job. But then Ms. Kranich smiled and said: ''You would also have a position — as Mr. Paul''s assistant.'' When Anna
    came home, Paul was already lying on the sofa and sleeping like a boss.'
