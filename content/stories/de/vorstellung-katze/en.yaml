# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Anna has a video job interview, but her cat Paul jumps on the keyboard and answers every question better than she
  does.
summary_source: fd62afc3a2435e43
gestures:
  when_past: Snap your fingers once, then throw your thumb back over your shoulder with a knowing nod, as if saying 'that
    was the exact moment it happened'.
  because: Push both fists forward from your chest like you are shoving the reason out into the world, with a determined 'that's
    why!' face.
  would_have: Float one open hand slowly upward and give a dreamy sigh, like you are releasing a little cloud of what could
    have been.
targets:
  als:
    gloss: when (past)
    note: In past-time clauses, German als sends the verb to the end; English when keeps normal order.
  weil:
    gloss: because
    note: 'Weil is a subordinating conjunction: the verb goes to the end, unlike English because.'
  hätte:
    gloss: would have
    note: Hätte is Konjunktiv II of haben; English uses would have + past participle.
