- key: s3
  source: 50072d3ee10b2541
  translation: 'Ms. Kranich laughed loudly and said: ''Finally someone who is brave!'' Anna did not know what she should say,
    because she had never seen such a boss before. She would have most liked to close the laptop, but her hands were trembling
    too much. When Paul heard the second question, he immediately typed the perfect answer.'
