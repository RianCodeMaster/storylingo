- key: s2
  source: 67266c5dbe314727
  translation: 'At nine o''clock the interview with Ms. Kranich from the pajama company began. When Ms. Kranich asked the
    first question, Paul suddenly jumped onto the keyboard. Anna wanted to take him away because she was afraid, but by then
    Paul was already typing with both paws. On the screen it said: ''I would like more salary.'''
