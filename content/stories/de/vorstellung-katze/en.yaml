  source: 66dcc540aa49d1a5
  translation: Anna had a big video job interview today. She would have liked to sleep longer, but she had to sit at the laptop
    at seven o'clock because 400 people wanted the job and only one person would get it. When Anna opened the laptop, her
    tomcat Paul came into the room and sat right on the table.
