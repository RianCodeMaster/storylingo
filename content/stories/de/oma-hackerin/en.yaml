  source: 930507d70f3b8ac2
  translation: Grandma Hilde is 92 years old and lives in Berlin. She likes drinking tea and knitting, although she actually
    has no time. Because Grandma Hilde is Germany's best hacker, although nobody knows it. She would like to have the Wi-Fi
    code for the whole city.
