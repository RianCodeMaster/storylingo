# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). scenes follow story.yaml in order.
summary: Oma Hilde, 92, is secretly Germany's best hacker and changes the Wi-Fi code of the whole city, but then she forgets
  her own code.
summary_source: 133ece3fde626b8a
gestures:
  although: Raise one eyebrow and push your chin up with the other hand, with a face saying 'Really? Yet!'
  would_like_to_have: Reach both hands out pleadingly toward a giant imaginary cake that is just too far away.
  would_like_to_do: Jump onto an imaginary bike and pedal wildly in the air with a hungry look for adventure.
targets:
  obwohl:
    gloss: although
    note: Verb goes last, unlike English 'although'.
  hätte gern:
    gloss: would like to have
    note: '''hätte'' is subjunctive, like English ''would like''.'
  würde gern:
    gloss: would like to
    note: Uses 'würde' + infinitive, like English 'would'.
