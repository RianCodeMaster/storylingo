- key: s2
  source: e2f01ebae879a7b9
  translation: 'Het wifiwachtwoord van Berlijn is duizend tekens lang, en daar wordt Oma Hilde woedend van. Ze zou graag de
    code van heel de stad veranderen. Maar de burgemeester zegt: ''Dat mag je niet doen!'' — hoewel Hilde veel beter hackt
    dan hij.'
