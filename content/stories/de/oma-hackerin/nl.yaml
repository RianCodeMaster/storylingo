- key: s5
  source: 7829af5453213b0f
  translation: '1000 mensen staan voor Hildes deur, en allemaal zouden ze graag de nieuwe code hebben. Hilde zou graag helpen,
    maar ze is de code zelf vergeten. Dan springt haar kat op het toetsenbord en typt: ''HILDE123''. De stad heeft weer wifi,
    en Oma Hilde zou graag een beetje rust hebben — maar nu kent iedereen haar code.'
