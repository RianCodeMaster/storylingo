summary: Oma Hilde (92) is stiekem de beste hacker van Duitsland en verandert het wifiwachtwoord van heel de stad — maar dan
  vergeet ze haar eigen code.
summary_source: 133ece3fde626b8a
gestures:
  although: 'Je trekt met één hand je wenkbrauw hoog op en duwt met de andere hand je kin omhoog, met een gezicht van: ''Echt?
    Toch!'''
  would_like_to_have: Je strekt beide handen smekend vooruit naar een gigantische denkbeeldige taart die net te ver weg staat.
  would_like_to_do: Je springt op een denkbeeldige fiets en trapt wild in de lucht met een hongerige blik naar avontuur.
