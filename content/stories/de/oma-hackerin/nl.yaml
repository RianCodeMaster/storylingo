- key: s1
  source: 930507d70f3b8ac2
  translation: Oma Hilde is 92 jaar en woont in Berlijn. Ze drinkt graag thee en breit graag, hoewel ze eigenlijk geen tijd
    heeft. Want Oma Hilde is de beste hacker van Duitsland — hoewel niemand dat weet. Ze zou graag het wifiwachtwoord van
    heel de stad hebben.
