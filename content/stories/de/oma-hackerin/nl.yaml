- key: s4
  source: 3901cfc8cc401105
  translation: 'Hoewel de code duizend tekens heeft, zit Hilde er binnen tien minuten in. Ze zou graag iets dappers doen,
    en daarom verandert ze de code van heel de stad. De nieuwe code is: ''HILDE123''. Plotseling is de hele stad offline —
    1000 mensen staan op straat te schreeuwen.'
