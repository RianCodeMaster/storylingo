story:
  title: Oma Hilde und der WLAN-Code von Berlin
  summary: Oma Hilde (92) is stiekem de beste hacker van Duitsland en verandert het wifiwachtwoord van heel de stad — maar
    dan vergeet ze haar eigen code.
  gestures:
  - concept: although
    description: 'Je trekt met één hand je wenkbrauw hoog op en duwt met de andere hand je kin omhoog, met een gezicht van:
      ''Echt? Toch!'''
    emoji: 🤨
  - concept: would_like_to_have
    description: Je strekt beide handen smekend vooruit naar een gigantische denkbeeldige taart die net te ver weg staat.
    emoji: 🙏
  - concept: would_like_to_do
    description: Je springt op een denkbeeldige fiets en trapt wild in de lucht met een hongerige blik naar avontuur.
    emoji: 🚴
  scenes:
  - key: s1
    text: Oma Hilde ist 92 Jahre alt und wohnt in Berlin. Sie trinkt Tee und strickt gern, obwohl sie eigentlich keine Zeit
      hat. Denn Oma Hilde ist die beste Hackerin von Deutschland — obwohl niemand das weiß. Sie hätte gern den WLAN-Code von
      der ganzen Stadt.
    image_prompt: 'Cartoon: a tiny 92-year-old woman with big round glasses, white hair in a bun, a purple knitted cardigan
      and a walking stick, sitting in a cosy Berlin flat with a teapot and knitting on the table — and a laptop glowing secretly
      under her knitting.'
