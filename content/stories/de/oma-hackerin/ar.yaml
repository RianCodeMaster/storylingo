summary: الجدة هيلدي (92 عامًا) هي أفضل هاكرة في ألمانيا سرًا وتغيّر رمز الواي فاي للمدينة كلها — لكنها تنسى رمزها الخاص.
summary_source: 133ece3fde626b8a
gestures:
  although: 'ترفع حاجبًا وتدفع ذقنك للأعلى بنظرة متحدية تقول: «رغم ذلك!».'
  would_like_to_have: تمدّ يديك متوسّلًا نحو كعكة خيالية كبيرة بعيدة قليلًا عن متناولك.
  would_like_to_do: تقفز على دراجة خيالية وتضغط على الدوّاسات في الهواء بنظرة متلهفة للمغامرة.
targets:
  obwohl:
    gloss: رغم أنّ
    note: بعد obwohl يأتي الفعل في نهاية الجملة، بينما في العربية تبقى الجملة على ترتيبها المعتاد.
  hätte gern:
    gloss: كنت أودّ الحصول على
    note: تعبير مؤدب لطلب شيء، ويأتي بعده اسم؛ قارنه بـ«أودّ» في العربية.
  würde gern:
    gloss: كنت أودّ أن
    note: يستخدم مع فعل في المصدر للتعبير عن رغبة مؤدبة، مثل «أودّ أن...».
scenes:
- key: s1
  source: 930507d70f3b8ac2
  translation: الجدة هيلدي تبلغ 92 عامًا وتسكن في برلين. تشرب الشاي وتحب الحياكة، رغم أنها في الحقيقة لا وقت لديها. لأن الجدة
    هيلدي هي أفضل هاكرة في ألمانيا — رغم أن لا أحد يعرف ذلك. إنها تودّ الحصول على رمز الواي فاي للمدينة كلها.
