- key: s3
  source: d0bf2e68429af38b
  translation: في الثالثة صباحًا تجلس هيلدي أمام حاسوبها المحمول الصغير. تودّ أن تنام، لكنها تواصل العمل، رغم أن قطتها تحتج
    بصوت عالٍ. إنها تودّ قهوة قوية، لكن لديها فقط 1000 كوب شاي.
