- key: s2
  source: e2f01ebae879a7b9
  translation: 'رمز الواي فاي في برلين يتكوّن من ألف رمز، وهذا يجعل الجدة هيلدي غاضبة. إنها تودّ تغيير رمز المدينة كلها. لكن
    العمدة يقول: «لا يُسمح لك بذلك!» — رغم أن هيلدي تخترق أفضل منه بكثير.'
