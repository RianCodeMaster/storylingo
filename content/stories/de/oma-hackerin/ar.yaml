- key: s5
  source: 7829af5453213b0f
  translation: '1000 شخص يقفون أمام باب هيلدي، والجميع يودّون الحصول على الرمز الجديد. تودّ هيلدي أن تساعد، لكنها نسيت الرمز
    نفسه. حينها تقفز قطتها على لوحة المفاتيح وتكتب: «HILDE123». تعود المدينة إلى الواي فاي من جديد، وتودّ الجدة هيلدي قليلًا
    من الهدوء — لكن الآن يعرف الجميع رمزها.'
