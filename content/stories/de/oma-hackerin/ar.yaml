- key: s4
  source: 3901cfc8cc401105
  translation: 'رغم أن الرمز يحتوي ألف حرف، تدخل هيلدي إليه في عشر دقائق. إنها تودّ أن تفعل شيئًا جريئًا، ولذلك تغيّر رمز
    المدينة كلها. الرمز الجديد هو: «HILDE123». فجأة تصبح المدينة كلها غير متصلة — 1000 شخص يقفون في الشارع ويصرخون.'
