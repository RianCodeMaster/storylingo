- key: s3
  source: 96323d8ccf464b9a
  translation: 'لدى بول بروكلي في الثلاجة. لكن كلاوس لا يريد جزرًا. كلاوس يتكلم بصوت عالٍ: «أريد شوكولاتة!» بول جائع.'
  glosses:
    hat: لديه
    Brokkoli: بروكلي
