summary: بول لديه ثلاجة تتكلم ولا تريد إلا الشوكولاتة، لكن بول يريد الخضار — حتى تنقذ الموقف قطعة شوكولاتة غريبة جدًا.
summary_source: 2866dcaf0f19dd56
gestures:
  have: احتضن صندوقًا كبيرًا غير مرئي إلى صدرك وأومئ بفخر كأنك تملك العالم كله.
  want: مدّ ذراعيك أمامك وافتح كفيك وأغلقهما بنهم، ولحس شفتيك.
  speak: 'ضع يدك قرب فمك وحرّكها كمنقار يثرثر وأنت تقول: «بلاه بلاه بلاه».'
targets:
  hat:
    gloss: لديه / يملك
    note: 'في الألمانية يتغير الفعل مع الفاعل: هو hat؛ العربية تلحق الضمير بالفعل أو تأتي به منفصلاً.'
  will:
    gloss: يريد
    note: في الألمانية يأتي بعد will الفعل في نهاية الجملة؛ في العربية «يريد» يأخذ مفعولاً.
  spricht:
    gloss: يتكلم
    note: spricht من sprechen مع هو؛ العربية تقول «هو يتكلم» وتضيف الضمير.
scenes:
- key: s1
  source: 6538747ffe8d3bed
  translation: 'لدى بول ثلاجة. الثلاجة اسمها كلاوس. كلاوس يتكلم. كلاوس يقول كل يوم: «مرحبًا بول!»'
  glosses:
    hat: لديه
    Kühlschrank: ثلاجة
    heißt: اسمه
    spricht: يتكلم
    jeden: كل
    Tag: يوم
- key: s2
  source: 49d47b6360eb39b3
  translation: كلاوس يريد شوكولاتة. كلاوس يريد 1000 لوح شوكولاتة. بول يريد خضارًا. بول يريد بروكلي وجزرًا.
  glosses:
    will: يريد
    Schokolade: شوكولاتة
    Tafeln: ألواح
    Gemüse: خضار
