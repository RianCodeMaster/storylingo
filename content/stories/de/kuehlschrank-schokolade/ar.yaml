- key: s5
  source: 963dae63b107035c
  translation: 'لدى بول شوكولاتة بالبروكلي. كلاوس يريد الشوكولاتة. يأكل كلاوس ويتكلم: «مم، بروكلي!» الآن يريد كلاوس خضارًا.'
  glosses:
