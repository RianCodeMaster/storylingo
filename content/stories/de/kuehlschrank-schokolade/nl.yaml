# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Paul heeft een pratende koelkast die alleen chocolade wil, maar Paul wil groente — tot een heel vreemde chocoladereep
  alles redt.
summary_source: 2866dcaf0f19dd56
gestures:
  have: Druk een onzichtbare grote doos tegen je borst en knik trots, alsof je de hele wereld bezit.
  want: Strek beide armen voor je uit, open en sluit je handen gretig en lik je lippen.
  speak: Houd je hand naast je mond en laat hem als een kletsende snavel flapperen terwijl je 'blah blah blah' zegt.
targets:
  hat:
    gloss: heeft
    note: Duitse 3e persoon van haben; Nederlands 'heeft' is ook onregelmatig.
  will:
    gloss: wil
    note: Duitse modal voor 'wil'; Nederlands gebruikt ook 'wil' zonder -t.
  spricht:
    gloss: spreekt
    note: Duitse 3e persoon van sprechen; vergelijk Nederlands 'spreekt'.
