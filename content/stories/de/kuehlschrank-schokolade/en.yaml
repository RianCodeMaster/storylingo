    Kühlschrank: fridge
    heißt: is called
    spricht: speaks
    jeden: every
    Tag: day
- key: s2
  source: 49d47b6360eb39b3
  translation: Klaus wants chocolate. Klaus wants 1,000 bars of chocolate. Paul wants vegetables. Paul wants broccoli and
    carrots.
  glosses:
