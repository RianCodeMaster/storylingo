# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Paul has a talking fridge that only wants chocolate, but Paul wants vegetables — until a very strange chocolate bar
  saves the day.
summary_source: 2866dcaf0f19dd56
gestures:
  have: Hug an invisible giant box against your chest and nod proudly, like you own the whole world.
  want: Stretch both arms out in front of you, open and close your hands greedily, and lick your lips.
  speak: Put your hand next to your mouth and flap it like a chattering beak while saying 'blah blah blah'.
targets:
  hat:
    gloss: has
    note: German verb endings change; 'hat' is the he/she form of 'haben', like English 'has'.
  will:
    gloss: wants
    note: German 'will' means 'wants'; English 'will' is a future helper.
  spricht:
    gloss: speaks
    note: In German the vowel changes in 'sprechen' to 'spricht' for he/she; English 'speaks' adds -s.
scenes:
