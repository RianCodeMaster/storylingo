  summary: Paul has a talking fridge that only wants chocolate, but Paul wants vegetables — until a very strange chocolate
    bar saves the day.
  gestures:
  - concept: have
    description: Hug an invisible giant box against your chest and nod proudly, like you own the whole world.
    emoji: 🤲
  - concept: want
    description: Stretch both arms out in front of you, open and close your hands greedily, and lick your lips.
    emoji: 🍫
  - concept: speak
    description: Put your hand next to your mouth and flap it like a chattering beak while saying 'blah blah blah'.
    emoji: 🗣️
