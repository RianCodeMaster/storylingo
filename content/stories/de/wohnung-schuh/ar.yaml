summary: تبحث ميا عن شقة رخيصة في برلين، وتجد شقة صغيرة جدًا كعلبة حذاء، وتحل مشكلة الأثاث بأثاث الدمى.
summary_source: fbe28ed0668cb1b8
gestures:
  search: ضع يديك حول عينيك كمنظار وحرك رأسك يمينًا ويسارًا كأنك تفحص الغرفة.
  small: اقرّب طرف الإبهام والسبابة قليلًا أمام أنفك وغمض عينًا واحدة.
  there_is: ارفع سبابتك في الهواء كأنك تفعل سحرًا وافتح يدك الأخرى تحتها وقل هيا.
targets:
  sucht:
    gloss: تبحث عن
    note: 'في العربية يتغير الفعل مع الفاعل: هي تبحث؛ وفي الألمانية نضيف -t للفاعل sie.'
  ist klein:
    gloss: صغيرة
    note: 'في العربية لا نحتاج تكون في الجملة الاسمية: الشقة صغيرة؛ والألمانية تحتاج ist.'
  es gibt:
    gloss: يوجد
    note: مثل يوجد في العربية، وبعدها يأتي اسم في حالة النصب في الألمانية.
