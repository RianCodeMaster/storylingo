# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Mia looks for a cheap flat in Berlin, finds one that is as small as a shoebox, and solves the furniture problem with
  doll furniture.
summary_source: fbe28ed0668cb1b8
gestures:
  search: Cup both hands around your eyes like binoculars, turn your head left and right and scan the room.
  small: Hold your thumb and index finger a tiny bit apart right in front of your nose and squint one eye.
  there_is: Pop your index finger up in the air like a magic trick and open your other hand flat under it, saying 'ta-da!'.
targets:
  sucht:
    gloss: looks for
    note: German adds -t for he/she/it, while English adds -s in 'looks'.
  ist klein:
    gloss: is small
    note: German adjectives stay the same after 'ist'; English also keeps 'small' plain.
  es gibt:
    gloss: there is
    note: German uses 'es gibt' (literally 'it gives') for English 'there is/are'.
