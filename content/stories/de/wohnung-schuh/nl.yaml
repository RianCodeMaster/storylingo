# What a learner with this base language reads around the story. Made by `storylingo.py localize`; corrections by
# hand are welcome (then: storylingo.py sync). Each scene names its story.yaml scene (key) and what it was
# translated from (source): when that scene changes, localize translates it again.
summary: Mia zoekt een goedkope woning in Berlijn, vindt er een die zo klein is als een schoenendoos, en lost het meubelprobleem
  op met poppenmeubels.
summary_source: fbe28ed0668cb1b8
gestures:
  search: Maak van je handen een verrekijker, draai je hoofd heen en weer en speur de kamer af.
  small: Houd duim en wijsvinger heel dicht bij elkaar voor je neus en knijp één oog dicht.
  there_is: Schiet je wijsvinger omhoog als een goocheltruc, houd je andere hand er open onder en zeg 'ta-da!'.
targets:
  sucht:
    gloss: zoekt
    note: 'Net als Nederlands ''zoekt'': bij hij/zij komt er een -t bij.'
  ist klein:
    gloss: is klein
    note: Na 'ist' blijft 'klein' onveranderd, net als na Nederlands 'is'.
  es gibt:
    gloss: er is, er zijn
    note: Letterlijk 'het geeft'; Nederlands zegt 'er is' of 'er zijn'.
