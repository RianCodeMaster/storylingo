  example: أحيانًا أتمشى في المساء.
sofort:
  meaning: فورًا
  example: سآتي إلى المحطة فورًا.
da:
  meaning: هناك
  example: هناك حقيبة ظهري الجديدة.
erst:
  meaning: ليس قبل
  example: الحافلة لا تأتي قبل الثامنة.
der Mund:
  meaning: الفم
  example: فمي جاف.
das Ohr:
  meaning: الأذن
  example: أذني تؤلمني.
der Hals:
  meaning: الرقبة، الحلق
  example: حلقي يؤلمني.
der Rücken:
  meaning: الظهر
  example: ظهري يؤلمني اليوم.
das Wohnzimmer:
  meaning: غرفة المعيشة
  example: غرفة المعيشة مشرقة جدًا.
das Schlafzimmer:
  meaning: غرفة النوم
  example: غرفة النوم مظلمة.
der Spiegel:
  meaning: المرآة
  example: المرآة معلقة في الحمام.
die Gabel:
  meaning: الشوكة
  example: الشوكة بجانب الطبق.
das Messer:
  meaning: السكين
  example: السكين على الطاولة.
der Löffel:
  meaning: الملعقة
  example: أحتاج ملعقة للحساء.
die Schokolade:
  meaning: الشوكولاتة
  example: الشوكولاتة حلوة جدًا.
das Papier:
  meaning: الورق
  example: أحتاج ورقًا للطابعة.
der Stift:
  meaning: القلم
  example: القلم على الطاولة.
der Rucksack:
  meaning: حقيبة الظهر
  example: حقيبة ظهري ثقيلة جدًا.
der Bahnsteig:
  meaning: الرصيف
  example: يغادر القطار من الرصيف الثالث.
die Verspätung:
  meaning: التأخير
  example: القطار متأخر عشر دقائق.
