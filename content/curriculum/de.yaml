# German: the structures stories practise, per level. Briefs take 2-3 of these (content/briefs/de/).
# `check` makes sure every story's targets are listed here at the story's level or below.
# concept: the language-neutral meaning that owns the gesture; Spanish reuses them (curriculum/es.yaml).
A1:
  - {text: will, gloss: wil, concept: want}
  - {text: kann nicht, gloss: kan niet, concept: cannot}
  - {text: mag, gloss: houdt van / vindt lekker, concept: like}
  - {text: hat, gloss: heeft, concept: have}
  - {text: es gibt, gloss: er is / er zijn, concept: there_is}
  - {text: "geht", gloss: "goes", concept: go}
  - {text: "kauft", gloss: "buys", concept: buy}
  - {text: "isst", gloss: "eats", concept: eat}
  - {text: "wartet", gloss: "waits", concept: wait}
  - {text: "kommt", gloss: "comes", concept: come}
  - {text: "mitnehmen", gloss: "take along; separable: Das Kamel nimmt sie mit", concept: take_along}
  - {text: "spricht", gloss: "speaks", concept: speak}
  - {text: "sucht", gloss: "looks for", concept: search}
  - {text: "ist klein", gloss: "is small", concept: small}
