  hint: I will come later
- text: Ich bin zu spät.
  hint: I am late
- text: Wo ist mein Zimmer?
  hint: Where is my room?
- text: Wann kommt der Bus?
  hint: When does the bus come?
- text: Muss ich umsteigen?
  hint: Do I have to change?
- text: Ich möchte aussteigen.
  hint: I want to get off
- text: Ist dieser Platz frei?
  hint: Is this seat free?
- text: Ich suche mein Hotel.
  hint: I am looking for my hotel
- text: Ich gehe nach Hause.
  hint: I am going home
- text: Ich bin zu Hause.
  hint: I am at home
- text: Ich komme gleich.
  hint: I am coming soon
- text: Kann ich Ihnen helfen?
  hint: Can I help you? formal
- text: Was machst du?
  hint: What are you doing? informal
- text: Wie war dein Tag?
  hint: How was your day?
- text: Mir ist kalt.
  hint: I am cold; feeling cold
