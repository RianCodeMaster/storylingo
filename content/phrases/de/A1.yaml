- text: Ich brauche Hilfe.
  hint: I need help
- text: Wo ist die Toilette?
  hint: Where is the toilet?
- text: Wo ist der Supermarkt?
  hint: Where is the supermarket?
- text: Ich möchte bezahlen.
  hint: I would like to pay
- text: Kann ich mit Karte zahlen?
  hint: Can I pay by card?
- text: Das ist alles.
  hint: That is all; in a shop
- text: Ich möchte ein Wasser, bitte.
  hint: I would like a water, please
- text: Die Speisekarte, bitte.
