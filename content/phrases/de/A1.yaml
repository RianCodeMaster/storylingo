  hint: Do you have a bag?
- text: Zusammen oder getrennt?
  hint: Together or separate?
- text: Noch einen Kaffee, bitte.
  hint: Another coffee please
- text: Kann ich bitte bestellen?
  hint: Can I order please?
- text: Ich hätte gern ein Brot.
  hint: I'd like a loaf of bread
