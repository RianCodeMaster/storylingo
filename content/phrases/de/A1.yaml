# Phrases for the phrases section, in learning order: the most useful first. Every edition with this target language
# shows them. Edit freely (a changed text is a new phrase: it needs a meaning again, `localize-phrases` adds it),
# then: storylingo.py sync. hint: English, for the translator and for you; learners never see it.
- text: Guten Morgen.
  hint: Good morning
- text: Guten Tag.
  hint: Hello / good day
- text: Hallo, wie geht's?
  hint: Hello, how are you?
- text: Mir geht es gut.
  hint: I'm fine
- text: Danke, gut.
  hint: Thanks, good
- text: Auf Wiedersehen.
  hint: Goodbye
- text: Tschüss, bis später.
  hint: Bye, see you later
- text: Bitte schön.
  hint: You're welcome / here you are
- text: Entschuldigung, ich habe eine Frage.
  hint: Excuse me, I have a question
- text: Wie bitte?
  hint: Pardon?
- text: Ich verstehe nicht.
  hint: I don't understand
- text: Sprechen Sie Englisch?
  hint: Do you speak English?
- text: Können Sie das wiederholen?
  hint: Can you repeat that?
- text: Wie heißt du?
  hint: What's your name? informal
- text: Ich heiße Anna.
  hint: My name is Anna
- text: Ich komme aus Deutschland.
  hint: I come from Germany
- text: Ich wohne hier.
  hint: I live here
- text: Wie geht es Ihnen?
  hint: How are you? formal
- text: Danke, und Ihnen?
  hint: Thanks, and you? formal
- text: Es tut mir leid.
  hint: I'm sorry
- text: Kein Problem.
  hint: No problem
- text: Ich möchte einen Kaffee, bitte.
  hint: I'd like a coffee, please
- text: Was kostet das?
  hint: How much is that?
- text: Das ist zu teuer.
  hint: That's too expensive
- text: Ich nehme das.
  hint: I'll take that
- text: Haben Sie das in groß?
  hint: Do you have this in large?
- text: Die Rechnung, bitte.
  hint: The bill, please
- text: Wo ist der Bahnhof?
  hint: Where is the train station?
- text: Wie komme ich zum Zentrum?
  hint: How do I get to the center?
- text: Wann fährt der Zug?
  hint: When does the train leave?
- text: Eine Fahrkarte nach Berlin, bitte.
  hint: One ticket to Berlin, please
- text: Ich habe einen Termin.
  hint: I have an appointment
- text: Können Sie mir helfen?
  hint: Can you help me?
- text: Ich brauche einen Arzt.
  hint: I need a doctor
