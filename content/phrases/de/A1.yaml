  hint: Get well soon
- text: Ich arbeite hier.
  hint: I work here
- text: Ich habe keine Zeit.
  hint: I have no time
- text: Bis morgen.
  hint: See you tomorrow
- text: Viel Glück!
  hint: Good luck
- text: Herzlichen Glückwunsch!
  hint: Congratulations
- text: Freut mich, Sie kennenzulernen.
  hint: Nice to meet you
- text: Wie spät ist es?
  hint: What time is it?
- text: Ich bin müde.
  hint: I am tired
- text: Ich habe Hunger.
  hint: I am hungry
- text: Ich habe Durst.
  hint: I am thirsty
- text: Ich mag das.
  hint: I like that
- text: Guten Abend.
  hint: Good evening; greeting when you arrive
