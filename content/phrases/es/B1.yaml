- text: ¿Me lo vuelves a explicar?
  hint: Ask to explain it again
- text: No me he enterado de nada.
  hint: I didn't understand anything
- text: ¿Qué quieres decir con eso?
  hint: What do you mean by that?
- text: Me lo apunto, gracias.
  hint: I'll note it down, thanks
- text: ¿Te importa si abro la ventana?
  hint: Do you mind if I open it?
- text: ¿Podrías pasarme la sal?
