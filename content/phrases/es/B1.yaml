- text: Te lo mando en cuanto pueda.
  hint: I'll send it as soon as I can
- text: ¿Podemos dejar la reunión para mañana?
  hint: Can we postpone to tomorrow?
- text: No me ha llegado tu correo.
  hint: I didn't get your email
- text: ¿Me confirmas que lo has recibido?
  hint: Can you confirm you got it?
- text: Lo siento, no he podido terminarlo.
  hint: Sorry, I couldn't finish it
- text: Voy a pedir el día libre.
  hint: I'm going to ask for the day off
- text: Se me ha pasado por completo.
