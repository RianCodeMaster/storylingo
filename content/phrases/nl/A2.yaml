- text: Ik ben het niet met je eens.
  hint: opinion; I disagree with you
- text: Ik maak me zorgen om je.
  hint: feelings; I am worried about you
- text: Ik ben bang voor honden.
  hint: feelings; I am afraid of dogs
- text: Ik voel me eenzaam.
  hint: feelings; I feel lonely
- text: Ik wil graag iets vragen.
  hint: I'd like to ask something.
- text: Kunt u mij helpen met dit formulier?
  hint: Can you help with this form?
- text: Kan ik vandaag nog terecht?
  hint: Can I come today?
- text: Waar kan ik dit inleveren?
