# Phrases for the phrases section, in learning order: the most useful first. Every edition with this target language
# shows them. Edit freely (a changed text is a new phrase: it needs a meaning again, `localize-phrases` adds it),
# then: storylingo.py sync. hint: English, for the translator and for you; learners never see it.
- text: Ik heb een probleem.
  hint: I have a problem; general issue.
- text: Kunt u mij de weg wijzen?
  hint: Can you show me the way?
- text: Waar kan ik afrekenen?
  hint: Where do I pay?
- text: Heeft u een tafel voor twee?
  hint: Do you have a table for two?
- text: Ik wil graag bestellen.
  hint: I would like to order.
- text: Kan ik dit meenemen?
  hint: Can I take this away?
- text: Hoeveel moet ik betalen?
  hint: How much do I pay?
- text: Kan ik dit laten repareren?
  hint: Can I have this repaired?
- text: Wanneer is het klaar?
  hint: When will it be ready?
- text: Het werkt niet meer.
  hint: It no longer works.
- text: Ik ben mijn pas kwijt.
  hint: I lost my card/pass.
- text: Kunt u dat per e-mail sturen?
  hint: Can you email that to me?
- text: Ik heb een vraag over de factuur.
  hint: I have a question about the invoice.
- text: Wilt u dit ondertekenen?
  hint: Would you sign this?
- text: Waar moet ik tekenen?
  hint: Where do I sign?
- text: Ik kan niet komen.
  hint: I cannot come; appointment.
- text: Ik moet helaas afzeggen.
  hint: I have to cancel, unfortunately.
- text: Kan de afspraak later?
  hint: Can the appointment be later?
- text: Wanneer heeft u tijd?
  hint: When do you have time?
- text: Ik kom voor een controle.
  hint: I am here for a check-up.
- text: Ik heb last van mijn maag.
  hint: My stomach is bothering me.
- text: Waar kan ik het recept ophalen?
  hint: Where can I collect the prescription?
- text: Heeft u iets tegen hoofdpijn?
  hint: Do you have anything for a headache?
- text: Ik moet dit dagelijks innemen.
  hint: I must take this daily.
- text: Ik ben vandaag niet bereikbaar.
  hint: I am unavailable today.
- text: Ik werk vandaag thuis.
  hint: I am working from home today.
- text: De vergadering begint om tien uur.
  hint: The meeting starts at ten.
- text: Ik ben bijna klaar.
  hint: I am almost finished.
- text: Dat regel ik wel.
  hint: I will arrange it myself.
- text: Kunt u dit controleren?
  hint: Can you check this?
- text: De trein heeft vertraging.
  hint: The train is delayed.
- text: Van welk perron vertrekt de trein?
  hint: Which platform does the train leave?
- text: Hoe laat komt de bus?
  hint: What time does the bus come?
- text: Moet ik hier inchecken?
  hint: Do I check in here?
- text: Mag ik hier zitten?
  hint: May I sit here?
- text: Kunt u mij waarschuwen?
  hint: Can you warn me?
- text: Het is aan de linkerkant.
  hint: It is on the left side.
- text: Ga rechtdoor bij het stoplicht.
  hint: Go straight at the traffic lights.
- text: Ik ben hier niet bekend.
  hint: I am not from around here.
- text: Ik ben de sleutel vergeten.
  hint: I forgot the key.
- text: Ik heb me buitengesloten.
  hint: I locked myself out.
- text: De verwarming werkt niet.
  hint: The heating is not working.
- text: Er is geen warm water.
  hint: There is no hot water.
- text: Ik ga boodschappen doen.
  hint: I am going shopping.
- text: We hebben geen melk meer.
  hint: We have no milk left.
- text: Kun je melk meenemen?
  hint: Can you bring milk?
- text: Ik heb er geen zin in.
  hint: I do not feel like it.
- text: Het gaat wel.
  hint: I am doing okay.
- text: Dat is niet erg.
  hint: That is not a problem.
- text: Laat het me weten.
  hint: Let me know; keep me informed.
- text: Hoe is het met je?
  hint: Asking how someone is doing
- text: Tot de volgende keer.
  hint: Saying goodbye until next time
- text: Wat kan ik voor u doen?
  hint: Offering help in a shop
- text: Waar kan ik een kaartje kopen?
  hint: Asking where to buy a ticket
- text: Gaat deze bus naar het station?
  hint: Checking bus destination
- text: Hoe lang moet ik wachten?
  hint: Asking about waiting time
- text: Is deze stoel vrij?
  hint: Asking if seat is free
- text: Waar is de paskamer?
  hint: Looking for fitting room
- text: Hoeveel kosten deze appels?
  hint: Asking price of apples
- text: Kun je het inpakken?
  hint: Asking for gift wrapping
- text: Hebt u een andere kleur?
  hint: Asking for another colour
- text: Mag ik een glas water?
  hint: Polite request for water
- text: Waar doet het pijn?
