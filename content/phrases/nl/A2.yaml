- text: Wat moet ik doen?
  hint: Asking for advice
- text: Heb je hulp nodig?
  hint: Offering help
- text: Hoe gaat het ermee?
  hint: greeting; how are you doing?
- text: Hoe was je weekend?
  hint: small talk; how was your weekend?
- text: Fijn dat je er bent.
  hint: welcome; glad you are here
- text: Kun je me een bericht sturen?
  hint: request; send me a message
- text: Kun je me vanavond bellen?
  hint: request; call me this evening
- text: Ik hoor het graag van je.
  hint: say when you want news
- text: Kun je me een seintje geven?
  hint: ask for a signal or update
- text: Waar staat de melk?
  hint: supermarket; asking where milk is
- text: Kan ik dit retourneren?
  hint: shop; can I return this?
- text: Mag ik met de kaart betalen?
  hint: shop; pay by card?
- text: Heeft u deze in maat M?
  hint: clothes shop; asking for size M
- text: Waar moet ik betalen?
  hint: shop; asking where to pay
- text: Doet u dat in een zakje?
  hint: shop; ask for a bag
- text: Kan ik dit laten bezorgen?
