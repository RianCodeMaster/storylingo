- text: Ik stuur je de bestanden.
  hint: work; I will send files
- text: De deadline is volgende week.
  hint: work; deadline is next week
- text: Ik neem een dag vrij.
  hint: work; take a day off
- text: Mijn rooster is veranderd.
  hint: work; my schedule has changed
- text: Kunnen we even overleggen?
  hint: work; can we discuss briefly?
- text: Ik heb een vraag over mijn salaris.
  hint: work; question about my salary
- text: Wanneer is de volgende vergadering?
  hint: work; when is next meeting?
- text: Ik voel me al dagen niet goed.
  hint: doctor; I have felt unwell for days
- text: Ik ben gisteren gevallen.
  hint: doctor; I fell yesterday
- text: Ik heb een afspraak bij de dokter.
  hint: doctor; I have an appointment
- text: Ik ben allergisch voor noten.
