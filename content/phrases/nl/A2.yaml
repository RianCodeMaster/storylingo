- text: Hoe laat gaat de volgende bus?
  hint: transport; when is next bus?
- text: Ik wil graag een kaartje kopen.
  hint: transport; I want to buy a ticket
- text: Kan ik hier instappen?
  hint: transport; can I board here?
- text: De bus is net weg.
  hint: transport; the bus just left
- text: Hoe lang duurt het nog?
  hint: transport; how much longer?
- text: Ik moet de tram nog halen.
  hint: transport; I still need the tram
- text: De kraan lekt.
  hint: home; the tap is leaking
- text: Het toilet is verstopt.
  hint: home; the toilet is blocked
- text: De stroom is uitgevallen.
  hint: home; power has gone out
- text: Kun je de deur opendoen?
  hint: home; can you open the door?
- text: Kun je het raam dichtdoen?
