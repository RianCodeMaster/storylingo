- text: Ik kom voor mijn uitslag.
  hint: At doctor for test results
- text: Ik zit in een vergadering.
  hint: Cannot talk; in a meeting
- text: Kunnen we morgen praten?
  hint: Suggesting talk tomorrow
- text: Wanneer is de pauze?
  hint: Asking when break is
- text: Waar is de printer?
  hint: Looking for printer
- text: Mijn computer is kapot.
  hint: Reporting broken computer
- text: Ik ben morgen niet op kantoor.
  hint: Not in office tomorrow
- text: Ik heb de e-mail ontvangen.
  hint: Confirming email received
- text: Ik heb een vraag over mijn rooster.
  hint: Question about work schedule
- text: Kun je de tafel dekken?
  hint: Asking to set the table
- text: Kun je het raam openen?
  hint: Asking to open window
- text: De sleutel past niet.
  hint: Key does not fit
- text: Het water is te warm.
  hint: Water is too hot
- text: Kun je de vuilnis buiten zetten?
  hint: Asking to take out rubbish
- text: Het licht is kapot.
  hint: Reporting broken light
- text: De wasmachine is klaar.
  hint: Washing machine has finished
- text: We hebben geen brood meer.
  hint: No bread left at home
- text: De buurman maakt veel lawaai.
  hint: Complaining about neighbour noise
- text: Kun je de verwarming hoger zetten?
  hint: Asking to raise heating
- text: Dat vind ik leuk.
  hint: Saying you like something
- text: Ik maak me zorgen.
  hint: Saying you are worried
- text: Dat is vervelend.
  hint: Sympathetic reaction to bad news
- text: Wat goed van je!
  hint: Praising someone's achievement
- text: Wat leuk voor je!
  hint: Happy for someone
- text: Ik ben trots op je.
  hint: Saying you are proud
- text: Het komt wel goed.
  hint: Reassuring someone
- text: Ik heb er zin in.
  hint: Looking forward to something
- text: Ik verveel me.
  hint: Saying you are bored
- text: Dat maakt me boos.
  hint: Saying something angers you
- text: Ik voel me verdrietig.
  hint: Saying you feel sad
- text: Ik ben bang dat ik te laat kom.
  hint: Afraid you will be late
- text: Wat is er gebeurd?
