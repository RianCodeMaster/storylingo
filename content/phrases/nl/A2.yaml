- text: Kan ik dit online bestellen?
  hint: Can I order this online?
- text: Waar kan ik de auto parkeren?
  hint: Where can I park the car?
- text: Hoeveel haltes moet ik nog?
  hint: How many stops are left?
- text: Ik heb mijn trein gemist.
  hint: I missed my train.
- text: Is dit een directe trein?
  hint: Is this a direct train?
- text: Waar kan ik mijn kaart opladen?
  hint: Where can I top up my card?
- text: Ik ben op het verkeerde perron.
  hint: I am on the wrong platform.
- text: Kan ik mijn ticket annuleren?
