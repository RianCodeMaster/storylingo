    icon: ⭐
    title: StoryLingo Plus
    text: كل القصص والجمل بلا حدود، كل يوم.
    perks:
      - كل القصص في كل المستويات، وقصص جديدة باستمرار
      - قصص بلا حد يومي
      - كل الجمل، 200 جملة لكل مستوى
      - مراجعة الكلمات بلا حدود
