# Plus for Dutch: everything of the language without limits (docs/plus.md). Without it the `free` limits apply in
# every edition below. Change a number here, then storylingo.py sync (and --cloud): the app and the database follow.

slug: plus-nl
status: live
kind: membership
editions: [hollanda]
visibility: everyone
prices:
  - {amount: 699, currency: eur, interval: month}
  - {amount: 3900, currency: eur, interval: year}
free:
  stories_per_level: 2     # per level the first 2 stories (in the order the app shows them)
  stories_per_day: 1       # of which 1 new story a day; replaying a story is always free
  phrases_per_level: 30    # per level the first 30 phrases
  phrases_per_day: 10      # of which 10 new a day
  reviews_per_day: 20      # word review: 20 cards a day
texts:
