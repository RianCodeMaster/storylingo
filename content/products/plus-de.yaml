# Plus for German: everything of the language without limits (docs/plus.md). Without it the `free` limits apply in
# every edition below. Change a number here, then storylingo.py sync (and --cloud): the app and the database follow.

slug: plus-de
status: live
kind: membership
editions: [almanya, duits, german]
visibility: everyone
prices:
  - {amount: 849, currency: eur, interval: month}
  - {amount: 7900, currency: eur, interval: year}
free:
  stories_per_level: 2     # per level the first 2 stories (in the order the app shows them)
  stories_per_day: 1       # of which 1 new story a day; replaying a story is always free
  phrases_per_level: 10    # per level the first 10 phrases
  phrases_per_topic: 5     # and per level the first 5 of every topic (gezondheid, werk, ...)
  phrases_per_day: 10      # of which 10 new a day
  words_per_level: 50      # word trainer: per level the first 50 words
  words_per_topic: 5       # and per level the first 5 of every topic
  words_per_day: 10        # of which 10 new a day
  reviews_per_day: 20      # word review: 20 cards a day
texts:
  ar:
    icon: ⭐
    title: Qissio Plus
    text: "كل شيء في اللغة، بلا حدود. لن تنتهي من التعلّم: هناك دائمًا المزيد."
    perks:
      - "كل القصص في كل المستويات، وقصص جديدة باستمرار"
      - "قصص بقدر ما تريد كل يوم، بلا حد يومي"
      - "كل الجمل للحياة اليومية، {phrases} جملة حتى الآن: عند الطبيب، في العمل، في المتجر، وتزداد باستمرار"
      - "مدرّب الكلمات: {words} كلمة حتى الآن، لكل كلمة جملة مثال، والقائمة تكبر باستمرار"
      - "مراجعة الكلمات بلا حدود، في اللحظة التي تكاد تنساها فيها"
      - "تعلّم بإيقاعك: ربع ساعة أو المساء كله"
      - "اشتراك واحد للغة كلها، بأي لغة تستخدم التطبيق"
  nl:
    icon: ⭐
    title: Qissio Plus
    text: "Alles van de taal, zonder limiet. Je raakt niet uitgeleerd: er komt steeds meer bij."
    perks:
      - "Alle verhalen van {levels}, en er komen steeds nieuwe bij"
      - "Zoveel verhalen per dag als je wilt, zonder daglimiet"
      - "Alle zinnen voor het echte leven, nu al {phrases}: bij de dokter, op je werk, in de winkel, en er komen er steeds meer bij"
      - "Een woordentrainer met nu al {words} woorden, elk met een voorbeeldzin, en de lijst groeit steeds verder"
      - "Onbeperkt woorden herhalen, precies op het moment dat je ze dreigt te vergeten"
      - "Leer in je eigen tempo: een kwartier of de hele avond"
      - "Eén abonnement voor de hele taal, in welke taal je de app ook gebruikt"
  en:
    icon: ⭐
    title: Qissio Plus
    text: "Everything in the language, no limits. You won't run out: there is always more coming."
    perks:
      - "Every story from {levels}, with new ones added all the time"
      - "As many stories a day as you like, no daily limit"
      - "Every phrase for real life, already {phrases}: at the doctor, at work, in the shop, and the list keeps growing"
      - "A word trainer with already {words} words, each with an example sentence, and the list keeps growing"
      - "Unlimited word review, right when you are about to forget a word"
      - "Learn at your own pace: fifteen minutes or the whole evening"
      - "One subscription for the whole language, whatever language you use the app in"
