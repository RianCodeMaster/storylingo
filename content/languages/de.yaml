# A language you can LEARN (target). Copy this file for a new target language.
#
# Everything about a language lives here, nowhere else: the app, the pipeline and the database read it
# (storylingo.py sync writes the database rows and web/lib/languages.json).
#
# voice:     the narrator. Swap a voice (e.g. ElevenLabs) by editing this block; `storylingo.py media` then remakes
#            every recording of this language, because each recording remembers the voice it was made with.
#   provider:  piper   free, on this machine (localgen/server.py).
#                      Models: .venv-local/Scripts/python -m piper.download_voices --data-dir voices/piper <name>
#              gemini  paid (GEMINI_API_KEY with credit)
#              elevenlabs  paid, the most natural (ELEVENLABS_API_KEY). Optional: speakers, narrators, teacher.
#              New provider: one class with a speech() method in pipeline/media.py, registered in SPEAKERS.
#   settings:  used for every style unless the style says otherwise.
#   styles:    emotion -> how to speak it. Emotions without a style use "neutral".
#              Emotions: amused, angry, disgusted, neutral, sleepy, surprised, whisper (pipeline/models.py).
#   question / word:  the emotion for circling questions and for single words.
#   pause:     seconds of silence between sentences.
# teacher:   what the teacher says in this language. yes/no are recorded once (storylingo.py feedback <code>);
#            after changing them, run that again.
# recognition: words the speech recognizer writes differently from the stories (numbers as digits, "nee" for "nein").
#            Written naturally; accents and case do not matter.

code: de
name: Deutsch
english: German
roles: [target]
direction: ltr
script: latin
speech_tag: de-DE
plural_forms: [one, other]

teacher:
  # A mix of plain and playful, all in easy words: heard after every answer, so learners pick them up as phrases.
  yes:
    - {text: "Ja! Genau!", emotion: amused}
    - {text: "Richtig! Super!", emotion: surprised}
    - {text: "Ja, natürlich!", emotion: neutral}
    - {text: "Sehr gut, das stimmt!", emotion: amused}
    - {text: "Bravo! Du bist ein Genie!", emotion: surprised}
    - {text: "Ja, ja, ja! Fantastisch!", emotion: amused}
    - {text: "Perfekt! Weiter so!", emotion: amused}
    - {text: "Klar! Das weißt du schon!", emotion: neutral}
    - {text: "Wow, du bist schnell!", emotion: surprised}
  no:
    - {text: "Nein, nein, nein!", emotion: surprised}
    - {text: "Oh nein! Das ist falsch.", emotion: surprised}
    - {text: "Leider nicht.", emotion: neutral}
    - {text: "Nein! Was für eine Katastrophe!", emotion: surprised}
    - {text: "Hmm, nicht ganz.", emotion: neutral}
    - {text: "Falsch! Aber gut versucht.", emotion: amused}
    - {text: "Oh je! Das stimmt nicht.", emotion: surprised}
    - {text: "Nein, natürlich nicht!", emotion: amused}
  next: Weiter
  done: Fertig!

recognition:
  eins: "1"
  zwei: "2"
  drei: "3"
  vier: "4"
  fünf: "5"
  sechs: "6"
  sieben: "7"
  acht: "8"
  neun: "9"
  zehn: "10"
  elf: "11"
  zwölf: "12"
  zwanzig: "20"
  hundert: "100"
  einhundert: "100"
  tausend: "1000"
  eintausend: "1000"
  nee: nein
  no: nein
  jo: ja
  jawohl: ja

voice:
  # ElevenLabs (paid; ELEVENLABS_API_KEY in pipeline/.env). The Piper voice that was here is in git history.
  provider: elevenlabs
  pause: 0.5
  question: amused
  word: neutral
  # Stories take turns between the narrators (each story always the same one); questions, words and the teacher's
  # reactions are always spoken by the teacher. IDs from elevenlabs.io > Voices.
  speakers: {george: JBFqnCBsd6RMkjVDRZzb, charlie: IKne3meq5aSn9XLyUdCD, jessica: cgSgspJ2msm6clMCkdW9}
  narrators: [george, charlie, jessica]
  teacher: jessica
  # eleven_v3 acts; stability 0.0 ("creative") lets it act the most.
  settings: {model: eleven_v3, stability: 0.0}
  # Single words and phrases: no acting needed, so Flash (half the credits per character).
  words: {model: eleven_flash_v2_5, stability: 0.5, tag: ""}
  styles:
    # v3 takes stage directions as audio tags (in English, for every language): each sentence's emotion becomes one.
    neutral:   {}
    amused:    {tag: "[playfully]"}
    angry:     {tag: "[angry]"}
    disgusted: {tag: "[disgusted]"}
    sleepy:    {tag: "[sleepy]"}
    surprised: {tag: "[gasps] [excited]"}
    whisper:   {tag: "[whispers]"}
