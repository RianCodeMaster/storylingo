# A language the app SPEAKS (base): buttons, translations, word meanings, grammar tips.
# Copy this file for a new base language, then:
#   1. web/dictionaries/<code>.json: copy nl.json and translate every text (all plural forms of the language)
#   2. storylingo.py sync, then storylingo.py localize-all <code>, then storylingo.py check <code>
#
# script:        latin or arabic; another script (e.g. cyrillic) also needs a font in web/app/[lang]/layout.tsx.
# plural_forms:  the forms Intl.PluralRules gives for this language (CLDR); check makes sure the dictionary has them.
#
# Dutch is also a language you can LEARN (target, the /hollanda edition): teacher, recognition and voice below.
# See de.yaml for what those fields mean.

code: nl
name: Nederlands
english: Dutch
roles: [base, target]
direction: ltr
script: latin
speech_tag: nl-NL
plural_forms: [one, other]

teacher:
  # A mix of plain and playful, all in easy words: heard after every answer, so learners pick them up as phrases.
  yes:
    - {text: "Ja! Precies!", emotion: amused}
    - {text: "Goed zo! Heel goed!", emotion: surprised}
    - {text: "Ja, natuurlijk!", emotion: neutral}
    - {text: "Klopt! Super!", emotion: amused}
    - {text: "Bravo! Jij bent een genie!", emotion: surprised}
    - {text: "Ja, ja, ja! Fantastisch!", emotion: amused}
    - {text: "Perfect! Ga zo door!", emotion: amused}
    - {text: "Ja hoor! Dat weet je al!", emotion: neutral}
    - {text: "Wauw, wat ben jij snel!", emotion: surprised}
  no:
    - {text: "Nee, nee, nee!", emotion: surprised}
    - {text: "O nee! Dat is fout.", emotion: surprised}
    - {text: "Helaas niet.", emotion: neutral}
    - {text: "Nee! Wat een ramp!", emotion: surprised}
    - {text: "Hmm, niet helemaal.", emotion: neutral}
    - {text: "Fout! Maar goed geprobeerd.", emotion: amused}
    - {text: "O jee! Dat klopt niet.", emotion: surprised}
    - {text: "Nee, natuurlijk niet!", emotion: amused}
  next: Verder
  done: Klaar!

recognition:
  twee: "2"
  drie: "3"
  vier: "4"
  vijf: "5"
  zes: "6"
  zeven: "7"
  acht: "8"
  negen: "9"
  tien: "10"
  elf: "11"
  twaalf: "12"
  twintig: "20"
  honderd: "100"
  duizend: "1000"
  neen: nee
  jawel: ja
  jazeker: ja

voice:
  # ElevenLabs (paid; ELEVENLABS_API_KEY in pipeline/.env). The Piper voice that was here is in git history.
  provider: elevenlabs
  pause: 0.5
  question: amused
  word: neutral
  # Stories take turns between the narrators (each story always the same one); questions, words and the teacher's
  # reactions are always spoken by the teacher. IDs from elevenlabs.io > Voices.
  speakers: {george: JBFqnCBsd6RMkjVDRZzb, charlie: IKne3meq5aSn9XLyUdCD, jessica: cgSgspJ2msm6clMCkdW9}
  narrators: [george, charlie, jessica]
  teacher: jessica
  # eleven_v3 acts; stability 0.0 ("creative") lets it act the most.
  settings: {model: eleven_v3, stability: 0.0}
  # Single words and phrases: no acting needed, so Flash (half the credits per character).
  words: {model: eleven_flash_v2_5, stability: 0.5, tag: ""}
  styles:
    # v3 takes stage directions as audio tags (in English, for every language): each sentence's emotion becomes one.
    neutral:   {}
    amused:    {tag: "[playfully]"}
    angry:     {tag: "[angry]"}
    disgusted: {tag: "[disgusted]"}
    sleepy:    {tag: "[sleepy]"}
    surprised: {tag: "[gasps] [excited]"}
    whisper:   {tag: "[whispers]"}
